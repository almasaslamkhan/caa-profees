# To use the OCI Build Service you place a file name ocibuild.conf at the root of your git repo.
# This file, written using the HOCON syntax, will cause a build to automatically be triggered when commits are pushed to your repo.
# The ocibuild.conf file also determines how build service executes the build commands on the source code in your repo.
#
# Build Service Reference: https://confluence.oci.oraclecorp.com/x/7kMZBg
# Where is my build: https://devops.oci.oraclecorp.com/build
# HOCON reference: https://github.com/lightbend/config/blob/master/HOCON.md
# Build Service Slack: #oci_build_svc_users

runnerTag: latest
name: caa-profees-coding-mcp
team: ODA
phoneBookId: digital-assistant
authCompartmentOcid: ocid1.tenancy.oc1..aaaaaaaa4rkxaq7blkecq4ujsblqebqroch2vacsfa25bf4lzupt5b2ypwiq
description: AI Medical Coding Project
triggerOnCommitBranches: ["master", "pull-requests", "release/*"]
releaseBranches: ["master", "dev/*", "release/*"]
enableGit: true

majorVersion: 26
minorVersion: 09
patchversion: ${BLD_NUMBER}
shortversion: ${majorVersion}.${minorVersion}
version: ${shortversion}.${BLD_NUMBER}${?BLD_BRANCH_SUFFIX_LC}
pkgversion: ${shortversion}.${patchversion}

# Please update skillsPkgversion if and only if there is skill change.
skillsPkgversion: 0.0.11184
# Please update ehrmSkillsPkgversion if and only if an EHRM skill changes.
ehrmSkillsPkgversion: 0.0.11182

initialBuildNumber: {
  "master" : 1
  "pull-requests": 1000
  "*" : 10000
}

# We need these branches to trigger pipline automatically
pipelineTriggerConfig: {
  "branchFilter": {
    "build": [
      "ocid1.devopsbuildpipeline.oc1.phx.amaaaaaaemf35wyavqemf4tptnzmaf5s327m2c4jx7jtpx3ucsi6z2fkunoq"
    ],
    "release/current": [
      "ocid1.devopsbuildpipeline.oc1.phx.amaaaaaaemf35wyaa7avc32euo2h5tj3yy7zxpsa3nv5jegbs7dp7jpe77da"
    ]
  }
}


jsonCoverage: coverage/coverage-summary-${version}.json

environment: {
  "COVERAGE_SUMMARY_FILE": ${jsonCoverage}
}

exportVariables {
 # Required by aoa_mcpacman when tracing is enabled. This is propagated into
  # the MCP container runtime configuration by the AEP image build.
  AEP_TRACING_SERVICE: "caa-profees-coding-mcp"
  MCP_MODULE_NAMES: "profees_coding.mcp.aoa_toolkit"
  EXTRA_DEPS: "profees-coding=="${pkgversion}
  IMAGE_NAME: "caa-profees-coding-mcp"
  PUBLISH: "true"
}

steps: [
  {
    name: git-checkout
    type: git
    gitCloneType: full
    cloneSubmodules: false
    artifacts: [
     "**"
    ]
  },
  {
    name: py-tests-linting-formatting-mcp
    type: python
    dependsOn: git-checkout
    pyVersion: 3.12
    runnerImage: build-runner-python-ol8
    pythonCommands: [
      { args: "-m pip install uv==0.9.10" },
      { args: "-m uv sync --extra dev" },
      { args: "-m tox -c tox.ini" }
    ]
    artifacts: [
      ${jsonCoverage},
      "**"
    ]
  },
  {
    name: publish-coverage-to-artifactory
    type: publishgeneric
    dependsOn: py-tests-linting-formatting-mcp
    runStepOnlyWhen: {variable: ${BLD_BRANCH}, values: ["master", "release/*"]}
    repository: "ehr-clinical-dev-generic-local"
    filePathsToPublish: [
      {
        localFile: ${jsonCoverage},
        targetDir: ${phoneBookId}/${name}/${BLD_BRANCH}
      }
    ]
  },
  {
    name: package_profees_skills
    runnerImage: build-runner-python-ol9
    dependsOn:  git-checkout
    runStepOnlyWhen: {variable: ${BLD_BRANCH}, values: ["master", "dev/*"]}
    pyVersion: 3.12
    type: python
    environment: {
      "PIP_TIMEOUT": "100"
    }
    pythonCommands: [
      { args: "-m pip install uv" },
      { args: "-m uv sync --project profees_coding_skills --extra dev" },
      { args: "-m uv version --project profees_coding_skills "${skillsPkgversion} },
      { args: "-m uv build --out-dir profees_coding_skills/dist --clear profees_coding_skills" },
      { args: "profees_coding_skills/scripts/check_wheel_contents.py profees_coding_skills/dist" }
    ]
    artifacts: [
      "profees_coding_skills/dist/*",
      "**"
    ]
  },
  {
    name: publish_profees_skills_dev
    type: publishgeneric
    dependsOn: package_profees_skills
    repository: ohai-cda-shared-library-dev-pypi-local
    skipOnDryRun: false
    filePathsToPublish: [
      {localFile: "profees_coding_skills/dist/*.tar.gz", targetDir: "/profees-skills/"${skillsPkgversion}},
      {localFile: "profees_coding_skills/dist/*.whl", targetDir: "/profees-skills/"${skillsPkgversion}},
    ]
  },
  {
    name: package_profees_coding_ehrm_skills
    runnerImage: build-runner-python-ol9
    dependsOn: git-checkout
    runStepOnlyWhen: {variable: ${BLD_BRANCH}, values: ["master", "dev/*"]}
    pyVersion: 3.12
    type: python
    environment: {
      "PIP_TIMEOUT": "100"
    }
    pythonCommands: [
      { args: "-m pip install uv" },
      { args: "-m uv sync --project profees_coding_ehrm_skills --extra dev" },
      { args: "-m uv version --project profees_coding_ehrm_skills "${ehrmSkillsPkgversion} },
      { args: "-m uv build --out-dir profees_coding_ehrm_skills/dist --clear profees_coding_ehrm_skills" }
    ]
    artifacts: [
      "profees_coding_ehrm_skills/dist/*",
      "**"
    ]
  },
  {
    name: publish_profees_coding_ehrm_skills_dev
    type: publishgeneric
    dependsOn: package_profees_coding_ehrm_skills
    repository: ohai-cda-shared-library-dev-pypi-local
    skipOnDryRun: false
    filePathsToPublish: [
      {localFile: "profees_coding_ehrm_skills/dist/*.tar.gz", targetDir: "/profees-coding-ehrm-skills/"${ehrmSkillsPkgversion}},
      {localFile: "profees_coding_ehrm_skills/dist/*.whl", targetDir: "/profees-coding-ehrm-skills/"${ehrmSkillsPkgversion}},
    ]
  },
  {
    name: package_profees_coding
    runnerImage: build-runner-python-ol9
    dependsOn: py-tests-linting-formatting-mcp
    runStepOnlyWhen: {variable: ${BLD_BRANCH}, values: ["master", "release/*", "dev/*"]}
    type: python
    pyVersion: 3.12
    environment: {
      "PIP_TIMEOUT": "100"
    }
    pythonCommands: [
      { args: "-m pip install uv" },
      { args: "-m uv version "${pkgversion} },
      { args: "-m uv build -o dist ." }
    ]
    artifacts: [
      "**"
    ]
  },
  {
    name: publish_profees_coding
    type: publishgeneric
    dependsOn: package_profees_coding
    repository: ohai-cda-shared-library-release-pypi-local
    skipOnDryRun: false
    filePathsToPublish: [
      { localFile: "dist/*.tar.gz", targetDir: "/profees-coding/"${pkgversion} },
      { localFile: "dist/*.whl", targetDir: "/profees-coding/"${pkgversion} },
    ]
  },
]

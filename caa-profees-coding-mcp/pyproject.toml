[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profees-coding"
version = "0.0.0"  # version will be injected during build
description = "MCP for Profees Coding Project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "acecore>=0.7.524,<0.7.1000",
  "cda-semantic-index==5.1.0",
  "cda-utils==3.1.0",
  "beautifulsoup4==4.15.0",
  "bm25s==0.2.14",
  "faiss-cpu==1.11.0",
 # "fastmcp==3.4.4",
  "jinja2==3.1.6",
 # "langchain==1.3.13",
  "langchain-classic==1.0.8",
  "langchain-community==0.4.2",
 # "langchain-core==1.4.9",
 # "langchain-openai==1.3.4",
 # "langchain-text-splitters==1.1.2",
 # "langgraph==1.2.8",
 "langgraph-checkpoint==4.1.1",
 "langgraph-checkpoint-sqlite==3.1.1",
 # "langsmith==0.10.1",
 "loguru==0.7.3",
 "lxml==6.1.1",
 "nltk==3.10.3",
 "pyasn1==0.6.4",
 # "numpy==2.5.1",
 # "oci-signing==0.7.477",
 # "openai==2.45.0",
 # "orjson==3.11.9",
 "pandas==3.0.3",
 # "protobuf>=5.29.6",
  "pydantic==2.13.4",
  "pyhocon==0.3.63",
  "pyjwt==2.15.0",
  "urllib3==2.8.0",
  "PyStemmer==3.0.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "psutil",
 # "regex==2026.6.28",
 # "requests==2.34.2",
 # "schemautils==0.7.477",
 # "semantic-data-service-python-client==0.2.7015",
  # "semantic-object-model==0.2.52253260507130230+pr.8344.52253",
 # "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "aoadevtools",
  "black>=24.0",
  "flake8>=7.0",
  "isort>=5.13",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "tox>=4.0",
]

[tool.uv]
index-url = "https://artifactory.oci.oraclecorp.com/api/pypi/global-release-pypi/simple/"
index-strategy = "unsafe-best-match"
override-dependencies = [
  "httpx>=0.28.1,<1.0",
  "nltk==3.10.3",
]
extra-index-url = [
  "https://artifactory.oci.oraclecorp.com/api/pypi/global-dev-pypi/simple/"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"cdrc" = ["**/*"]
"profees_coding" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "**/__pycache__/*", "*.pyc", "**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 150
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 150

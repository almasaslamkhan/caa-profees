openapi: 3.0.1
info:
  title: HIM Coding Service API
  description: OpenAPI specification for HIM Coding service.
  contact:
    name: HIM Coding
    url: https://devops.oci.oraclecorp.com/t/WUEhzd
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://127.0.0.1:9000/ehrclinical/him/20250901
- url: https://127.0.0.1:9000/ehrclinical/him/20250901
tags:
- name: HimCoding
  description: Operations related to HIM Coding service
paths:
  /hello/{user}:
    get:
      tags:
      - HimCoding
      description: Returns a greeting to the user!
      parameters:
      - name: user
        in: path
        description: The name of the user to greet.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the greeting.
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Invalid characters in "user" were provided.
          content: {}
  /patients/{id}:
    get:
      tags:
      - HimCoding
      description: Use SI query to find a patient by patient ID.
      parameters:
      - name: id
        in: path
        description: The patient ID in SO database.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the patient info or empty if the patient is not found.
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Failed to run SI query.
          content: {}
  /billingCodes:
    get:
      tags:
      - HimCoding
      description: Return list of billing codes from SI.
      operationId: listBillingCodes
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: encounterId
        in: query
        description: "Numeric Id of encounter, visit, or appointment."
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: "The status of billing code (e.g. PROPOSED, SAVED, SUBMITTED)."
        required: false
        style: form
        explode: true
        schema:
          type: string
          x-obmcs-enumref: '#/definitions/Status'
        x-obmcs-enumref: '#/definitions/Status'
      - name: type
        in: query
        description: "The type of billing code (e.g. EM, DIAGNOSIS, PROCEDURE)."
        required: false
        style: form
        explode: true
        schema:
          type: string
          x-obmcs-enumref: '#/definitions/Type'
        x-obmcs-enumref: '#/definitions/Type'
      responses:
        "200":
          description: Successful response
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCodeSummary'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - HimCoding
      description: Save list of billing codes to SI.
      operationId: saveBillingCodes
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCodeSummary'
        required: true
      responses:
        "200":
          description: Successful response
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: body
  /billingCodes/{encounterId}/submit:
    put:
      tags:
      - HimCoding
      description: Submit list of billing codes.
      operationId: submitBillingCodes
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: encounterId
        in: path
        description: "Numeric Id of encounter, visit, or appointment."
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "201":
          description: Successfully submit billing codes
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/billingCodes:
    get:
      tags:
      - HimCoding
      description: Return list of billing codes from SI.
      operationId: listBillingCodesV2
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: encounterId
        in: query
        description: "Numeric Id of encounter, visit, or appointment."
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: "The status of billing code (e.g. PROPOSED, SAVED, SUBMITTED)."
        required: false
        style: form
        explode: true
        schema:
          type: string
          x-obmcs-enumref: '#/definitions/Status'
        x-obmcs-enumref: '#/definitions/Status'
      - name: type
        in: query
        description: "The type of billing code (e.g. EM, DIAGNOSIS, PROCEDURE)."
        required: false
        style: form
        explode: true
        schema:
          type: string
          x-obmcs-enumref: '#/definitions/Type'
        x-obmcs-enumref: '#/definitions/Type'
      responses:
        "200":
          description: Successful response
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCodeSummary'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - HimCoding
      description: Save list of billing codes to SI.
      operationId: saveBillingCodesV2
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCodeSummary'
        required: true
      responses:
        "200":
          description: Successful response
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCodeSummary'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: body
  /v2/billingCodes/{encounterId}/submit:
    put:
      tags:
      - HimCoding
      description: Submit list of billing codes.
      operationId: submitBillingCodesV2
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: encounterId
        in: path
        description: "Numeric Id of encounter, visit, or appointment."
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "201":
          description: Successfully submit billing codes
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cptCodes:
    get:
      tags:
      - HimCoding
      description: Return list of CPT codes.
      operationId: listCptCodes
      parameters:
      - name: opc-request-id
        in: header
        description: Optional request ID.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            opc-request-id:
              description: "A unique identifier for the request, used for troubleshooting\
                \ and correlation."
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CptCode'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
    BillingCodeSummary:
      type: object
      properties:
        encounterId:
          type: string
        patientId:
          type: string
        ownerId:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        isProposed:
          type: boolean
        procedure:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureCode'
        em:
          type: array
          items:
            $ref: '#/components/schemas/Em'
        diagnosis:
          type: array
          items:
            $ref: '#/components/schemas/Diagnosis'
        grouper:
          type: array
          items:
            $ref: '#/components/schemas/Grouper'
      description: |
        Summary of billing codes grouped by type for encounterId.
    BillingCode:
      type: object
      properties:
        type:
          type: string
          description: |
            Classification tag. Common values include DIAGNOSIS, EM, PROCEDURE, PREVENTIVE. For program-specific classifications, this may also be "G-code" (e.g., under diagnosis) or "Z-code" (e.g., under preventive), depending on workflow needs.
        code:
          type: string
        description:
          type: string
        system:
          type: string
        justification:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        sub_type:
          $ref: '#/components/schemas/SubType'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
      description: |
        The billing code details common for all types.
    ProcedureCode:
      description: |
        The procedure code details.
      allOf:
      - $ref: '#/components/schemas/BillingCode'
      - type: object
        properties:
          modifiers:
            type: array
            items:
              $ref: '#/components/schemas/Modifier'
          linked_diagnosis:
            type: array
            items:
              $ref: '#/components/schemas/LinkedDiagnosis'
          procedureDate:
            type: string
            description: "Date of the procedure (ISO-8601, YYYY-MM-DD)."
          lastUpdated:
            type: string
            description: Last updated timestamp of the underlying coding record (ISO-8601).
          isAiGenerated:
            type: boolean
            description: Indicates the code was generated by AI.
    Em:
      description: |
        The E/M code details.
      allOf:
      - $ref: '#/components/schemas/BillingCode'
      - type: object
        properties:
          modifiers:
            type: array
            items:
              $ref: '#/components/schemas/Modifier'
          problem_complexity:
            $ref: '#/components/schemas/Complexity'
          data_complexity:
            $ref: '#/components/schemas/Complexity'
          risk_of_complications:
            $ref: '#/components/schemas/Complexity'
          mdm_complexity:
            $ref: '#/components/schemas/Complexity'
          source:
            type: string
            description: "Source of the E/M code determination (e.g., MDM)."
            example: MDM
          time_spent:
            type: object
            properties:
              time_spent_minutes:
                type: integer
                example: 14
              evidence:
                type: string
          encounter_type:
            type: object
            properties:
              encounter_type:
                type: string
                example: Office or Other Outpatient Service
              justification:
                type: string
                example: Outpatient E/M visit determined by MDM.
          linked_diagnosis:
            type: array
            items:
              $ref: '#/components/schemas/LinkedDiagnosis'
          confidence:
            type: number
            format: double
          pc_critic_response:
            type: string
          rc_critic_response:
            type: string
          dc_critic_response:
            type: string
          lastUpdated:
            type: string
            description: Last updated timestamp of the underlying coding record (ISO-8601).
          isAiGenerated:
            type: boolean
            description: Indicates the code was generated by AI.
    Diagnosis:
      description: |
        The diagnosis code details.
      allOf:
      - $ref: '#/components/schemas/BillingCode'
      - type: object
        properties:
          is_primary:
            type: boolean
          diagnosisDetails:
            $ref: '#/components/schemas/DiagnosisDetails'
          generativeDetails:
            $ref: '#/components/schemas/GenerativeDetails'
          supportingEvidence:
            type: array
            items:
              type: string
          lastUpdated:
            type: string
            description: Last updated timestamp of the underlying coding record (ISO-8601).
          isAiGenerated:
            type: boolean
            description: Indicates the code was generated by AI.
    Grouper:
      description: |
        The grouper code details.
      allOf:
      - $ref: '#/components/schemas/BillingCode'
      - type: object
        properties:
          coding_type:
            $ref: '#/components/schemas/CodeableConcept'
          risk_of_mortality:
            $ref: '#/components/schemas/CodeableConcept'
          severity_of_illness:
            $ref: '#/components/schemas/CodeableConcept'
          major_diagnostic_category:
            $ref: '#/components/schemas/CodeableConcept'
          amount:
            type: number
            format: double
          weight:
            type: number
            format: double
          low_trim:
            type: number
            format: double
          high_trim:
            type: number
            format: double
          length_of_stay_arithmetic_mean:
            type: number
            format: double
          length_of_stay_geometric_mean:
            type: number
            format: double
          hospital_acquired_condition_indicator:
            type: number
            format: double
    Modifier:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        justification:
          type: string
    LinkedDiagnosis:
      type: object
      properties:
        code:
          type: string
        system:
          type: string
        description:
          type: string
        justification:
          type: string
        is_primary:
          type: boolean
      description: |
        Diagnosis linked to a procedure or E/M code.
    Complexity:
      type: object
      properties:
        level:
          type: string
        justification:
          type: string
        confidence:
          type: number
          format: double
      description: |
        Complexity level for a specific E/M category.
    SubType:
      type: object
      properties:
        code:
          type: string
        display:
          type: string
      description: |
        Identifier for proposed or accepted code.
    Status:
      type: string
      enum:
      - PROPOSED
      - SAVED
      - SUBMITTED
      - PROPOSED_SAVED
      - PROPOSED_SUBMITTED
      - ACCEPTED
      - PROPOSED_ACCEPTED
    Type:
      type: string
      enum:
      - DIAGNOSIS
      - EM
      - PROCEDURE
      - PREVENTIVE
    SourceType:
      type: string
      enum:
      - DOCUMENT_REFERENCE
    Reference:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
      description: |
        Document reference details
    DiagnosisDetails:
      type: object
      properties:
        sequence:
          type: number
          format: double
        presentOnAdmission:
          type: string
        type:
          type: string
      description: |
        Diagnosis detailed information
    GenerativeDetails:
      type: object
      properties:
        confidence:
          type: string
        justification:
          type: string
      description: |
        Diagnosis generated detailed information
    CodeableConcept:
      required:
      - code
      type: object
      properties:
        text:
          type: string
          description: Textual value of the code used for display.
        code:
          type: string
          description: Code value in the specified code set.
        codingKey:
          type: string
          description: Code key.
        userSelected:
          type: boolean
          description: Indicates if this coding was chosen directly by the user.
        meaning:
          type: string
          description: Meaning of the code.
        conceptCki:
          type: object
          description: Cerner key identifier of the code.
      description: Concept - reference to a terminology or just text.
    CptCode:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        label:
          type: string
        type:
          type: string
      description: |
        CPT code details.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    opcRequestId:
      name: opc-request-id
      in: header
      description: Optional request ID.
      required: false
      style: simple
      explode: false
      schema:
        type: string
    ifMatch:
      name: if-match
      in: header
      description: Optional.
      required: false
      style: simple
      explode: false
      schema:
        type: string
    EncounterIdQueryParam:
      name: encounterId
      in: query
      description: "Numeric Id of encounter, visit, or appointment."
      required: true
      style: form
      explode: true
      schema:
        type: string
    StatusQueryParam:
      name: status
      in: query
      description: "The status of billing code (e.g. PROPOSED, SAVED, SUBMITTED)."
      required: false
      style: form
      explode: true
      schema:
        type: string
        x-obmcs-enumref: '#/definitions/Status'
      x-obmcs-enumref: '#/definitions/Status'
    TypeQueryParam:
      name: type
      in: query
      description: "The type of billing code (e.g. EM, DIAGNOSIS, PROCEDURE)."
      required: false
      style: form
      explode: true
      schema:
        type: string
        x-obmcs-enumref: '#/definitions/Type'
      x-obmcs-enumref: '#/definitions/Type'
    EncounterIdPathParam:
      name: encounterId
      in: path
      description: "Numeric Id of encounter, visit, or appointment."
      required: true
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

logging {
    # 3rd party logs with logging.INFO levels
    log_level: 20

    # Application logs with logging.INFO levels
    app_log_level: 20

    # Gunicorn logs with logging.DEBUG levels
    gunicorn_log_level: 20

    # Boolean to indicate if the logs in logs file should be stored in json format
    json_logs: true
}

em_model_config {
    model_name            : caa-gpt-5.2-2025-12-11-prod
    embedding_model       : caa-text-embedding-3-large-prod

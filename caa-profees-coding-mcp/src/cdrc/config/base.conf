metrics {
    # same as project name in Mohan setting 
    metrics_namespace: professional-fees-model

    tenant_name: "odadev"
    tenant_name: ${?MAX_TENANCY_NAME}

    cluster: "d1-cluster-0-phx-1"
    cluster: ${?CLUSTER_NAME}

    resource_group: professional-fees-model.${metrics.tenant_name}.${metrics.cluster}

    metrics_dimensions: {
        host: professional-fees-model
    }

    metrics_buffer: {
        flush_threshold: 0
        max_records_per_post_call: 1000
        interval: 10
    }

    metrics_tpe: {
        max_worker_threads: 2
    }

    metrics_config {
        log_requests: false
    }
}

logging {
    log_dir: /logs/profees-model
    format: "<level>{level: <8}</level> <green>{time:YYYY-MM-DD HH:mm:ss,SSS}</green> <cyan>{extra[OPC_REQUEST_ID]} {thread.name} {name}.{function}.{line}</cyan>: <level>{message}</level>"
    json_logs: true
    zip: {
        file: ${logging.log_dir}/application.log
        compression: gz
        rotation: "1 hour"
        retention: "10 hours"
        format: "{level} {time:YYYY-MM-DD HH:mm:ss,SSS} {extra[OPC_REQUEST_ID]} {thread.name} {name}.{function}.{line}: {message}"
    }
}

agentlens {
    endpoint: "http://127.0.0.1:62341"

    # Keep API key with an empty default so local loopback works while central mode stays compatible.
    api_key: ""

    project: "clinical-rev-cycle"

    env: "dev"

    enabled: true
}

facade_client {
    service_endpoint: "http://max-facade-api:24103"
}


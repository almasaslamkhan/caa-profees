    }
}

cpt_procedure_model_config {
    design                : "ner_llm"
    config_path           : "./cdrc/profees_coding/cpt_procedure/models/ner_rag/config/runner.yaml"
    prompt_path           : "./cdrc/profees_coding/cpt_procedure/models/ner_rag/config/prompts.yaml"
    prompt_version        : "v1.4"
    query {
        retrieval {
        mode = "all"
        }
        rerank {
        mode = "all"
        }
    }
    retrieval {
        method  = "hybrid"
        weights = [0.5, 0.5]

        sub_retrievers {
        "0" {
            method = "semantic"
            vector_store {
            type           = "faiss"
            path           = "cdrc/profees_coding/cpt_procedure/rag/vdb/vdb_cpt_long_descriptions_oracle-text-embedding-3-large-1-dev-local"
            embedding_model = ${?EMBEDDING_MODEL_PROFEES}
            }
            search_kwargs {
            score_threshold = 0.0
            k               = 10
            }
        }

        "1" {
            method = "lexical"
            vector_store {
            type  = "bm25"
            path  = "cdrc/profees_coding/cpt_procedure/rag/vdb/vdb_cpt_long_descriptions_bm25/vdb.pickle"
            filter = ""
            }
            search_kwargs {
            # empty object is fine
            }
        }
        }
    }

    # --- LLM RERANKER ---
    rerank {
        method      = "llm_listwise_with_reason"
        model_name  = ${?EMBEDDING_MODEL_PROFEES}

        model_kwargs {
        temperature = 0.0
        seed        = 1
        }

        prompt_path    = "cdrc/profees_coding/cpt_procedure/rag/reranker/prompts.yaml"
        prompt_version = "v1"
        top_n          = 3
    }
    model_name            : ${?MODEL_NAME_PROFEES}    
    embedding_model       : ${?EMBEDDING_MODEL_PROFEES}
    batch_size            : 1
    model_kwargs { 
        temperature : 0.0,
        seed : 2
        seed : ${?SEED} 
    }
}

cpt_procedure_model_config {
    num_few_shot_examples : 3
    retrieval {
        sub_retrievers {
            "0" {
                vector_store {
                    embedding_model : oracle-text-embedding-3-large-1-dev-local
                }
            }
        }
    }
    rerank {
        model_name  : caa-gpt-5.4-2026-03-05-dev-aifactory
        model_kwargs {
        temperature : 1.0,
            seed : 42
            seed : ${?SEED} 

include "base.conf"

metrics {
    metrics_namespace: profees-model-local
    monitoring_client_endpoint: https://telemetry-ingestion.us-phoenix-1.oraclecloud.com
    metrics_compartment: ocid1.compartment.oc1..aaaaaaaa75cnygoy2aqpghii7ng6a3ljdmlayniw6zfd35rao6ecwe5266ga
    metrics_config {
        log_requests: true
    }
}

logging {
    log_dir: logs/profees-model

    zip: {
        file: ${logging.log_dir}/application.log
        compression: gz
        rotation: "1 hour"
        retention: "10 hours"
    }
}

agentlens {
    endpoint: "http://127.0.0.1:62341"

    # Keep API key with an empty default so local loopback works while central mode stays compatible.
    api_key: ""

    project: "clinical-rev-cycle"

    env: "dev"

    enabled: true
}


em_model_config {
    model_name            : caa-gpt-5.2-2025-12-11-dev-aifactory
    embedding_model       : oracle-text-embedding-3-large-1-dev-local
    model_kwargs { 
        temperature : 1.0,
        seed : 2
        seed : ${?SEED} 
    }
    reasoning_effort: none
}


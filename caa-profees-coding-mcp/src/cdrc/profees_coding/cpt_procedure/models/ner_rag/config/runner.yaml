    1:
      method: lexical
      vector_store:
        type: bm25
        path: cdrc/profees_coding/cpt_procedure/rag/vdb/vdb_cpt_long_descriptions_bm25/vdb.pickle
        filter: ""
      search_kwargs: {"k": 3}
    # Instructions
    Your task is to review and reflect on the generated problem complexity assessment to ensure accuracy, adherence to guidelines, and completeness. Always select the overall Problem Complexity Level based on the highest category reached by any problem addressed (do not average or down-tier when a higher category is met). State all assumptions explicitly and avoid inferring unstated details.

    # Objective
    - Audit the “Number and Complexity of Problems Addressed” element for an encounter.
    - Verify each addressed problem’s type, confirm evidence from the Assessment and Plan (A&P), consolidate related items, and determine the overall problem complexity level by the single highest category met.
    - Review and reflect on the generated problem complexity assessment to ensure accuracy, adherence to AMA E/M medical decision making (MDM) standards and these instructions.

    Clarification:
    - Determine the overall category based on the single highest applicable item after consolidation. Do not upstage based solely on problem count unless documentation satisfies the specific criteria (e.g., “two or more stable, chronic illnesses” requires explicit documentation of at least two distinct chronic conditions as stable in the A&P).
    - Do not upcode solely due to the quantity of minor or screening Z-code items if the highest category is a single stable chronic illness.
    - If ANY addressed problem independently meets criteria for Moderate complexity (e.g., chronic illness with side effects of treatment), the presence of stable chronic illnesses does NOT permit down-tiering.


    ## Chronic Conditions List (Inherently Chronic)
    Major Depressive Disorder (not Depression), Alcohol Abuse, Arthritis (including Osteoarthritis and Rheumatoid), Systemic Lupus Erythematosus, Psoriasis, Chronic inflammatory conditions, Heart Failure, Ischemic Heart Disease, Cardiomyopathy, Coronary Artery Disease, Peripheral Vascular Disease, Chronic Venous Hypertension, Alzheimer's Disease, Dementia, Parkinson's Disease, Multiple Sclerosis, Epilepsy, Chronic pain syndromes, COPD, Pulmonary Fibrosis, Bronchiectasis, Inflammatory Bowel Disease (Ulcerative Colitis and Crohn's), Chronic gastrointestinal conditions, Biliary disease, Diabetes Mellitus, Hyperlipidemia, Thyroid disorders (Hypo/Hyperthyroidism), Chronic Kidney Disease, ESRD, HIV/AIDS, Chronic Hepatitis, Schizophrenia, ADHD, Autism Spectrum Disorders, Intellectual Disability, Substance Dependence, Hypertension, Glaucoma, Osteoporosis, Gout, Paraplegia, Blood disorders (Thalassemia, Sickle Cell Disease), Monoclonal Gammopathy; congenital structural conditions coded in ICD-10 Chapter Q (Q00–Q99) are inherently chronic (e.g., pes planus/pes planovalgus), Cervical spondylosis, Scoliosis, Generalized Anxiety Disorder (GAD).

    # Important Notes
    - Base all problem complexity assessments primarily on the Assessment and Plan (A&P) section; it contains the provider’s clinical judgment and final diagnoses. The A&P section is the ONLY authoritative source for determining which problems were addressed during the encounter.
    - Use the History of Present Illness (HPI) section only for contextual background, such as disease onset or duration for determining chronicity. If HPI provides a clear duration statement or a documented onset date older than one year, use it to establish chronicity. Do not rely on HPI to determine severity, uncertainty or progression, as it reflects the patient's subjective description, which may include exaggerations or inaccuracies.
    - Observations/measurements under the Objective section do not count as problems, therefore do not contribute to problem complexity assessment. Objective findings referenced in the A&P may support acuity/progression but are not separate problems. Do not infer new problems from vitals alone unless the A&P actively addresses and manages the condition.
    - Count a problem as addressed at this encounter only if the A&P documents active evaluation, assessment (e.g., status such as controlled/stable vs uncontrolled/not at goal), management, or a specific plan/action for that problem during this visit. A diagnosis merely listed (including in billing/order blocks) without associated assessment/plan actions does not count. “See plan under …” in the A&P indicates active management of that condition at this encounter.
    - When the A&P contains both a structured, enumerated diagnosis list (often with ICD codes) and narrative plan text, prioritize the structured, enumerated diagnosis list as the authoritative source of problems addressed. Include additional narrative-only items only if they are explicitly labeled as a diagnosis and have active management documented (orders, prescriptions, referrals). If there is any discrepancy, default to the structured list.
    - Distinguish screening from diagnostic workup: **preventive screening without suspicion is a wellness component and is EXCLUDED from MDM problem counting (do not list as a minor problem when other problems are addressed)**. Diagnostic testing ordered in the A&P to evaluate a suspected condition (e.g., HST ordered for suspected OSA; CXR to rule out pneumonia; MRI for a palpable soft tissue lump) supports classifying as an undiagnosed new problem with uncertain prognosis (subject to the same-visit definitive results rule).
    - Onset timestamps recorded in A&P may reflect documentation timing and do not, by themselves, establish chronic duration; do not classify a problem as chronic solely based on such timestamps. Use explicit duration (>1 year), explicit chronic labeling, inherent chronic nature, or congenital ICD-10 Q-codes to determine chronicity.
    - Procedures are not counted as separate problems, but the documented need for and performance of such procedures (e.g., suturing with cross-system assessment) can support classification of an injury as complicated.
    - External cause codes (ICD-10 V/W/X/Y), including “MVA restrained driver (V89.2XXA),” provide context only and are NEVER a diagnosis/problem for MDM problem counting; identify and classify the actual injury/illness addressed in the A&P (e.g., rib tenderness, hand pain). Do not consolidate injuries under an external-cause code as a “single MVA problem”.
    - When documentation is ambiguous or lacks explicit evidence for a higher category, default to the lower problem complexity category.
    - Select the overall Number and Complexity of Problems Addressed level based on the single highest category reached by any addressed problem (e.g., if any single problem meets Moderate criteria, overall level is Moderate).
    - When multiple pathways could justify the same overall problem complexity level (e.g., Moderate), the auditor must:
      - Identify which specific criterion truly determines the final level, AND
      - Explicitly state why other higher-risk categories (e.g., chronic with exacerbation, uncertain prognosis) do NOT apply when evidence is insufficient.
      - Matching the correct complexity level for the wrong reason is considered an audit failure.
    - Symptoms or concerns documented in the A&P with reassurance, observation, or “monitor for now” guidance only, and no diagnostic evaluation, treatment initiation, or active management, must NOT be counted as problems addressed for MDM.
    - Symptoms such as dizziness, balance issues, fatigue, headache, or nonspecific neurologic complaints that are addressed only with reassurance, safety advice, or “monitor for now” guidance — and without diagnostic evaluation, treatment initiation, or escalation — must be excluded from the MDM problem list.
    - Mood symptoms (e.g., “depression,” “low mood”) without a formal diagnosis, active treatment, or diagnostic evaluation documented in the A&P are considered contextual and must be excluded from the problem list.
    - Do NOT convert symptom-only documentation (e.g., “rib pain,” “hand pain,” “swelling,” “tenderness”) into a definitive diagnosis such as “musculoskeletal injury,” “strain,” “contusion,” or “sprain” unless the A&P explicitly assigns that diagnosis. If symptoms are being imaged/worked up to determine etiology and no definitive diagnosis is assigned, classify as undiagnosed new problem with uncertain prognosis.

    # Apply System 2 Thinking
    - Explicitly reason by breaking down your thought process step-by-step before reaching a conclusion.
    - The reasoning must mention why each instruction below (header, bullet, and sub-bullet) applies or does not apply to this encounter.
    - Ensure that you output the reasoning for each instruction.
    - State all assumptions explicitly.

    # Detailed Decision Framework

    ## 0. Evidence from A&P vs. HPI
    - The A&P section is the ONLY authoritative source for determining which problems were addressed during the encounter.
    - Conditions mentioned only in the HPI but not addressed in the A&P section must NOT be included in your assessment.
    - Patient-reported symptoms or worsening in the HPI must be confirmed by provider in the A&P section to be considered valid evidence.
    - Do not include conditions mentioned in the HPI as “history of …” or in past medical history unless they are actively managed in the current encounter’s A&P section.
    - When determining progression, exacerbations, or side effects, rely solely on provider documentation in the A&P section, not patient subjective reports in the HPI.
    - Orders and explicit recommendations documented in the A&P (e.g., HST for suspected OSA; “advised patient to get tested for Lyme disease”; “will obtain serology”; “ordered CXR to rule out pneumonia”) constitute immediate diagnostic workup for a specific concern during the visit. Do not infer diagnostic test results; if the A&P does not explicitly document results, assume results are pending and base uncertainty on documented orders and provider statements.
    - Orders override narrative contingency: If imaging/labs are actually ordered during the encounter (shown in orders/structured list), treat them as immediate diagnostic workup, even if the narrative uses contingent language (e.g., “if persists,” “if patient desires”), unless the A&P explicitly states the order is not being placed today (e.g., “defer,” “hold,” “consider later,” “patient declined today”).
    - Diagnostic orders listed for the encounter (imaging/labs) count as A&P plan actions and must be interpreted as active management/workup for the associated A&P problem unless explicitly negated (deferred/declined).

    ## 1. Consolidate All Conditions
    - If the A&P contains “Encounter for …” Z-codes:
      - If the Z-code represents routine preventive/wellness (e.g., immunization, annual exam, screening without abnormal findings), treat it as wellness and EXCLUDE it from the MDM “problems addressed” list whenever any problem-oriented condition is addressed in the same encounter.
      - Only if the encounter is purely preventive/wellness (no problem-oriented conditions addressed), include exactly one preventive/wellness entry (may reference the Z-code) and classify it as Minimal to satisfy the “at least one problem” output requirement.
      - If the Z-code is merely a header for other diagnoses, do not count it separately.
    - Do not count multiple ICD-10 codes separately if they describe different aspects/symptoms of the same underlying condition; consolidate related conditions/symptoms based on clinical relevance.
    - Do NOT consolidate multiple distinct musculoskeletal/spine diagnoses (e.g., spondylosis, disc displacement, scoliosis) into a single “pain complex” merely because they contribute to the same symptom; only consolidate symptom codes (e.g., cervicalgia, back pain) under the specific diagnosis when the A&P explicitly links the symptom as a manifestation of that diagnosis. If multiple structural diagnoses are each assessed/managed in the A&P, count them as separate problems.
    - Do not consolidate distinct anatomic site injuries based solely on a shared mechanism or unified management. Pain or injury in different body regions (e.g., ribs and hand) must be treated as separate problems when the A&P evaluates or manages them separately (e.g., separate exam findings, separate imaging orders, or site-specific assessment), even if they arise from the same event (e.g., MVA) or share a unified plan (e.g., NSAIDs, rest, imaging). Consolidate only if the A&P explicitly states they represent a single definitive diagnosis (e.g., “generalized musculoskeletal strain”) and management is truly unified.
    - When an inherently chronic condition (e.g., allergic rhinitis) is documented in the A&P only as an underlying cause, trigger, or contributor to another chronic condition being actively managed (e.g., chronic sinusitis), it must be consolidated into the primary condition for MDM unless the A&P explicitly documents:
      - a separate assessment of control/status (e.g., “poorly controlled,” “worsening,” “not controlled”), or
      - an independent management decision specific to that condition (e.g., therapy escalation, medication change, treatment failure, or side-effect evaluation).
    - Medications count as independent management ONLY when the A&P explicitly documents that they were initiated, adjusted, escalated, or specifically evaluated for that condition during this encounter. Baseline, continuation, maintenance, or background medications listed without change or condition-specific assessment (e.g., Flonase, montelukast) do NOT establish independent assessment or independent management.
    - Consolidate symptom R-codes (e.g., cough, wheeze) under the primary condition when management targets that condition. Do not count a symptom and its confirmed underlying diagnosis as separate problems (e.g., rib pain consolidated under rib fracture if fracture is confirmed in the A&P).
    - Consolidate symptom diagnoses across related anatomic sites when the A&P uses a single unified assessment/plan for one suspected underlying condition (e.g., left arm numbness + right hand weakness evaluated/treated together as suspected cervical radiculopathy/nerve involvement). Do not keep as separate problems solely because two symptom codes are listed, when the A&P explicitly links them to one suspected process and management is unified.
    - Consolidate diagnostic-uncertainty clusters: When the A&P frames multiple items as part of one diagnostic question (e.g., “unexplained weight loss” with associated constitutional symptoms and thyroid abnormality concern) and the workup overlaps (CBC/smear, thyroid tests), consolidate into a single diagnostic-evaluation problem rather than counting separate “acute” problems.
    - Ensure that all “possible,” “suspected,” or “potential” conditions are considered during consolidation if they are documented in the A&P.
    - Treat routine preventive/wellness components (e.g., immunization status review, screening exams without abnormal findings, anticipatory guidance, routine annual labs ordered by guideline/age) as part of the wellness component and EXCLUDE them from the “problems addressed” list for MDM. Do NOT count them as separate problems and do NOT label them as Self-limited or minor when any problem-oriented condition is addressed in the same encounter. Only if the encounter is purely preventive/wellness (no problem-oriented conditions addressed in the A&P), include exactly one entry labeled “Preventive/wellness visit (no problem-oriented conditions addressed)” and classify it as Minimal (one self-limited or minor problem) solely to satisfy the “at least one problem” output requirement.
    - Treat “Monitoring” or “Follow-up” actions documented without a named diagnosis or symptom being evaluated as administrative/preventive items and EXCLUDE them from the MDM problems list.
    - Example consolidation: Snoring (R06.83) and frequent nocturnal awakening (G47.00) documented together with suspicion for sleep apnea and an HST order should be consolidated into a single sleep-related problem suspected for OSA.
    - Explicitly consolidate duplicate entries that refer to the same problem (e.g., Left foot pain [M79.672] and Foot pain [M79.673] referring to the same issue) into a single problem.
    - History-of rule: A&P diagnoses labeled “History of …” (including F10.11 History of alcohol abuse) are NOT automatically treated as active chronic illnesses for MDM problem complexity.
      - If the A&P documents current active disorder (e.g., ongoing alcohol use disorder, relapse risk requiring intervention), classify per chronic rules.
      - If the A&P documents no current problem and no intervention (“no further intervention… monitor”), classify as self-limited/minor (monitoring-only) and it must NOT be used to satisfy “two or more stable chronic illnesses.”
    
    ## 2. Step-by-step Classification for Each Consolidated Problem

    ### 2A. Is it a self-limited or minor problem that will resolve on its own with home remedies?
    - Examples: minor rashes, common cold, ingrown toenail, uncomplicated localized balanitis treated with topical therapy and no systemic involvement.
    - Screenings or exposure assessments (e.g., STD screening) in the A&P are classified as minor unless the physician strongly suspects a condition and orders tests to rule it out.
    - When a patient presents for exposure to a condition or other qualifiers fitting the exposure category, it meets the minor problem criteria. If the patient insists on testing out of fear, and the physician either does not comment or explicitly states “unlikely” or “little suspicion,” the test does not elevate the exposure to an uncertain condition; it remains minimal complexity, as the test is ordered for patient reassurance rather than clinical suspicion.
    - Resolved acute complaints that have fully resolved by the time of the encounter and receive only reassurance (no ongoing symptoms requiring a treatment plan) default to Self-limited or minor. If symptoms are still present and the A&P provides an active management plan (even supportive care), classify as acute, uncomplicated.
    - Insect stings/bites rule (mandatory): Insect stings/bites (including bee stings) with ongoing localized reaction that are actively evaluated in the A&P and managed with a treatment plan (e.g., ice packs, antihistamines, topical steroids, return precautions) should be classified as acute, uncomplicated illness or injury (Low) — not “self-limited or minor” — unless the A&P explicitly documents the complaint is fully resolved with reassurance only and no ongoing symptoms requiring a management plan.
    - Medication/regimen monitoring with routine labs (e.g., CMP, LFTs, B12) for general oversight or reassurance, without documented suspicion of toxicity, organ dysfunction, or adverse effect, is minor.
    - Lacerations or injuries requiring physician-performed repair (e.g., sutures) are generally not self-limited or minor.
    - Urticaria/hives may be classified as self-limited/minor when managed with reassurance and home remedies only; if the provider initiates or adjusts pharmacologic management (including OTC antihistamines) or dosage, classify it as an acute, uncomplicated illness.
    - Active infection/inflammation rule (mandatory):
      - Localized infections or inflammatory mucosal/skin conditions that are actively symptomatic at the visit and for which the A&P provides a treatment plan (including OTC therapies such as antifungals, topical steroids, or medicated creams) should be classified as acute, uncomplicated illness (Low) rather than “self-limited or minor,” unless the A&P explicitly documents the condition is fully resolved and only reassurance is provided.

    ### 2B. Is it a chronic or an acute condition?
    - Classify a condition as chronic ONLY if:
      - It is inherently chronic: one of the conditions in the Chronic Conditions List above (including congenital structural conditions coded in ICD-10 Chapter Q [Q00–Q99]).
        - If a diagnosis is inherently chronic, it MUST be classified as chronic ONLY when the A&P reflects longitudinal disease management, assessment of control/severity, or ongoing treatment decisions beyond episodic or PRN management.
        - A condition does not become acute simply because it is first documented or first addressed in this encounter.
      - OR, if not inherently chronic, there is explicit documentation in the note indicating:
        - persistence for more than one year, OR
        - that the condition has occurred previously and the provider explicitly states it is expected to persist long-term (and this statement is more specific than ‘history of’/‘longstanding’).
      - IMPORTANT CLARIFICATION — Episodic manifestations of inherently chronic conditions:
        - Inherently chronic conditions that commonly present with episodic, self-limited flares (e.g., herpes labialis/oral cold sores, episodic migraines) may be classified as self-limited or minor for a given encounter when the A&P documents only PRN/refill management, no active concerns, no assessment of control, and no longitudinal disease management.
      - MANDATORY OVERRIDE — Chronicity cannot be inferred from management:
        - For diagnoses not on the Chronic Conditions List (e.g., Depression F32.* unless explicitly Major Depressive Disorder), do NOT classify as chronic based on ongoing medication use, refills, dose changes, “see plan under…,” or follow-up/monitoring language. If the note does not document duration > 1 year and the diagnosis is not inherently chronic, classify it as acute (or recurrent acute) for MDM problem-type purposes.
    - DO NOT assume conditions are inherently chronic if they are not in the list. Many conditions that can persist long-term but less than a year are not automatically chronic, including:
      - Anxiety (unless specifically documented as Generalized Anxiety Disorder),
      - Pain conditions (unless explicitly documented as chronic),
      - Insomnia (unless explicitly documented as chronic),
      - Depression (not MDD),
      - Muscle stiffness,
      - Benign Positional Vertigo (BPV),
      - Dermatitis (L30.9) unless duration >1 year or A&P confirms chronicity with active management
    - Evidence requirement (mandatory):
      - When determining chronicity for non-inherently chronic conditions, you MUST cite the specific text from the note that supports your assessment:
        - Quote the exact text showing a duration > 1 year OR an explicit provider statement that the condition is expected to recur/persist long-term.
        - Explicit provider language stating expected persistence or recurrence.
      - If no duration is mentioned anywhere in the note, you MUST classify the condition as acute, unless the diagnosis is inherently chronic by definition.
      - Chronicity via duration (override clarification):
        - For diagnoses not on the inherently chronic list, if the HPI documents a specific duration ≥ 1 year (e.g., “for at least the past year,” “for 2 years,” “since 2022”) and the condition is actively addressed in the A&P, it must be classified as chronic for MDM purposes, even if the A&P does not explicitly use the word “chronic.”
    - If the A&P or HPI documents a duration of LESS than 12 months, the condition MUST be classified as acute or recurrent acute for MDM purposes, even if terms such as “chronic,” “recurrent,” or “longstanding” are used colloquially. The auditor must explicitly state why the condition does NOT meet chronic criteria when a sub-12-month duration is documented.
    - Recurrent vs Chronic Clarification:
      - The term “recurrent” alone does NOT establish chronicity for MDM. Recurrent acute episodes remain classified as acute unless:
        - Duration exceeds one year, OR
        - The condition is inherently chronic by definition.
    - Prohibited inference rule (mandatory) 
      - Do NOT classify a condition as chronic based solely on:
        - failed medical therapy,
        - persistence or “non-resolving” language,
        - escalation to surgery or procedural intervention,
        - referral to a specialist.
      - These findings may reflect severity or complexity, but do not establish chronicity under AMA E/M rules without explicit duration or expectation documentation.
    - Statements merely reporting the patient’s past medical history with phrases like “a (longstanding) history of XYZ” do not establish duration or chronicity by themselves.
    - Duration specificity requirement (mandatory): “longstanding history of …” without a specific timeframe does NOT establish duration > 1 year.
    - Do not classify common physiological symptoms (e.g., menstrual cramps) as chronic; classify dysmenorrhea/menorrhagia as chronic only with explicit documentation indicating persistence > 1 year.
    - Generic anemia (unspecified anemia) is not inherently chronic; classify anemia as acute unless there is explicit documentation of duration >1 year or explicit provider statement that the condition is expected to persist/recur long-term (AMA chronicity standard).
    - Pediatric feeding disorders/failure to thrive with infancy origin (e.g., prior G-tube placement) and ongoing therapy documented in A&P should be treated as chronic when the note establishes origin in infancy and current active management, and the patient’s age is >1 year.
    - Default rule:
      - When documentation is ambiguous or insufficient, default to acute.

    ### 2C. If it is a chronic condition, is it stable or does it have exacerbations, progression, or side effects of treatment?
    - “Stable” is defined by the specific treatment goals for an individual patient; a patient is not stable if they are not at their treatment goal, even if the condition has not changed and there is no short-term threat to life or function.
    - A chronic condition is stable when management reflects initial treatment initiation, routine optimization, or adjustment based on known baseline severity, and there is no explicit documentation of worsening, progression, or decline compared to prior status. Do NOT classify a condition as having exacerbation or progression solely because it is severe at baseline, untreated at presentation, newly diagnosed based on prior testing, or because standard therapy (e.g., CPAP for OSA) is initiated or adjusted.
    - Episodic conditions treated with PRN or refill-only management (e.g., herpes labialis/cold sores) and documented as ‘no concerns’ do NOT constitute longitudinal chronic disease management and should be classified based on the encounter context (often self-limited or minor).
    - Identify progression/exacerbation ONLY when the A&P explicitly documents worsening, poor control, not at goal, or progression compared with prior status. Do NOT infer exacerbation solely from medication initiation, dose increase, medication change, partial response, or statements such as “partially effective,” “still symptomatic,” or “persists,” unless the A&P clearly states the condition is uncontrolled or worsening. Escalation of therapy without explicit documentation of loss of control represents ongoing management of a stable chronic condition for MDM purposes. 
    - **When keywords are absent**, assign exacerbation only if the A&P documents both
      (1) active disease manifestations and 
      (2) a management response intended to control those manifestations.
    - Classify exacerbations or side effects as severe only if explicitly mentioned in the note (HPI may provide context) that the condition has worsened since the last visit or severe manifestations are documented.
    - Side effects of treatment must be confirmed to count (possible side effects do not count). Explicit linkage such as “allergic reaction to medication,” “reaction to antibiotic,” or discontinuation/change due to reaction is sufficient evidence of a side effect; the phrase “side effect of treatment” does NOT need to be explicitly stated.
    - Problems related to medical equipment, devices, interfaces, or delivery mechanisms (e.g., CPAP mask leak, discomfort, eye irritation from airflow, poor fit, malfunctioning or ineffective equipment, need for replacement device) do NOT constitute “side effects of treatment” for MDM purposes unless the A&P explicitly documents a physiologic adverse effect requiring medical management (e.g., medication-induced organ injury, treatment-related systemic complication). Addressing equipment tolerance, malfunction, or alternative devices without documented disease progression or physiologic treatment toxicity should be classified as stable chronic illness.
    - Routine dose optimization/titration with documented improvement, without explicit A&P statements of worsening/poor control, should be treated as stable for MDM.
    - Do not infer exacerbation solely from historical recurrence or nonspecific symptoms. However, active disease symptoms documented in the A&P that prompt escalation or addition of disease-specific treatment, supportive interventions, or rescue therapy constitute evidence of exacerbation or poor control even if the terms ‘exacerbation,’ ‘worsening,’ or ‘poorly controlled’ are not explicitly used.
    - If the A&P documents escalation or consideration of alternative/advanced therapy (e.g., referral for surgical or device-based treatment such as Inspire for OSA) AND explicitly links this to disease progression, worsening severity, failure of prior therapy, or inability to achieve treatment goals despite appropriate use, treat this as evidence the chronic condition is not stable.Do NOT treat referrals driven solely by equipment malfunction, interface intolerance, logistical issues, or device availability as evidence of exacerbation or poor control in the absence of documented disease progression.
    - For MDM purposes, exacerbation may be established by the clinical response to active disease (e.g., therapy escalation, add-on treatment, or increased monitoring), not solely by provider labeling.
    - Worsening mental health conditions (e.g., depression, anxiety, insomnia) that prompt medication initiation, dose increase, or change due to symptom escalation must NOT be classified as “acute uncomplicated illness,” even if the diagnosis is not inherently chronic. Such presentations represent clinically significant morbidity and qualify at least as Moderate complexity when actively managed.
    - Allergic reactions, rashes, hives, pruritus, or urticaria explicitly attributed in the A&P to a prescribed medication (e.g., antibiotics, NSAIDs, psychotropics) MUST be classified as “chronic illness with side effects of treatment” (Moderate complexity), even if the reaction itself is acute in onset.


    ### 2D. If it is an acute condition, is it uncomplicated or complicated?
    - Complicated conditions/injuries involve:
      - High-risk treatment (e.g., surgical intervention),
      - Potential long-term functional impairment,
      - Treatment involving evaluation of body systems not directly part of the injured organ.
      - Post-operative complications (e.g., wound dehiscence, surgical site disruption, post-op infections or delayed healing) MUST be classified as acute, complicated problems for MDM purposes, even when managed outpatient and even in the absence of systemic illness.
    - Examples:
      - Head injury with brief loss of consciousness is complicated.
      - Injuries/fractures requiring cardiovascular and/or neurovascular evaluations are complicated.
      - Minor fractures with predictable healing (e.g., splinting, pain management) are uncomplicated.
      - Rib fractures are uncomplicated unless associated with complications (e.g., pneumothorax, hemothorax, organ injury); do not upgrade rib fractures to complicated solely due to pain with breathing if complications are ruled out.
      - Knee pain, even with fatigue and stiffness, is uncomplicated.
      - Cellulitis (<5 cm) is uncomplicated even if associated with its regular symptoms like fever and swelling.
      - Head/face lacerations requiring suturing with documented evaluation of neurological/ocular status meet criteria for acute, complicated injury due to cross-system evaluation and procedural management.
      - Spinal fractures (including vertebral compression fractures) are acute, complicated injuries due to inherent potential for long-term functional impairment, even without documented neurologic deficits or immediate surgical management.
      - Concussion (mild traumatic brain injury) should be classified as an acute, complicated injury ONLY when the A&P documents complicating features such as loss of consciousness, focal neurologic deficits, prolonged/worsening symptoms, abnormal imaging, high-risk mechanism with neurologic concern, referral to neurology/TBI rehab/therapy, or significant functional impairment requiring structured restrictions. Otherwise, if the A&P documents a mild concussion managed conservatively without the above features, classify as an acute, uncomplicated injury.
      - Routine activity/work restrictions alone (e.g., reduced hours, avoid ladders/driving) in an otherwise mild concussion do NOT by themselves make the injury ‘complicated’ unless the A&P documents significant neurologic impairment, high-risk features, or specialty referral.
    - Do not downgrade an injury to “uncomplicated” solely because initial management is conservative; classify based on the nature of the injury and inherent risks documented in the A&P.
    - Disruption of a surgical wound inherently carries risk of infection, delayed healing, and need for procedural intervention; therefore wound dehiscence should not be downgraded to uncomplicated based on outpatient or conservative management alone.
    - Symptom-only labels (e.g., “rib pain,” “chest wall tenderness”) without a definitive diagnosis do not qualify as uncomplicated injuries when diagnostic workup is performed to determine etiology.
    - If diagnostic workup is ordered to determine etiology and no definitive diagnosis is assigned, classify as uncertain prognosis (2F) rather than uncomplicated, even if complications are not documented.
    - Absence of systemic symptoms (e.g., fever, sepsis) does NOT convert a post-operative complication into an uncomplicated problem.

    ### 2E. If it is an acute condition, does it have systemic symptoms?
    - Classify as acute illness with systemic symptoms only if a condition exhibits systemic symptoms or manifestations with very high risk of morbidity without treatment (e.g., sepsis, hemodynamic instability, significant wheezing or dyspnea suggestive of severe airway disease, multi-system involvement).
    - Do not classify as acute illness with systemic symptoms if symptoms are general (fever, body aches, fatigue) associated with a minor illness; or mild localized symptoms; or symptoms treated to alleviate discomfort; or only potential symptoms are mentioned.

    ### 2F. If it is an acute or chronic condition, is there uncertainty about the underlying cause?
    - IMPORTANT EXCLUSION — Routine evaluation of common symptoms
      - Before assigning “undiagnosed new problem with uncertain prognosis,” confirm that the A&P documents provider-level concern for a non-trivial or high-morbidity condition OR explicitly states that the diagnosis/etiology is unclear.
      - If the presentation represents a common symptom complex (e.g., diarrhea, abdominal pain, cough, dysuria) AND the testing ordered is standard first-line evaluation AND the A&P documents no red-flag features or serious differential concern, the problem MUST be classified as acute, uncomplicated — NOT uncertain prognosis — even if labs, imaging, or referral are ordered.
      - DO NOT UPGRADE BASED ON “ONGOING WORKUP” ALONE
        - The following does NOT qualify as “uncertain prognosis” by itself:
          - Symptoms present for weeks or months
          - A symptom diagnosis (e.g., diarrhea, abdominal pain, cough, headache) without a final cause yet identified
          - Ordering broad or routine diagnostic tests (labs, stool studies, imaging) as part of stepwise evaluation
          - Referral to a specialist for further evaluation WHEN the A&P explicitly documents:
            - No red-flag features
            - No high-morbidity differential
            - No concern for serious or life-threatening pathology
        - In these situations, classify as acute, uncomplicated illness (Low), even if the workup is ongoing.
    - IMPORTANT EXCLUSION — Routine GU presentations:
      - Localized genitourinary symptoms (e.g., penile pain, dysuria, urethral discomfort) evaluated with routine GC/CT, urinalysis, or similar standard-of-care testing — and without documented concern in the A&P for malignancy, ischemia, torsion, severe infection, or systemic illness — MUST be classified as acute uncomplicated illness, not as an undiagnosed new problem with uncertain prognosis, even when no definitive diagnosis label is assigned.
    - Undiagnosed new problems with uncertain prognosis:
      - Are not yet diagnosed and part of a differential diagnosis; and
      - Represent a clinical concern requiring diagnostic evaluation or a structured plan to clarify the diagnosis (e.g., imaging/labs obtained or ordered, targeted referral for diagnostic evaluation, or a time-bound trial of therapy with planned reassessment specifically to determine the diagnosis), with clear documentation in the A&P.
      - Explicit uncertainty trigger: If the A&P explicitly states diagnostic uncertainty (e.g., “etiology unclear,” “unexplained,” “cause unknown,” “workup for …”) and initiates immediate diagnostic evaluation (labs/imaging/referral), classify as undiagnosed new problem with uncertain prognosis (Moderate) unless the A&P documents definitive same-visit results resolving the uncertainty.
      - Override — targeted workup for alternative diagnosis: If the A&P documents a working diagnosis (e.g., “cellulitis favored”) but also explicitly lists a clinically meaningful alternative diagnosis in the differential (e.g., Lyme disease, DVT, malignancy) and orders targeted diagnostic testing specifically to evaluate that alternative, classify the consolidated problem as undiagnosed new problem with uncertain prognosis (Moderate) unless same-visit results resolve the uncertainty.
    - IMPORTANT OVERRIDE — Time-sensitive alternative diagnoses:
      - If the A&P documents concern for, counseling about, or need to urgently exclude a time-sensitive or high-morbidity alternative diagnosis (e.g., testicular torsion, ectopic pregnancy, cauda equina syndrome, compartment syndrome), AND orders immediate or urgent diagnostic evaluation (e.g., stat or next-day imaging) or provides emergency precautions, the problem MUST be classified as an undiagnosed new problem with uncertain prognosis, even if a working diagnosis is documented and initial outpatient treatment is started.
    - Do NOT classify an acute symptom or complaint as an “undiagnosed new problem with uncertain prognosis” when ALL of the following are true:
      - The A&P documents evaluation for common, low-risk, and routinely evaluated conditions (e.g., viral illness, musculoskeletal pain, uncomplicated pelvic infection, small/reassuring lymphadenopathy, mild weight loss without red flags, recurrent epistaxis without instability)..
      - The diagnostic testing ordered (e.g., ultrasound, X-ray, basic labs) represents standard-of-care evaluation for the presenting symptom.
      - There is no documentation in the A&P of clinical instability, red-flag features, high-morbidity differential diagnoses, or concern for serious or life-threatening pathology.
      - In such cases, classify the condition as an acute, uncomplicated illness or injury, even if diagnostic imaging or laboratory testing is ordered.
      - Exception — Structural/organ pathology evaluation:
        - Imaging or testing ordered to evaluate structural, neurologic, renal, vascular, malignant, or fracture-related pathology (e.g., MRI spine for nerve impingement or compression fracture, renal ultrasound to evaluate cyst vs other renal pathology) is NOT considered routine low-risk testing and supports classification as undiagnosed new problem with uncertain prognosis when the etiology remains unclear.
    - Routine infectious or screening-level diagnostic testing ordered as part of standard evaluation for common, low-risk conditions (e.g., STI testing for genital symptoms, rapid strep for sore throat, urinalysis for dysuria) does NOT, by itself and in the absence of documented provider diagnostic uncertainty, establish diagnostic uncertainty for MDM purposes.
      - IMPORTANT EXCLUSION — Common constitutional symptoms (narrow):
        - Common, nonspecific constitutional symptoms alone (e.g., fatigue, malaise, weakness, low energy) evaluated with routine, first-line laboratory testing … MUST be classified as acute, uncomplicated illness unless the A&P explicitly describes diagnostic uncertainty (“etiology unclear,” “unexplained”) or includes red-flag constitutional features such as unintentional/unexplained weight loss, persistent night sweats, unexplained fevers, or other provider-documented concern for non-trivial morbidity.
        Unintentional/unexplained weight loss is NOT considered a “common constitutional symptom” for this exclusion.
      - If the A&P explicitly states that the diagnosis cannot be made clinically, that the appearance is “not definitive,” or that multiple etiologies remain under active consideration, AND immediate diagnostic testing is performed to determine the cause (e.g., rapid strep to distinguish GAS from other etiologies), classify as undiagnosed new problem with uncertain prognosis, even when the condition is common and testing is standard-of-care.
    - If the A&P documents that diagnostic uncertainty is resolved either by a definitive diagnosis or by definitive same-visit test results that the provider explicitly uses to finalize the diagnosis, do not classify as uncertain prognosis.
    - Strong evidence includes confirmed orders (X-ray/MRI/CT; Strep/PCR; HST) accompanied by explicit documentation of a serious/high-morbidity suspected condition being investigated via the order(s) (i.e., beyond routine initial evaluation).
    - Routine/preventive testing without suspicion is NOT uncertain.
    - If orders or referrals are documented as “next steps” contingent on future progression or lack of improvement (e.g., “if no improvement, consider EGD”), do NOT classify as uncertain. Contingent/future plans without immediate workup do not meet uncertain prognosis.
    - If the A&P uses hedged diagnostic language such as ‘likely,’ ‘probable,’ ‘suspect,’ ‘consistent with,’ or ‘rule out,’ AND the documented diagnostic evaluation reflects concern for a serious condition or non-trivial morbidity risk beyond routine standard-of-care testing, treat the condition as an undiagnosed new problem with uncertain prognosis unless the A&P explicitly assigns a definitive diagnosis.
    - If the A&P documents a definitive diagnosis (e.g., “acute URI,” “viral syndrome,” “bronchitis”) and any testing ordered is routine confirmation/exclusion for common low-risk etiologies (e.g., rapid strep, viral panels, UA for dysuria), DO NOT classify as uncertain prognosis.
    - However, if the A&P orders targeted testing for a distinct alternative diagnosis with non-trivial morbidity (e.g., Lyme titer, DVT ultrasound, imaging for malignancy), apply the “targeted workup override” above.
    - Symptom-code clarification (mandatory):
      - A symptom diagnosis (e.g., abdominal pain, back pain, headache) does NOT represent a definitive diagnosis for MDM purposes when the A&P documents active evaluation to determine the underlying cause. If diagnostic testing is ordered to evaluate structural, neurologic, vascular, renal, malignant, or other non-trivial pathology, classify as undiagnosed new problem with uncertain prognosis, even if a symptom ICD code is used.
    - Diagnostic uncertainty applies only when:
      - the A&P documents symptoms or suspected conditions without assigning a definitive diagnosis, or
      - the provider explicitly states that the diagnosis remains uncertain.
    - When tests are ordered to rule out alternative or more serious causes, and a definitive diagnosis is documented in the A&P, classify the condition based on the final diagnosis, not the ruled-out differential.
    - When the A&P documents symptoms without a definitive diagnosis and orders diagnostic testing to determine etiology, classify as an undiagnosed new problem with uncertain prognosis only if the testing reflects evaluation for serious pathology, high-morbidity conditions, or diagnostic uncertainty beyond routine standard-of-care evaluation.
    - For post-trauma localized pain/tenderness (e.g., ribs, hand) where imaging is ordered to evaluate for fracture/structural injury and the A&P does not document a definitive diagnosis, classify as undiagnosed new problem with uncertain prognosis (Moderate). Do not downgrade to “acute uncomplicated injury” solely because complications are not documented.
    - Immediate diagnostic orders strengthen but are not strictly required; however, contingent or future plans (e.g., ‘if symptoms persist, consider…’) without current concern for serious pathology do NOT qualify as diagnostic uncertainty.
    - Referrals to another specialist to further investigate a confirmed diagnosis do not count.
    - Examples:
      - Breast lump with imaging to rule out malignancy.
      - Abdominal pain with workup for appendicitis.
      - Leg pain evaluated for deep vein thrombosis (DVT).
      - Sore throat requiring a Strep test to rule out group A streptococcal.
      - Cough with chest imaging ordered to rule out pneumonia.
      - Suspected obstructive sleep apnea (OSA) with a home sleep test ordered; untreated OSA carries non-trivial morbidity risk.
      - Suspected trigeminal neuralgia with contingent CT/MRI described in the plan when documented as current diagnostic uncertainty guiding management.
      - Palpable soft tissue foot lump with normal X-ray and MRI ordered to investigate the lump and its connection to pain.

    ### 2G. If it is an acute or chronic condition, does it pose an immediate threat to life or bodily function?
    - Apply ONLY with explicit A&P evidence of immediate threat.
    - Examples:
      - Neutropenic lymphoma patient with fever and obtundation.
      - Post-surgical patient with witnessed aspiration on pressor blood pressure support, intubated and febrile.
      - Diabetic patient with limb-threatening leg ulcer and sepsis.
    - If a patient is in pain but life is not in danger, do not apply this category (e.g., severe sleep apnea alone does not qualify).

    ## Overall Complexity Determination
    - Select the overall “Number and Complexity of Problems Addressed” level based on the single highest category met by any addressed problem. For example, if any problem meets “undiagnosed new problem with uncertain prognosis,” the overall level is at least Moderate.
    - Explicitly state which problem(s) determine the overall Problem Complexity Level.
    - Distinct psychiatric diagnoses documented as separate diagnoses in the A&P MUST be counted as separate problems (do not consolidate), even when managed together or with overlapping medications.
    - Do NOT assume chronicity from being a psychiatric diagnosis. Each diagnosis must independently meet chronicity criteria in Section 2B before it can be counted as a chronic condition.


    # Assumptions
    - State all assumptions explicitly. Do not infer unstated details.
    - When documentation is ambiguous, default to the lower problem complexity category.

    # Output Requirements
    - Apply System 2 Thinking: Provide step-by-step reasoning that addresses each instruction section and cites exact A&P text as needed.
    - Consolidate problems and classify each using the steps in Section 2.
    - Select the overall Problem Complexity Level based on the highest category reached by any problem addressed.
    - Explicitly state all assumptions.
    - Explicitly state which problem(s) determine the overall Problem Complexity Level.
    - There must be at least one problem in the final list.
    - Include an overall confidence score between low, medium and high for your problem complexity assessment.


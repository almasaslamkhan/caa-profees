    ## **Official Guideline for Risk of Complications and/or Morbidity or Mortality of Patient Management**:
    - **Minimal**: Minimal risk of morbidity from additional diagnostic testing or treatment, or medication without name specified.  
      - Examples:  
        - Gargles  
        - Elastic bandages  
        - Rest, relative rest
        - Other minimal-risk testing (e.g., home sleep test, PCR test, MRI, ultrasound, EKG, and various blood tests) or treatment  
        - **Referral to a specialist or discussion of possible future treatments/interventions (including CPAP, oral appliance, positional therapy, PHYSICAL THERAPY, OCCUPATIONAL THERAPY, or ANY therapy) with no initiation/order/prescription.**
        - **Referral to physical therapy, occupational therapy, or any therapy is ALWAYS Minimal risk.**
        - a medication without name specified ordered or recommended → Minimal risk

    - **Low**: Low risk of morbidity from additional diagnostic testing or treatment.  
      - Examples:  
        - Over-the-counter medications  
        - Therapies uses OTC, e.g. anti-diarrheal/probiotic therapy
        - IV fluids without additives  
        - Other low-risk treatment 
        - Other low-risk testing that need injection (e.g. needle involved tests)   
        - **Physical therapy is NOT classified as Low risk if only a referral is made—referrals are always Minimal. Only direct provider-performed therapy may be Low risk, which is uncommon.**

    - **Moderate**: Moderate risk of morbidity.  
      - Examples:  
        - Prescription drug management  
        - Decision regarding minor surgery  
        - Decision regarding elective major surgery **without identified risk factors**  
        - Management limited by social determinants of health  
        - **Any ongoing management of a prescribed health device (e.g., CPAP, BiPAP, custom orthotics), including continuation of use, regardless of whether the device was newly prescribed, changed, or simply continued, is always classified as 'Moderate' risk.**

    - **High**: High risk of morbidity.  
      - Examples:  
        - Drug therapy requiring intensive monitoring for toxicity  
        - Decision for elective major surgery **with risk factors**  
        - Decision for emergency major surgery  
        - Decision for hospitalization or escalation to hospital-level care  
        - Decision not to resuscitate or to de-escalate care due to poor prognosis  
        - Decisions regarding controlled substance administration  


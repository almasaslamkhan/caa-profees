    ## **Official Guideline for Risk of Complications and/or Morbidity or Mortality of Patient Management**:
    - **Minimal**: Minimal risk of morbidity from additional diagnostic testing or treatment, or medication without name specified.  
      - Examples:  
        - Gargles  
        - Elastic bandages  
        - Rest, relative rest
        - Other minimal-risk testing (e.g., home sleep test, PCR test, MRI, ultrasound, EKG, and various blood tests) or treatment  
        - **Referral to a specialist or discussion of possible future treatments/interventions (including CPAP, oral appliance, positional therapy, PHYSICAL THERAPY, OCCUPATIONAL THERAPY, or ANY therapy) with no initiation/order/prescription.**
        - **Referral to physical therapy, occupational therapy, or any therapy is ALWAYS Minimal risk.**
        - a medication without name specified ordered or recommended → Minimal risk

    - **Low**: Low risk of morbidity from additional diagnostic testing or treatment.  
      - Examples:  
        - Over-the-counter medications  
        - Therapies uses OTC, e.g. anti-diarrheal/probiotic therapy
        - IV fluids without additives  
        - Other low-risk treatment 
        - Other low-risk testing that need injection (e.g. needle involved tests)   
        - **Physical therapy is NOT classified as Low risk if only a referral is made—referrals are always Minimal. Only direct provider-performed therapy may be Low risk, which is uncommon.**

    - **Moderate**: Moderate risk of morbidity.  
      - Examples:  
        - Prescription drug management  
        - Decision regarding minor surgery  
        - Decision regarding elective major surgery **without identified risk factors**  
        - Management limited by social determinants of health  
        - **Any ongoing management of a prescribed health device (e.g., CPAP, BiPAP, custom orthotics), including continuation of use, regardless of whether the device was newly prescribed, changed, or simply continued, is always classified as 'Moderate' risk.**

    - **High**: High risk of morbidity.  
      - Examples:  
        - Drug therapy requiring intensive monitoring for toxicity  
        - Decision for elective major surgery **with risk factors**  
        - Decision for emergency major surgery  
        - Decision for hospitalization or escalation to hospital-level care  
        - Decision not to resuscitate or to de-escalate care due to poor prognosis  
        - Decisions regarding controlled substance administration  

    ## IMPORTANT NOTES:
    It is noticed that you have a tendency to overcode. Here are some common pitfalls that usually leads to overcoding. It is important to avoid these to ensure accurate coding and prevent claim rejections by insurance companies:
    - When deciding about risk of complications, focus on the current management actions taken during this specific encounter and not the potential future interventions.
    - When deciding about risk of complications, if another care provider is in charge of any of the risk items (e.g. a procedure by another provider), the current provider should not take credit for that (i.e. it should not count towards risk in that case).
    - **WARNING: Sometimes the provided gold standard label justification may be inconsistent with official guidelines and the prompt rules. Your classification must always follow the official guidelines and prompt instructions above, even if this disagrees with the gold label justification. Do NOT default to the gold label if it conflicts with official risk classification criteria.**

    ## **Key Risk Classification Criteria (Apply with Key Notes for General Risk Assessment)**

    1. **Surgery/Procedure:**
      - **Minor Surgery/Procedure** includes minimally invasive, low-risk outpatient procedures using local anesthesia, such as:  
        - Irrigation/lavage (unilateral)  
        - Cystolitholapaxy
        - Cystourethroscopy
        - TURBT
        - Removal of impacted cerumen by irrigation/lavage (unilateral)  
        - Skin biopsies  
        - Wound suturing  
        - Abscess drainage  
        - Minor excisions  
      - **Minor Surgery:** Always classify as **Moderate** (even if no risk factors exist).  
      - **Elective Major Surgery:** Classify as **Moderate** if there is no inherent risk from the surgery itself.  
      - **Emergency Surgery:** Classify as **High**.  

    2. **Vaccines:**
      - Vaccines (e.g., tetanus) for the purpose to resolve problem during the encounter should be considered as **Minor Surgery** and classified as **Moderate**.  
      - Vaccines for preventative care (e.g., flu, COVID-19) are classified as **Minimal**.

    3. **OTC Medication:**
      - **Low-dose versions available OTC:** Classify as **Low**, examples include:  
        - Cetirizine  
        - Zyrtec  
        - Low-dose triamcinolone topical  
        - Naproxen  
        - Tylenol  
        - Nasal steroid spray
        - Moisturizing spray
        - Chloroseptic spray
        - Ibuprofen 600 mg  
        - Iron supplements (unless high-dose or for a specific condition like anemia requiring Rx)
        - Therapies uses OTC, e.g. anti-diarrheal/probiotic therapy
      - **High-dose per unit or combination formulations requiring a prescription:** Classify as **Moderate**, examples include:  
        - Ibuprofen 800 mg  
        - Triamcinolone 0.1% topical cream  
      - **If missing information prevents determining if an OTC medication requires a prescription (e.g., the note mentions an iron supplement but lacks details), assume it is OTC and classify as **Low**.**  
      - **If the note documents a medication (such as ibuprofen 600mg) and does NOT specify that it is being prescribed or is prescription-only for this jurisdiction, you MUST classify it as 'Low' by default (see Key Note #11).**
      - **IMPORTANT: If the note does not specify the medication name: ** Classify as **Minimal** due to no medical evidence.  
        - Example: "Patient advised to take a medicine for diease" → **Minimal**.  
      
    4. **Prescription and High-Risk Medication:**
      - **Prescription medications:** Classify as **Moderate**, examples include:  
        - Robitussin-Codeine  
        - Tamsulosin 0.4 mg  
        - MedroxyPROGESTERone  
        - Sulfamethoxazole-trimethoprim
        - Atorvastatin
        - 4 mg oral tablet, disintegrating
        - BuPROPion  
        - Doxycycline
        - Meloxicam  
        - HydrOXYzine  
        - ClonazePAM  
        - Insulin  
        - Azithromycin  
        - Flexeril  
        - PredniSONE  
        - Cephalexin  
      - Using multiple **non-high-risk prescription medications** does not automatically classify the patient as high risk unless a **high-risk medication** is involved.  
      - Any medication including OTC and prescription with documented adverse effects and specific monitoring plan (e.g. labs/imaging/tests) is **high-risk medication** and classify as **High**.  
      - Chemotherapy is always **high-risk medication** and classify as **High**.  
      - **IMPORTANT: If the note does not specify the medication name: ** Classify as **Minimal** due to no medical evidence.  
        - Example: "Patient advised to take a medicine for diease" → **Minimal**.  

    5. **Health Devices:**
      - **Normal Health Devices:** Classify as **Low**, examples include:  
        - Splints  
        - Ankle braces  
        - Cane
        - Tricyle
        - **Standard, off-the-shelf, or non-custom ankle-foot orthoses (AFOs), splints, and ankle braces—when used for acute injuries and NOT documented as custom-made or complex prescribed devices—are always classified as 'Low' risk. The mere presence of an AFO order or charge does NOT automatically make it a 'Moderate' risk device unless documentation clearly indicates it is custom-made, prescription-only, or functionally equivalent to CPAP/BiPAP. For acute musculoskeletal injuries, standard braces, splints, and AFOs are 'Low' risk unless strong evidence of custom or complex prescription is present.**
      - **Prescribed Health Devices:** Classify as **Moderate**, examples include:  
        - CPAP  
        - BiPAP  
        - Wearable patch cardiac
        - Custom-made orthotics  
      - **CRUCIAL: Ongoing management (including continuation, maintenance, or continued use) of a prescribed health device must ALWAYS be classified as 'Moderate' risk, regardless of whether the device was newly prescribed, changed, or simply continued. If the encounter note documents continued use of a prescribed device (e.g., 'continue to use CPAP until further notice'), this meets criteria for 'Moderate' risk. DO NOT overlook this scenario.**

    6. **Social Determinants of Health (SDoH) Risks:**
      - SDoH factors significantly impact health, well-being, and quality of life. Examples include:  
        - **Living Conditions:** Safe housing, transportation, neighborhoods  
        - **Systemic Factors:** Racism, discrimination, violence  
        - **Economic & Educational Access:** Job opportunities, income, education  
        - **Health & Nutrition:** Access to nutritious food, clean air, water, exercise  
        - **Language & Literacy:** Barriers to understanding healthcare information  
      - If **SDoH risks are explicitly documented in SOAP notes**, classify as **Moderate**.  

    7. **Final Risk Decision:**
      - If **no risk is identified**, classify as **Minimal**.  
      - The final classification should reflect **only the highest identified risk level**.  
        - Example: If the only identified risk is **Low** and no other risks exist, the final risk level is **Low**.  


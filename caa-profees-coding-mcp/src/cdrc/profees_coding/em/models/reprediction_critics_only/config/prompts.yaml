    # Instructions
    Review and reflect on the generated problem complexity assessment. Most of the time, it would be accurate, but you need to double-check that it adheres to the original guidelines as well as the additional instructions below.

    **Important Notes:** 
    Base all problem complexity assessments primarily on the 'Assessment and Plan' (A&P) section, as it contains the provider's clinical judgment and final diagnosis.
    - Use the 'History of Present Illness' (HPI) section only for contextual background, such as disease onset or duration for determining chronicity.
    - Do not rely on HPI to determine severity, uncertainty or progression, as it reflects the patient's subjective description, which may include exaggerations or inaccuracies.
    - Observations/measurements under the 'Objective' section does not count as problems, therefore **not** contributing to problem complexity assessment.

    Apply System 2 Thinking:
    - Explicitly reason by breaking down your thought process step-by-step before reaching a conclusion.
    - The reasoning should mention why each instruction below (header, bullet and sub-bullet in this case) applies or does not apply to this encounter.
    - Ensure that you output the reasoning for **each** instruction.

    ## 0. Evidence from A&P vs. HPI
    - The A&P section is the ONLY authoritative source for determining which problems were addressed during the encounter.
    - Conditions mentioned only in the HPI but not addressed in the A&P section should NOT be included in your assessment.
    - Patient-reported symptoms or worsening in the HPI must be confirmed by provider in the A&P section to be considered valid evidence.
    - Do not include conditions mentioned in the HPI as "history of" or in past medical history unless they are actively managed in the current encounter's A&P section.
    - When determining progression, exacerbations, or side effects, rely solely on provider documentation in the A&P section, not patient subjective reports in the HPI.

    ## 1. Consolidate all conditions
    - If A&P contains a condition/problem with a statement "Encounter for ..." ending with a ICD Z-code, default the **type** of this problem in the output as 'Self-limited or minor problem'; Other problem/condition(s) that do not satisfy this criterion should be assessed as usual.
    - Do not count multiple ICD-10 codes (reported in the A&P) separately if they describe different aspects/symptoms of the same underlying condition or chief complaint.
    - Consolidate related conditions/symptoms into one or more problem based on clinical relevance.
    - Ensure that all "possible" or "potential" conditions are considered during the consolidation if they are in the A&P section.

    ## 2. For each of the consolidated conditions, follow this step-by-step approach to verify that the correct type of condition is selected:
    ### Is it a self-limited or minor problem that will resolve on its own with home remedies?
    - Examples of self-limited or minor problem: minor rashes, a common cold, in-grown toenail, etc.
    - Screenings or exposure assessments (e.g. STD screening) in the A&P section are classified as minor problem unless the physician strongly suspects a condition and orders tests to rule it out.
    - When a patient presents for exposure to a condition or other qualifiers fitting the exposure category, it meets the minor problem criteria. If the patient insists on testing out of fear, and the physician either does not comment or explicitly states, "unlikely" or "little suspicion," the test does not elevate the exposure to an uncertain condition. It remains minimal complexity, as the test is ordered for patient reassurance rather than clinical suspicion.

    ### Is it a chronic or an acute condition?
    - Classify a condition as chronic ONLY if:
      - It is inherently chronic: one of the conditions in the chronic conditions list: Major Depressive Disorder (**not** Depression), Alcohol Abuse, Arthritis (including Osteoarthritis and Rheumatoid), Systemic Lupus Erythematosus, Psoriasis, Chronic inflammatory conditions, Heart Failure, Ischemic Heart Disease, Cardiomyopathy, Coronary Artery Disease, Peripheral Vascular Disease, Chronic Venous Hypertension, Alzheimer's Disease, Dementia, Parkinson's Disease, Multiple Sclerosis, Epilepsy, Chronic pain syndromes, COPD, Pulmonary Fibrosis, Bronchiectasis, Inflammatory Bowel Disease (Ulcerative Colitis and Crohn's), Chronic gastrointestinal conditions, Biliary disease, Diabetes Mellitus, Hyperlipidemia, Thyroid disorders (Hypo/Hyperthyroidism), Chronic Kidney Disease, ESRD, HIV/AIDS, Chronic Hepatitis, Schizophrenia, ADHD, Autism Spectrum Disorders, Intellectual Disability, Substance Dependence, Hypertension, Glaucoma, Osteoporosis, Gout, Paraplegia, Blood disorders (Thalassemia, Sickle Cell Disease), Monoclonal Gammopathy;
      - Alternatively, if the condition is not in the above list, then there must be explicit evidence in the note (HPI can be used for this), indicating that it has persisted for **more than a year**.
      Note: A documented onset date takes precedence as evidence for chronicity. If unavailable, an explicit mention of persistence time or chronicity in the note can be used as evidence for chronicity.
    - DO NOT assume conditions are inherently chronic if they are not in the list above. Many conditions that can persist long-term but **less than a year** are not automatically chronic, including:
      - Anxiety (unless specifically documented as Generalized Anxiety Disorder),
      - Pain conditions (unless explicitly documented as chronic),
      - Insomnia (unless explicitly documented as chronic),
      - Depression,
      - Muscle stiffness,
      - Benign Positional Vertigo (BPV).
    - When determining chronicity, you MUST cite the specific text from the note that supports your assessment:
      - Quote the exact text showing a duration > 1 year or explicit labeling as "chronic";
      - If no duration is mentioned anywhere in the note, you MUST classify the condition as acute.
    - Do not classify a condition as chronic based on severity or recurrence alone.
    - Statements merely reporting the patient's past medical history with phrahses like "a (longstanding) history of XYZ", where 'XYZ' denotes certain symptoms/conditions, does not indicate the chronicity of 'XYZ' on its own. This is standard phrasing in medical documentation and does not establish duration.
    - Do not classify conditions such as menstrual cramps as chronic as they are commonly experienced by most people. Thus they are treated as symptoms rather than conditions.

    ### If it is a chronic condition, is it stable or does it have exacerbations, progression, or side effects of treatment?
    - Being "stable" is defined by the specific treatment goals for an individual patient; A patient is **not stable** if they are not at their treatment goal, even if:
      - The condition has not changed;
      - There is no short-term threat to life or function.
      Examples:
      - A patient with persistently high blood pressure is **not stable**, even if asymptomatic.
      - Severe obstructive sleep apnea is **not stable** if respiratory events are above the target even with treatment.
      - Non-severe sleep apnea is **stable** only if respiratory events are below target.
    - Identify progression and exacerbations **ONLY** in the A&P section by: 
      - looking for keywords indicating progression, such as worsening, declining, not improving;
      - looking for any of persistent symptoms, nocturnal symptoms, or exacerbations (e.g., wheezing, shortness of breath).
      Note: A condition can be **declining** or **progressing** even if managed with medication.
    - Severity classification:
      - Classify exacerbations or side effects as **severe** only if explicitly mentioned in the note (HPI can be used for this) that the condition has worsened since the last visit.
      Example:
        - Severe obstructive sleep apnea is **not** considered "Chronic illness with severe exacerbations" unless it has worsened since the patient was last seen.
    - **Side effects of treatment must be confirmed** to be able to count. In other words, "possible" side effects (e.g., "possible allergic reactions") do **not** count.

    ### If it is an acute condition, is it uncomplicated or complicated?
    - Complicated conditions/injuries involve:
      - High-risk treatment (e.g., surgical intervention),
      - **Potential** long-term functional impairment,
      - Treatment involving evaluation of body systems **not directly part of the injured organ**.
      Examples:
      - A head injury with brief loss of consciousness is complicated.
      - Injuries/fractures requiring cardiovascular and/or neurovascular evaluations are complicated.
      - Vaginal adhesions are uncomplicated.
      - Minor fractures with predictable healing (e.g., splinting, pain management) are uncomplicated.
      - Rib fractures are uncomplicated unless associated with complications (e.g., pneumothorax, hemothorax, organ injury).
      - Knee pain, even with fatigue and stiffness, is uncomplicated.
      - Cellulitis (<5cm) is uncomplicated even if associated with its regular symptoms like fever, and swelling.

    ### If it is an acute condition, does it have systemic symptoms?
    - **Classify as acute illness with systemic symptoms** only if:
      - A condition exhibits systemic symptoms or manifestations with **very high risk of morbidity without treatment**.
      Examples: sepsis, hemodynamic instability, wheezing, difficulty breathing, multi-system involvement, etc.
    - **Do not classify as acute illness with systemic symptoms** if:
      - The symptoms are general (e.g., fever, body aches, fatigue) and associated with a minor illness;
      - The symptoms are mild localized ones (e.g., facial swelling, mild fever, discomfort);
      - The symptoms might be treated to alleviate discomfort;
      - Only **Potential** symptoms are involved or mentioned.
    - **Systemic symptoms can be multi-system or single-system**.

    ### If it is an acute or chronic condition, is there uncertainty about the underlying cause?
    - Undiagnosed new problems with uncertain prognosis are conditions that:
      - Are not yet diagnosed and part of a differential diagnosis;
      - Represent a **clinical concern** requiring immediate workup to rule out, with a **clear documentation** in the A&P section.
      Examples:
      - Breast lump with workup (e.g. MRI) to rule out malignancy.
      - Abdominal pain requiring workup for appendicitis.
      - Leg pain with evaluation for deep vein thrombosis (DVT).
      - Sore throat requiring a Strep test to rule out group A streptococcal.
      - Right-side body pain requiring an X-ray to rule out fractures or internal bleeding.
    - Confirmed order(s) (e.g., an X-ray/MRI or a Strep/PCR test to rule out a clinical concern) are strong evidence of an undiagnosed new problem, given that: 
      - The provider explicitly documents what the clinical concern is, and that they are investigating it via the order(s).
    - The A&P section must clearly indicate physician's uncertainty about an underlying condition. 
      - Look for keywords like "suspected", "rule out", "uncertain", "possible", "potential", "red flag", etc; 
      - Look for key phrases like "ordered ... to rule out/investigate ...", etc.
    - If an order is placed to rule out suspected condition(s) **and results are already documented in the same visit**, **do not** classify the condition as having an uncertain prognosis.
    - Routine or preventive diagnostic testing without suspicion of a specific condition does NOT qualify as an undiagnosed new problem with uncertain prognosis.
    - If diagnostic orders or referrals are documented as part of "next steps" in case of progression rather than immediate workup/actions, the condition should **not** be classified as uncertain.

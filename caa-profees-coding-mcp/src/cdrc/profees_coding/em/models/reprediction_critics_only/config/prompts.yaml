      ## Task  
      From the information provided, select **every** applicable encounter-type category below, using 2025 AMA Evaluation-and-Management (E/M) Medical-Decision-Making (MDM) guidelines.

      1. Office or other outpatient visits  
      2. Preventive medicine (e.g., annual physical, well-child visit, wellness visit, routine follow-up and preventive health assessment, preventive care, newborn weight check)
          * Preventive visits are comprehensive, age- and sex-appropriate evaluations that include counseling, anticipatory guidance, and risk-factor-reduction interventions.  
          * If a significant, separately identifiable problem is addressed (e.g. lab or medication or any other medical service ordered) that **requires the key components of a problem-oriented E/M service**, report **both** the preventive-medicine and the office/outpatient categories.  
          * Do **not** add the office/outpatient category when the problem or abnormality or symptom is trivial, or not significant enough to require additional work (i.e. reassurance, or no follow-up is needed), or the problem is not focus of this encounter.
          * Health screening (e.g. routine follow-up and preventive health assessment, preventive care, newborn weight check) that is not the patient’s chief complaint or main reason for the visit in the SOAP note, does not qualify as a preventive visit even there is a preventative screening item recorded in A/P.
          * If the patient has a routine check-up history, but the visit is primarily for a problem-oriented service, it does not qualify as a preventive visit even there is a preventative screening recorded.
          * A health screening is only valid as a preventive visit if the SOAP note’s Assessment and Plan section includes documentation of a wellness exam, it typically associated with ICD-10-CM codes such as Z00.00, Z00.01, Z00.110, Z01.419, Z01.411, Z12.5.
            •	If an ICD code is not explicitly listed but the specific exam is clearly documented in the Assessment and Plan section, it may still be considered valid.
            •	If no wellness examination is documented in the SOAP note, the encounter must not be classified as Preventive Medicine.
          * Schedule for future preventive visits should not be counted as a preventive visit.
          * Vaccines fall under routine preventative care rather than surgical or complex medical interventions. Only administering healthcare maintenance vaccines (e.g., flu shot) does not qualify as a preventive visit. 
          * A screening does not qualify as a Preventive Medicine encounter if it is performed to evaluate a specific problem or symptom — that is, if the screening is part of a problem-oriented outpatient visit, it should be classified as Outpatient, not Preventive.
      
      **Strict selection policy**:
        •	Only include categories with explicit supporting evidence in the SOAP note.
        •	If the SOAP note does not explicitly document a wellness exam or preventive service in A/P (Assessment and plan) section, do ***NOT*** classify the encounter as Preventive Medicine.
        •	When uncertain, do not assign the category.
        •	Do not mention or justify unselected categories

      **Evidence requirement**:
        - For each selected encounter type, provide:
          • objective_evidence: direct quote(s) from Objective/Exam supporting the encounter type.
          • assessment_plan_evidence: direct quote(s) from A/P showing the work performed for that encounter type.

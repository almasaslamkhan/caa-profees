    ## **Key Notes for General Risk Assessment (Must be Cross-Checked for Every Classification)**
    1. If the doctor **recommends new treatment**, or **recommends continuing, defer , discontinuing, or making no change** to **previous** treatment but does not list it in the orders, still consider it a risk and classify accordingly (e.g. recommend to stop/defer OTC count as Low, defer/stop Rx count as Moderate).  
      - **This includes prescription drugs that are ordered and then discontinued within the encounter. Discontinuing a prescription drug at any point during the encounter constitutes prescription drug management and MUST be classified as 'Moderate' risk. Do NOT ignore discontinued prescription medication orders when assessing risk.**
      - **This rule also applies to prescribed health devices: If the note documents that a prescribed device is to be continued or maintained, classify as 'Moderate' risk even if there is no change or new order.**
      - **IMPORTANT: If a provider documents to continue or maintain any prescription medication (even without change), this is prescription drug management and must be classified as 'Moderate' risk.**
      - **IMPORTANT ADDITION: If a note documents that the patient is taking a medication 'as prescribed' by another provider, or is continuing a prescription medication from another provider, this counts as ongoing prescription drug management and must be classified as 'Moderate' risk for this encounter. The provider's acknowledgment or continuation of the prescription is sufficient—do not require a new prescription to be written at this visit.**
      - **CLARIFICATION: Even if the prescription medication being continued or acknowledged is also available over-the-counter (OTC), if the documentation indicates it is being managed as a prescription (e.g., 'naproxen as prescribed by [provider]'), you MUST classify the risk as 'Moderate' per official guidelines and Key Note #1. The OTC status does NOT override the prescription management status. If the provider at this encounter acknowledges, continues, or manages a prescription medication (even if originally prescribed by another provider), this always constitutes 'Moderate' risk. Do NOT default to 'Low' risk based on OTC availability if prescription management is documented.**
    2. When a doctor provides information **without an explicit order**, classify as **Minimal**.  
    3. If the doctor **recommends gargles, elastic bandages, rest, exercise, or minimal-risk testing (e.g., strep test, PCR test)**, classify as **Minimal**.  
    4. DO NOT classify **referrals, consultations, or discussions** of surgery or treatment as risk, regardless of their urgency or specialty destination = always Minimal.  
      - Example: **"Referral to a surgery"** → **Minimal**.  
      - Example: **"Discuss the option of a surgery"** → **Minimal**.  
      - Example: **"Doctor recommends a referral"** → **Minimal** (referrals are always minimal risk, regardless of destination or urgency).
      - **Example: Referral to physical therapy, occupational therapy, speech therapy, or any therapy → ALWAYS Minimal**
    5. DO NOT classify any treatment based on **hypothetical, conditional, or potential future decisions**  = always Minimal.  
      - Example: "If symptoms worsen, take medication" → **Minimal**.  
      - Example: "If the test is positive, start treatment" → **Minimal**.  
      - Example: "Patient potentially need a surgery" → **Minimal**.  
      - Example: "Plan to discontinue OTC" → **Minimal**.  
    6. A **previously completed treatment** should **not** be counted as a risk.  
    7. **Diagnosis alone** (e.g., vaccination reaction) **does not** count as a risk.  
    8. Do **not ignore** any identifiable risk factor that can be classified.  
    9. Taking **multiple low-dose medications** does not increase risk classification.  
    10. When a **doctor prescribes an OTC medication**, classify it as **Moderate**. If the note does not specify the medication name: ** Classify as **Minimal** due to no medical evidence.  
        - Example: "Patient advised to take a medicine for diease" → **Minimal**.  
    11. If the encounter note does not specify whether the supplement is Rx or OTC, assume it is OTC and classify as **Low**.
      - Example: If the note says, “Patient advised to take iron,” but does not specify the dose, assume it’s an OTC supplement.
      - Therapies uses OTC, e.g. anti-diarrheal/probiotic therapy, are considered as OTC and classify as **Low**.
      - **If the note recommends a medication that could be either OTC or prescription (such as ibuprofen 600mg), and there is no explicit documentation of prescription or prescription-only dosing, default to OTC and classify as 'Low' risk.**


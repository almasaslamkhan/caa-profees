      If chronic conditions are described as stable/controlled/at goal/asymptomatic/no changes/continue current management AND only routine periodic labs or routine 6-12 month follow-up/lifestyle advice are planned, this is NOT separate problem-oriented MDM, so do NOT select Office/Outpatient.

      CRITICAL MED REFILL RULE:
      A refill/continuation alone, with no start/stop/change and no documented management decision about control/risks/side effects, does NOT qualify for Office/Outpatient.

      PREVENTIVE OVERRIDE:
      If the encounter is clearly a wellness/preventive exam, do NOT add Office/Outpatient merely because stable chronic conditions are listed or long-term meds are continued/refilled. Add Office/Outpatient during a preventive visit ONLY if there is a significant, separately identifiable problem requiring problem-oriented MDM.

      CATEGORY 3 - Preventive Medicine (Wellness):
      Select ONLY if the A/P explicitly documents a wellness/preventive exam, such as annual physical, wellness visit, well-child, routine preventive health assessment, or Z00.xx/Z01.xx/Z12.5-style preventive assessment.
      Do NOT select Preventive if A/P does not clearly document a wellness exam.
      Vaccines alone do not make a visit preventive. Scheduling a future preventive visit does not count. Screening for symptoms/problems is not preventive.

      COMBINATION RULE:
      If both a documented preventive exam AND separately identifiable problem-oriented MDM are present, select BOTH Preventive Medicine and Office/Outpatient. Do NOT add Office/Outpatient for trivial/incidental issues.

      EVIDENCE REQUIREMENT for each selected category:
      - objective_evidence: direct quote(s) from Objective/Exam supporting the category.
      - assessment_plan_evidence: direct quote(s) from A/P or note text showing the work performed or the not-supported rule.
      - For NOT_SUPPORTED, assessment_plan_evidence must quote the NCCI/global surgery/payment-included/not-separately-reportable language.
      - For Preventive Medicine, assessment_plan_evidence must explicitly state wellness/preventive exam, otherwise do not select it.


        - If the order list in EHR shows 'X-Ray (completed by Radiology)' and the physician said in the note 'no issue based on X-Ray' or 'fractures on some body parts'. Then 'Intpr' should be added to the model response.
        - **Exception for CT/MRI:** If CT or MRI test results are mentioned in the note without statements indicating that the physician independently interpreted them, remove 'Intpr' from the model response, even if the results are summarized.
        - If the Radiology test results are provided by the patient instead of interpreted by the physician, remove 'Intpr' from the model response regardless of whether the physician makes any diagnosis based on the imaging results.
        - If the note mentioned the conclusion based on imaging without specific information about the order of the imaging test, remove 'Intpr' from the model response.
        - If the Radiology test results are provided by the patient instead of the practitioner, remove 'Intpr' from the model response.

      3. Check the presence of independent historian (iHx) carefully with the following rules:
        - If there is a clear sign that there is an independent historian providing history, such as 'the [PARENTHOOD] reported or noted something', add independent historian to the model response, **except where overridden by a more specific rule below (for example, babies and newborns)**.
        - Do NOT assume independent historian based on the age or the occupation of the patient. If the model is predicting the presence of independent historian based on the content of the SOAP note in its justification, remove independent historian from model response.
        - Check if the patient is capable to provide the full history of the encounter. If yes and the person other than the patient did not provided crucial additional information to the encounter, remove independent historian from model response.
        - For babies and newborns who cannot provide history by themselves, remove independent historian from model response even if their parents or guardians provided history in the encounter (this is an explicit exception to the general iHx rule above).
        - People (such as parents, trusted friends) discussed with the physician about the treatment plan in assessment and plan section do not count as independent historian.
        - Check if the independent historian did NOT physically attend the encounter. If they did not attend in person or via real-time communication, remove 'iHx' from model response.
        - People did something outside the encounter (for example last night, last week, etc) does not count as independent historian.

      4. Check and update (if necessary) the numbers of tests & documents based on the following instructions.
        - Physical exams and medication orders should not be counted as tests & documents elements.

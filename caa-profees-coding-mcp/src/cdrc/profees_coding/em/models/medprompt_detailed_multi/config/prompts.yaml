      Apply the same criteria and guardrails as v26, with ED context.
      Use only explicitly documented facts from this encounter note and additional information.
      Determine the single highest defensible problem complexity level and provide concise rationale.
      Do not infer undocumented problems, progression, or management actions.

      Input:
      {{text}}
      {% if additional_info %}
      Additional information:
      {{additional_info}}
      {% endif %}

      Output format:
      {{format_instructions}}
      DO NOT add any content before or after the JSON.
  data_complexity:
    v14: |
      You are auditing AMA E/M Data Complexity for an Emergency Department encounter.
      Apply the same data-counting rules used in v14, including unique test counting and exclusions.
      Use only this encounter's documentation; do not infer missing review/interpretation/discussion.
      Reassess tests/documents, iHx, independent interpretation, and external discussion, then return final data level.

      Input:
      {{text}}
      {% if additional_info %}
      Additional information:
      {{additional_info}}
      {% endif %}

      Output format:
      {{format_instructions}}
      DO NOT ADD any content before or after the JSON.
  risk_of_complications:
    v32: |
      You are auditing AMA E/M Risk of Complications for an Emergency Department encounter.
      Apply the same risk logic as v32 with ED context:
      - Count only same-day management actions documented in A/P or Orders.
      - Do not infer undocumented prescriptions/procedures/escalations.
      - Select the single highest supported risk level.

      Input:
      {{text}}
      {% if additional_info %}
      Additional information:
      {{additional_info}}
      {% endif %}

      Output format:
      {{format_instructions}}
      DO NOT ADD any content before or after the JSON.


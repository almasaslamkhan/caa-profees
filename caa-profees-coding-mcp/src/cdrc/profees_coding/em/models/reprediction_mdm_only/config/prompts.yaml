    user: |
      ## Task
      From the information provided, select **every** applicable encounter-type category below using 2025 AMA Evaluation-and-Management (E/M) Medical-Decision-Making (MDM) guidelines.

      ---

      ### 1. Office or other outpatient visits (Problem-Oriented E/M)

      Select this category **ONLY** when the Assessment & Plan (A/P) documents **separate, problem-oriented medical decision-making (MDM)** beyond routine preventive care.

      Office/Outpatient requires **active evaluation or management of a problem** that involves clinical decision-making.

      #### Counts as Office/Outpatient (must be tied to a specific problem)

      **Diagnostics for a problem**
      - Labs ordered to evaluate or monitor a diagnosed condition (not routine screening)
      - Imaging ordered for symptoms or a condition
      - Diagnostic tests (EKG, PFTs, urinalysis, cultures, etc.) for a complaint or disease

      **Medication Management (requires evidence of active decision-making)**
      - Starting a NEW medication
      - Stopping a medication due to side effects, inefficacy, or clinical decision
      - Changing dose or regimen with documented rationale
      - Refilling a medication **ONLY IF** the A/P includes condition-specific assessment, monitoring, or risk discussion
      - Discussing medication risks/benefits as part of management of a condition

      **Therapeutic / Procedural Management**
      - Injections or in-office treatments for a condition
      - Wound care management plans
      - Splinting, DME orders, etc.

      **Referrals for a problem**
      - Referral to a specialist for evaluation/management of a condition
      - Referral for procedures because of symptoms or disease

      **Condition-Specific Monitoring**
      - Short-interval or disease-specific follow-up (e.g., “Return in 2 weeks for BP recheck”)
      - Condition-specific monitoring that reflects ACTIVE MANAGEMENT, such as:
        - Ordering labs or tests **due to concern for poor control, new symptoms, or medication adjustment**
        - Changing monitoring frequency **because of instability or treatment decisions**
        - Monitoring orders explicitly tied to a management decision

      **Condition-Specific Counseling**
      - Counseling directly linked to management of a diagnosed problem (not general wellness advice)

      ---

      #### Does NOT qualify as Office/Outpatient

      Do **NOT** select this category when a condition is only:

      - Listed in history with no active management
      - Described as stable without evaluation, orders, or changes
      - Given reassurance only
      - A trivial/self-limited issue with no work-up
      - A past diagnosis unrelated to today’s care
      - A screening result noted without action
      - Vitals reviewed without condition-based decision-making

      ---

      ### Stable Chronic Condition Rule (Critical)

      Do **NOT** classify as Office/Outpatient when a chronic condition is documented as:

      - Stable
      - Controlled
      - At goal
      - Asymptomatic
      - “No changes needed”
      - “Continue current management”

      **AND** the plan only includes:

      - Routine periodic labs (e.g., “recheck TSH in 6 months”)
      - Routine follow-up intervals (e.g., “follow up in 6–12 months”)
      - General lifestyle advice without treatment changes

      **Routine surveillance of a stable condition is considered part of preventive or longitudinal care and does NOT represent separate problem-oriented MDM.**

      Office/Outpatient requires evidence of **active management**, such as:
      - Worsening or uncontrolled disease, OR
      - A medication start/stop/change, OR
      - New diagnostic evaluation prompted by symptoms or concern, OR
      - Risk-based management decisions (e.g., starting treatment due to elevated risk)

      If none of the above are present, do **NOT** select Office/Outpatient.

      ---

      ### Medication Refill Rule (Critical)

      Do **NOT** classify as Office/Outpatient when a medication is:
      - Continued without change
      - Refilled without dose adjustment
      - Renewed as part of routine preventive or chronic care

      **A refill alone does NOT indicate problem-oriented MDM.**

      Medication management only qualifies when the note documents:
      - A new medication start, OR
      - A medication being stopped, OR
      - A dose or regimen change, OR
      - A documented clinical decision about risks, side effects, or disease control that affects therapy

      If the medication is simply continued and no management decision is documented, do **NOT** select Office/Outpatient.

      ---

      #### Preventive Visit Override Rule

      If the encounter is clearly documented as a **wellness/preventive exam**, do **NOT** assign Office/Outpatient **solely because** stable chronic conditions are listed or long-term medications are continued/refilled.

      Continuation or refill of chronic medications during a preventive visit does **NOT** count as problem-oriented MDM **UNLESS** the A/P includes:
      - A medication start/stop/change, OR
      - Documented assessment of disease control or worsening that changes management, OR
      - Condition-specific monitoring orders tied to instability/management decisions, OR
      - A referral for that condition, OR
      - A separate follow-up plan specifically for that condition (not just “annual follow-up”).

      ---

      ### 2. Preventive Medicine (Wellness / Routine Health Maintenance)

      Select this category **ONLY IF** the Assessment & Plan explicitly documents a **wellness/preventive exam**.

      Preventive visits are comprehensive, age- and sex-appropriate evaluations that include counseling, anticipatory guidance, and risk-factor-reduction interventions.

      Examples include:
      - Annual physical exam
      - Well-child visit
      - Wellness visit
      - Routine preventive health assessment
      - Preventive care visit
      - Newborn weight check

      ---

      #### Requirements for Preventive Medicine

      A preventive visit is valid **ONLY IF** the A/P documents a wellness exam and is typically associated with ICD-10-CM Z codes such as:
      Z00.00, Z00.01, Z00.110, Z01.419, Z01.411, Z12.5

      If a code is not listed but the exam is clearly documented, it may still qualify.

      If **no wellness examination** is documented in A/P, do **NOT** classify as Preventive Medicine.

      ---

      #### Important Preventive Rules

      - Vaccines alone do NOT make a visit preventive.
      - Scheduling a future preventive visit does NOT count.
      - Screening performed to evaluate a symptom/problem is **not** preventive — it is problem-oriented.
      - If a visit is primarily problem-oriented, it is **not** preventive even if screening items are included.
      - Health screening only qualifies if the wellness exam is clearly documented in A/P.

      ---

      #### Preventive + Office Combination Rule

      If a **significant, separately identifiable problem** is addressed that requires **problem-oriented MDM**, report **both** Preventive and Office/Outpatient.

      Do **NOT** add Office/Outpatient when the problem is trivial, incidental, or requires no additional work beyond the preventive exam.

      ---

      ## Strict Selection Policy

      - Only include categories with explicit supporting evidence in the SOAP note.
      - If the SOAP note does not explicitly document a wellness exam in A/P, do NOT classify as Preventive Medicine.
      - When uncertain, do not assign the category.
      - Do not mention or justify unselected categories.

      ---

      ## Evidence Requirement

      For each selected encounter type, provide:

      - **objective_evidence**: direct quote(s) from Objective/Exam supporting the encounter type
      - **assessment_plan_evidence**: direct quote(s) from A/P showing the work performed

      For **Preventive Medicine**, assessment_plan_evidence must explicitly document a wellness/preventive exam, otherwise do NOT select it.

      ---


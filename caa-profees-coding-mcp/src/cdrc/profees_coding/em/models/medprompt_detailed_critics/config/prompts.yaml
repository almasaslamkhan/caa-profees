      From the information provided, select **every** applicable encounter-type category below, using 2025 AMA Evaluation-and-Management (E/M) Medical-Decision-Making (MDM) guidelines.

      1. Office or other outpatient visits  
      2. Preventive medicine (e.g., annual physical, well-child visit, wellness visit)
          * Preventive visits are comprehensive, age- and sex-appropriate evaluations that include counseling, anticipatory guidance, and risk-factor-reduction interventions.  
          * If a significant, separately identifiable problem is addressed that **requires the key components of a problem-oriented E/M service**, report **both** the preventive-medicine and the office/outpatient categories.  
          * Do **not** add the office/outpatient category when the problem or abnormality is trivial and requires no additional work.
          * Health screening that is not the patient’s chief complaint or main reason for the visit does not qualify as a preventive visit.
          * Schedule for future preventive visits should not be counted as a preventive visit.
          * Only administering healthcare maintenance vaccines (e.g., flu shot) does not qualify as a preventive visit.
          * If the patient has a routine check-up history, but the visit is primarily for a problem-oriented service, it does not qualify as a preventive visit.
      **Important:
        ** Missing a valid encounter-type category is a more serious error than assigning an extra one, because clinicians can more easily delete an unwarranted category than add a missing one.


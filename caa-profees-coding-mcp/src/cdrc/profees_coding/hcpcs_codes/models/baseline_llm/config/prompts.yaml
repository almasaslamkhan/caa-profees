      ======================================================================
      CMS INTENT (AWV CODES)
      ======================================================================

      AWV codes represent PREVENTIVE, WELLNESS-focused Medicare services.
      They are NOT problem-oriented E/M visits.

      AWV codes require:
      - Active Medicare Part B coverage
      - Clear documentation of an AWV/IPPE service
      - Strict adherence to timing and prior-history rules

      ======================================================================
      AWV CODE DEFINITIONS
      ======================================================================

      G0402 — Initial Preventive Physical Exam (IPPE)
      - “Welcome to Medicare”
      - Within first 12 months of Medicare Part B enrollment
      - Billable ONCE per lifetime

      G0438 — Initial Annual Wellness Visit
      - First AWV after IPPE (or if IPPE never done)
      - Billable ONCE per lifetime

      G0439 — Subsequent Annual Wellness Visit
      - Requires prior AWV
      - Must be ≥12 months after the most recent AWV

      ======================================================================
      REQUIRED ELIGIBILITY CHECKS (ALL REQUIRED)
      ======================================================================

      A. Medicare Coverage
      - Health plan indicates Medicare Part B
      - Coverage effective date is ON or BEFORE the Encounter Date

      B. Encounter Type
      - Encounter is explicitly a preventive / wellness visit
      - NOT problem-oriented E/M alone
      - NOT “annual physical” unless clearly structured as AWV/IPPE

      C. Timing & History (from AWV history)
      - Prior AWV/IPPE codes and dates must be reviewed
      - CMS timing rules must be strictly satisfied
      - If AWV history is missing or ambiguous → NO AWV code

      ======================================================================
      HARD NOs
      ======================================================================

      - Non-Medicare or inactive Medicare Part B
      - Duplicate initial codes
      - AWV billed <12 months since prior AWV
      - Problem-focused visit without AWV structure
      - Missing or unclear AWV history

      ======================================================================
      RUBRIC (LLM FILLS; RULE ENGINE DECIDES)
      ======================================================================

      Extract the following fields:

      - medicare_part_b_active
      - medicare_part_b_effective_before_encounter
      - within_medicare_first_12_months
      - is_preventive_visit
      - awv_structure_documented
      - prior_ippe_exists
      - prior_awv_exists
      - prior_awv_within_12_months

      ======================================================================
      DECISION RULE
      ======================================================================

      Assign ONLY ONE code:

      1) Assign G0402 if:
        - Medicare Part B active
        - within first 12 months of enrollment
        - no prior G0402
        - IPPE clearly documented

      2) Assign G0438 if:
        - Medicare Part B active
        - no prior AWV
        - wellness visit documented

      3) Assign G0439 if:
        - Medicare Part B active
        - prior AWV exists
        - ≥12 months since last AWV
        - wellness visit documented

      Otherwise → NO AWV code.

      ======================================================================
      OUTPUT
      ======================================================================

      Return ONLY the JSON specified in {{format_instructions}} with:
      - procedure: ["G0402"] | ["G0438"] | ["G0439"] | []
      - justification: brief, rule-based explanation | None


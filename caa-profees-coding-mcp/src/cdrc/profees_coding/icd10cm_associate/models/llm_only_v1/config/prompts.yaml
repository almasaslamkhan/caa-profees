      {{em}}
      ### CPT/HCPCS Procedures for this encounter:
      {{procedure}}
      ### ICD-10-CM Diagnoses for this encounter:
      {{diagnosis}}

      ## Output Format
      Return your answer **only** as a JSON object that follows this schema:
      {{format_instructions}}

      ### Patient Age:
      {{patient_age}}
      ### Patient Gender:
      {{patient_sex}}
      ### SOAP Note:
      {{note}}
      ### Orders:
      {{orders_display}}

      ### CPT E/M Codes for this encounter:
      {{em}}

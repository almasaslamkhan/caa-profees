      ## Diagnosis Coding Guidelines
      The following are ICD-10-CM diagnosis coding guidelines which must be used when completing the diagnosis coding task:
      
      - **Current Diagnoses Only**: Code the main reason for the visit and any additional current or coexisting conditions only when the note shows they required or affected care, treatment, or management during the encounter; do not code resolved conditions unless a supported history or status Z-code applies.
      - **No Uncertain Diagnoses**: Do not code probable, suspected, possible, rule out, questionable, likely, working, compatible with, consistent with, or similar uncertain diagnoses; if no confirmed diagnosis is established, code the documented symptom, sign, abnormal finding, or other reason for the visit.
      - **Managed Chronic Conditions Only**: Code chronic or coexisting conditions only when the note shows they were treated, monitored, followed, or otherwise affected care during the encounter; do not code from medication lists alone.
      - **Highest Supported Specificity**: Code the most specific diagnosis supported by the note, do not infer unsupported details such as laterality, acuity, chronicity, stage, or causal relationships, and do not assign both a broader diagnosis and its component diagnoses when the note supports a single diagnosis concept rather than separately managed conditions.
      - **Supported Z-Codes Only**: Use history, status, screening, counseling, follow-up, aftercare, or preventive Z-codes only when clearly supported by the note and appropriate to the encounter; use current diagnoses over history codes and screening codes only for true screening.
      
      ## Association Coding Guidelines
      The following are association coding guidelines which must be used when completing the association coding task:
      
      - **Explicit Links Only**: Associate a diagnosis to an E/M service or procedure only when the A/P explicitly and unambiguously supports the link; do not rely on assumptions, typical relationships, or unlinked context.
      - **Current Encounter Only**: Associate only diagnoses that were assessed, managed, or followed up during the current encounter, and do not associate historical or offsite procedures.
      - **Active Management Only**: Associate chronic, serious, complex, or G2211-related diagnoses only when the A/P shows evaluation, management, therapy review or titration, risk stratification, goal setting, care coordination, or other ongoing longitudinal care; terms like stable, continue therapy, or routine follow-up are sufficient only when active management is evident.
      - **Documented Indications Only**: Associate diagnoses to labs, diagnostics, or procedures only when the A/P or order documentation identifies them as the indication, and include all explicitly documented relevant diagnoses for multi-indication orders performed in the current encounter.
      - **Best-Supported Diagnosis Only**: Link the most specific diagnosis, avoid redundant combination/component diagnoses unless separately managed, link symptoms only when no definitive diagnosis exists or they are separately managed, and in mixed visits link Z-codes to preventive services and active diagnoses to problem-oriented services unless documented with both.

      Your output must reflect accurate ICD-10-CM code identification and association, where all decisions made are supported by documentation and medical coding best practises. Accuracy is your highest priority.

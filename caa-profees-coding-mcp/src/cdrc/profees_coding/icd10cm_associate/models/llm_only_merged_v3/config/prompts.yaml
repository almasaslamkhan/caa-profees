      ## R-Code Diagnosis Coding Guidelines
      The following diagnosis coding guidelines must be applied to R-codes:

      ### Uncertain and Symptom Rules
      - **No Uncertain Diagnoses**: Do not code probable, suspected, possible, rule out, questionable, likely, or similar uncertain diagnoses in the outpatient setting.
      - **Highest Certainty**: Use R-codes when no confirmed diagnosis is established and documentation supports a symptom/sign/abnormal finding as the reason for care.
      - **Confirmed Over Symptoms**: If a definitive diagnosis is documented for the same clinical concept, do not use the corresponding routine/integral R-code.

      ### Symptom Specificity Rules
      - **Specific Symptom Preferred**: When multiple symptom options are available, use the most specific supported R-code.
      - **No Unsupported Inference**: Do not infer unsupported symptom details (site, laterality, acuity, chronicity).
      - **No Redundant Symptom Coding**: Do not assign overlapping R-codes when one supported code fully represents the documented symptom concept.

      ### Encounter Relevance Rules
      - **Current Encounter Only**: Use R-codes only when the symptom/finding is assessed, evaluated, monitored, or managed during the current encounter.
      - **Standalone Symptom Association**: Associate R-codes only when the A/P documents symptom-level assessment/management, or when no definitive diagnosis is established.
      - **Do Not Code History-Only Symptoms**: Do not add R-codes based on past history/problem list mentions without current encounter management.

      ## R-Code Association Guidelines
      The following association coding guidelines must be applied when linking R-codes to charges:

      - **Explicit Documentation**: Associate an R-code to a charge only when documentation explicitly supports that the symptom/finding justified or was managed as part of that service.
      - **Charge-Specific Relevance**: Associate each R-code only to charges for which symptom-level medical necessity is documented.
      - **Avoid Inferential Links**: Do not associate R-codes based on assumptions or generic context when explicit linkage is absent.
      - **Mixed Visits**: In combined preventive/problem visits, link R-codes to problem-oriented services unless documentation explicitly supports preventive linkage.


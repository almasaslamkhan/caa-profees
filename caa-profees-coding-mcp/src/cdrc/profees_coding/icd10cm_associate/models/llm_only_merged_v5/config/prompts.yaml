      - For each flagged diagnosis association, select the best valid and billable replacement diagnosis code from the provided alternatives.
      - Regenerate the diagnosis associations for each CPT/HCPCS procedure and E/M service so that flagged invalid or non-billable diagnosis codes are replaced by the most appropriate supported alternative.
      - Provide a concise justification for each linked diagnosis explaining why that diagnosis supports the medical necessity of that specific service or procedure.

      ## Primary Objective
      Your primary objective is not to recode the entire encounter from scratch. Your primary objective is to audit and correct the problematic codes by replacing them with new documentation-supported alternatives from the supplied candidate list.

      ## Task Rules
      - Use primarily the Assessment and Plan (A/P) section of the SOAP note to determine whether a replacement diagnosis is supported and whether it supports the medical necessity of a service or procedure.

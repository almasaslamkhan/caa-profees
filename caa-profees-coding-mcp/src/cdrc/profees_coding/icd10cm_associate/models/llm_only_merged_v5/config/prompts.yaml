      - **Pregnancy Supervision Z-Codes**: Associate normal pregnancy supervision, high-risk pregnancy supervision, or routine prenatal care Z-codes only when the service is a prenatal/obstetric supervision or preventive pregnancy-management encounter. Do not associate these codes to a problem-oriented non-obstetric E/M solely because pregnancy is mentioned as clinical context; link the active problem or supported pregnancy complication/manifestation code instead.
      - **Immunization Z-Codes and E/M**: Immunization encounter codes, including Z23, support vaccine administration or immunization-specific services, not a separately billed problem-oriented E/M service, unless the E/M documentation shows significant separately identifiable counseling, evaluation, or management specifically about immunization beyond routine vaccine administration.


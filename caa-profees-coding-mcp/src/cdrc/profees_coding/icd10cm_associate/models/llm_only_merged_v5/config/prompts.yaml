      ## Diagnosis Coding Guidelines
      The following are ICD-10-CM diagnosis coding guidelines which must be used when completing the diagnosis coding task:

      ### What Diagnoses to Code:
      - **Main Reason for Visit**: Include the diagnosis, condition, problem, or reason for visit that the note shows was chiefly responsible for the outpatient encounter.
      - **Other Current Conditions**: Include additional current conditions only when the note shows they required or affected care, treatment, or management during the encounter.
      - **No Resolved Conditions**: Do not code conditions that were previously treated and no longer exist, unless the note supports a relevant history or status Z-code.

      ### Uncertain and Symptom Rules:
      - **No Uncertain Diagnoses**: Do not code diagnoses documented as probable, suspected, possible, rule out, questionable, likely, or similar uncertain terms in the outpatient setting.
      - **Highest Certainty**: When no confirmed diagnosis is established, code the documented symptom, sign, abnormal finding, or other reason for the visit.
      - **Confirmed Over Symptoms**: When a confirmed diagnosis is documented, code the confirmed diagnosis instead of symptoms that are routinely associated with it.

      ### Chronic Condition Rules:
      - **Active Chronic Conditions**: Code chronic conditions when the note shows the patient is receiving treatment, follow-up, monitoring, or ongoing care for that condition during the encounter.
      - **Conditions That Affect Care**: Include coexisting conditions only when they required or affected patient care, treatment, or management during the encounter.
      - **No Medication-Only Coding**: Do not code a diagnosis solely from the presence of a medication unless the note shows the related condition is current and relevant to the encounter.

      ### Specificity Rules:
      - **Highest Specificity**: Assign the most specific ICD-10-CM code supported by the documentation, including site, laterality, acuity, chronicity, stage, device or implant type, complication type, and other required detail when documented.
      - **Specific Clinical Finding**: For swelling, fluid retention, pitting edema, or extremity edema, select the most specific supported edema or fluid-overload symptom code rather than a nonspecific musculoskeletal or soft-tissue disorder code, unless the A/P diagnoses and manages a distinct soft-tissue disorder.
      - **No Unsupported Inference**: Do not infer undocumented details or causal relationships unless they are clearly supported by the note.
      - **No Redundant Dual Coding**: Do not assign both a broader diagnosis and its component diagnoses when the note supports a single diagnosis concept rather than separately managed conditions.

      ### R-Code Diagnosis Rules:
      - **Appropriate R-Code Use**: Use symptom, sign, and abnormal finding (R-code) diagnoses only when no definitive diagnosis is established for the same concept, or when the A/P documents separate symptom-level assessment or management.
      - **No Routine or Unsupported Symptom Coding**: Do not assign R-codes for symptoms explained by a confirmed diagnosis, or for history-only, problem-list-only, overlapping, or redundant symptom concepts.
      - **Apply ICD-10-CM Tabular Guidance**: Use the most specific valid supported code and follow all applicable tabular instructions, including Chapter 18 guidance, Excludes1, Excludes2, Code First, Use Additional Code, Code Also, and other chapter or scope exclusions.

      ### R-Code Coding Guidelines:
      When a referenced scope applies, follow all listed Excludes1, Excludes2, and Includes notes exactly:

      **R00-R99**:
        - Excludes2:
          - Abnormal findings on antenatal screening of mother (O28.-)
          - Certain conditions originating in the perinatal period (P04-P96)
          - Signs and symptoms classified in the body system chapters
          - Signs and symptoms of breast (N63, N64.5)
      **R10-R19**:
        - Excludes2:
          - Congenital or infantile pylorospasm (Q40.0)
          - Gastrointestinal hemorrhage (K92.0-K92.2)
          - Intestinal obstruction (K56.-)
          - Newborn gastrointestinal hemorrhage (P54.0-P54.3)
          - Newborn intestinal obstruction (P76.-)
          - Pylorospasm (K31.3)
          - Signs and symptoms involving the urinary system (R30-R39)
          - Symptoms referable to female genital organs (N94.-)
          - Symptoms referable to male genital organs (N48-N50)
      **R20-R23**:
        - Excludes2:
          - Symptoms relating to breast (N64.4-N64.5)
      **R40-R46**:
        - Excludes2:
          - Symptoms and signs constituting part of a pattern of mental disorder (F01-F99)
      **R70-R79**:
        - Excludes2:
          - Abnormal findings on antenatal screening of mother (O28.-)
          - Abnormalities of lipids (E78.-)
          - Abnormalities of platelets and thrombocytes (D69.-)
          - Abnormalities of white blood cells classified elsewhere (D70-D72)
          - Coagulation hemorrhagic disorders (D65-D68)
          - Diagnostic abnormal findings classified elsewhere
          - Hemorrhagic and hematological disorders of newborn (P50-P61)
      **R80-R82**:
        - Excludes1:
          - Abnormal findings on antenatal screening of mother (O28.-)
          - Diagnostic abnormal findings classified elsewhere
          - Specific findings indicating disorder of amino-acid metabolism (E70-E72)
          - Specific findings indicating disorder of carbohydrate metabolism (E73-E74)
      **R83-R89**:
        - Excludes1:
          - Abnormal findings on antenatal screening of mother (O28.-)
          - Diagnostic abnormal findings classified elsewhere
        - Excludes2:
          - Abnormal findings on examination of blood, without diagnosis (R70-R79)
          - Abnormal findings on examination of urine, without diagnosis (R80-R82)
          - Abnormal tumor markers (R97.-)
      **R90-R94**:
        - Excludes1:
          - Abnormal findings on antenatal screening of mother (O28.-)
          - Diagnostic abnormal findings classified elsewhere
        - Includes:
          - Nonspecific abnormal diagnostic-imaging findings by CT/CAT, MRI/NMR, PET, thermography, ultrasound (echogram), or X-ray

      ## Association Coding Guidelines
      The following are association coding guidelines which must be used when completing the association coding task:

      ### Documentation Standards Rules:
      - **Explicit Documentation**: Only associate a diagnosis to a procedure or E/M service if the A/P explicitly and unambiguously links the diagnosis to the service; association must be explicitly documented in the A/P.
      - **Avoid Inferential Coding**: Do not associate a diagnosis if documentation is ambiguous, or relies on clinical assumptions, typical relationships, or unlinked contextual information.
      - **Current Encounter Association**: Only associate a diagnosis to a charge if documentation demonstrates that the diagnosis was assessed, managed, or followed up during the current encounter.

      ### Chronic and Complex Condition Association Rules:
      - **Chronic/Complex Diagnosis Association**: Only associate a chronic, serious, or complex diagnosis with an E/M or procedure charge if the A/P documents evaluation, management, therapy review/titration, or risk stratification of that condition during the encounter.
      - **G2211 Diagnosis Association**: Associate a diagnosis to G2211 if the A/P documents that the diagnosis is a substantive driver of ongoing longitudinal care, including evidence of active management, goal setting, or care coordination (e.g., HIV, sickle cell, glaucoma, cirrhosis).
      - **Sufficient Documentation**: Terms like “stable,” “continue therapy,” or “routine follow-up” in the A/P are generally sufficient to associate a chronic diagnosis with E/M or related charges, as long as active management is evident.

      ### Labs, Diagnostics, and Procedure Association Rules:
      - **Lab/Procedure Association**: Only associate diagnoses to a lab procedure if the A/P or order narrative specifically states those diagnoses as the clinical justification for the test or procedure.
      - **Multiple Diagnosis Order Association**: For tests or procedures ordered for multiple relevant diagnoses, associate all explicitly documented diagnoses as indications.
      - **Encounter-Specific Diagnosis Association**: Only associate diagnoses to procedures that were performed and documented at the facility or location during the current encounter. Do not associate historical or offsite procedures.

      ### Specificity, Combination, and Symptom Association Rules:
      - **Specific Diagnosis Association**: Always code to the highest level of specificity that the physician's documentation supports. If both specific and non-specific diagnoses are documented, link only the most specific diagnosis to the service, unless the A/P documents separate management of subtypes or variants.
      - **Combination Diagnosis Association**: Associate both a combination diagnosis code and its individual components only if the A/P documents distinct management of each; otherwise, associate only the combination code.
      - **Standalone Symptom Diagnosis**: Associate a symptom diagnosis only when the A/P documents assessment or management of the symptom itself and no definitive diagnosis has been established. If a definitive diagnosis is documented, associate only the definitive diagnosis.

      ### R-Code and Symptom Association Rules:
      - **Standalone Symptom Association**: Only associate a symptom, sign, or abnormal finding diagnosis when the A/P documents assessment, monitoring, evaluation, or management of that symptom or finding during the current encounter and no definitive diagnosis has been established for the same concept.
      - **No Routine Symptom Association**: Do not associate a symptom diagnosis when a confirmed diagnosis explains the symptom and the symptom is not separately addressed, and do not associate history-only, inactive, problem-list-only, overlapping, or redundant symptom diagnoses.
      - **Specific Supported Symptom Association**: Associate only the most specific supported symptom diagnosis that is relevant to the service or procedure and clearly supported by current encounter documentation.

      Your output must reflect accurate ICD-10-CM code identification and association, where all decisions made are supported by documentation and medical coding best practises. Accuracy is your highest priority.

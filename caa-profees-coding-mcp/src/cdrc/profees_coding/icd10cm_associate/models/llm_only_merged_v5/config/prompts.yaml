      - **Service-Level Support Required**: A candidate replacement must support the medical necessity of the specific CPT/HCPCS or E/M code to which it is linked.

      ### Specificity and Billability Rules:
      - **Highest Supported Specificity**: If multiple alternative diagnosis codes are valid and billable, choose the most specific code supported by the documentation, including site, laterality, acuity, chronicity, stage, and other required detail when documented.
      - **No Unsupported Specificity**: Do not select a more specific diagnosis code unless the note explicitly supports that level of detail.


      - Each linked diagnosis should have a corresponding justification for why that ICD-10-CM code supports the medical necessity of that specific service or procedure.
      - Exclude any ICD-10-CM codes that are unsupported by documentation or unrelated to the documented service or procedure code, in some cases a service may have no valid associated diagnoses.

      ## Task Rules
      - To find information about diagnoses and associations use primarily the Assessment and Plan (A/P) section of the SOAP note.
      - Each ICD-10-CM diagnosis code may be linked to multiple services when supported by documentation, and each service or procedure code must be associated with at least one supported diagnosis code when a supported diagnosis exists.
      - Ensure the identified diagnoses and associations are consistent with ICD-10-CM and CPT/HCPCS guidelines, including documentation linkage, specificity, and medical necessity.
      - The justification must be clear, concise, and free from leading statements, to ensure that coding decisions are based solely on documented evidence rather than assumptions or interpretations.
      - Ensure that each CPT/HCPCS or E/M code in your output exactly matches the CPT/HCPCS or E/M code provided in the input, do not introduce, modify, or omit any codes.
      - Ensure the output strictly follows the output schema and returns a well-formed json object. Malformed json objects and missing fields are unacceptable.

      ## Diagnosis Coding Guidelines
      The following are ICD-10-CM diagnosis coding guidelines which must be used when completing the diagnosis coding task:

      ### What Diagnoses to Code:
      - **Main Reason for Visit**: Include the diagnosis, condition, problem, or reason for visit that the note shows was chiefly responsible for the outpatient encounter.
      - **Other Current Conditions**: Include additional current conditions only when the note shows they required or affected care, treatment, or management during the encounter.
      - **No Resolved Conditions**: Do not code conditions that were previously treated, described as resolved, remote, or no longer active unless the note supports a relevant history/status Z-code or documents current active evaluation, treatment, or management of the condition. Do not convert a resolved or historical condition into a current active diagnosis code merely because it is mentioned in follow-up or background discussion.

      ### Uncertain and Symptom Rules:
      - **No Uncertain Diagnoses**: Do not code or associate definitive diagnoses documented as probable, suspected, possible, rule out, questionable, likely, or similar uncertain terms in the outpatient setting, even if treatment is recommended. Code and associate the documented symptom, sign, status/history code, or reason for care instead, unless the definitive diagnosis, etiology, site, and laterality are clearly established elsewhere in the note.
      - **Working Diagnoses**: When the A/P documents a condition as a leading working diagnosis being actively evaluated or managed during the encounter, such as through testing, treatment instructions, counseling, or follow-up, code and associate the working diagnosis when supported by documented findings. Do not omit it merely because another differential diagnosis is also mentioned; continue to avoid coding diagnoses described only as possible/suspected without active evaluation or management.
      - **Highest Certainty**: When no confirmed diagnosis is established, code the documented symptom, sign, abnormal finding, or other reason for the visit.
      - **Confirmed Over Symptoms**: When a confirmed diagnosis is documented, code the confirmed diagnosis instead of symptoms that are routinely associated with it.

      ### Chronic Condition Rules:
      - **Active Chronic Conditions**: Code chronic conditions when the note shows the patient is receiving treatment, follow-up, monitoring, or ongoing care for that condition during the encounter.
      - **Conditions That Affect Care**: Include coexisting conditions only when they required or affected patient care, treatment, or management during the encounter.
      - **No Medication-Only Coding**: Do not code a diagnosis solely from the presence of a medication unless the note shows the related condition is current and relevant to the encounter.
      - **Provider-Documented Weight Diagnosis Required**: Do not assign overweight, obesity, or other weight-status diagnosis codes solely from BMI, weight, or patient concern. Use a weight-status diagnosis only when the clinician explicitly documents the condition as a diagnosis or assessment; when diet, exercise, or weight-management counseling is documented without a clinician-diagnosed weight condition, consider an appropriate counseling Z-code if supported.

      ### Specificity Rules:
      - **Highest Specificity**: Assign the most specific ICD-10-CM code supported by the documentation, including site, laterality, acuity, chronicity, stage, severity, subtype, manifestations, encounter type, and other required detail when documented. Do not select an unspecified, NOS, other, or broader code when the note supports a more specific code for the same diagnosis concept, symptom/sign family, abnormal finding, screening modality, medication-status category, or anatomic subsite.
      - **Use Full Encounter Specificity**: When the A/P manages a condition and other encounter documentation supplies supported specificity for that same condition, such as type, chronicity, stage, laterality, device/status, objective results, or synonymous clinical terminology, use the most specific supported current diagnosis code rather than an unspecified code. Do not use other documentation to create a new unsupported diagnosis.
      - **Required Qualifiers**: When an injury or other diagnosis code requires a qualifier such as loss-of-consciousness status, encounter type, laterality, or other detail, do not infer a qualifier that is not documented. If ICD-10-CM provides an unknown or unspecified-status option and the condition is documented and managed, use that supported option rather than omitting the condition or inferring a more specific qualifier.
      - **Chronicity and Historical Conditions**: Do not assign a chronic-condition code unless the documentation explicitly describes chronicity, longstanding/recurrent disease, or ICD-10-CM directs chronic coding. Do not assign an acute condition code for a condition documented only as remote, resolved, historical, status post, medication-managed after a prior event, or no longer present; use a supported history, status, long-term medication, sequela, or follow-up code when relevant to current care.
      - **No Unsupported Inference**: Do not infer undocumented details, causal relationships, disease etiologies, or combination diagnoses unless clearly supported by the note. Do not convert a documented symptom, symptom complex, medication-treated complaint, or separate findings into a more specific underlying disease or causal/combination diagnosis unless that disease or relationship is explicitly documented.
      - **Excludes and Subtype Conflicts**: Observe ICD-10-CM Excludes notes and subtype distinctions. When documentation identifies a condition subtype, morphology, histology, “with/without” manifestation, or anatomic subsite that is excluded from or more specific than a nonspecific code, assign the appropriate specific code if supported and do not also code the conflicting nonspecific code.
      - **No Redundant Dual Coding**: Do not assign both a broader diagnosis and its component, overlapping, alternative, or less-specific diagnosis when the note supports a single diagnosis concept rather than separately managed conditions. Code both only when the A/P documents distinct assessment or management of separate diagnosis concepts.

      ### Z-Code Rules:
      - **Supported Z-Codes Only**: Assign history, status, screening, counseling, follow-up, aftercare, preventive, measurement, noncompliance, immunization, device/status, or medication-use Z-codes only when the note clearly supports their use for the encounter.
      - **Current Over History**: If a condition is current and actively addressed, code the current diagnosis rather than a history code. If the note documents only a prior/history condition and current evaluation shows the condition is absent, resolved, normal, or no longer active, do not code the current disease code; use a supported personal history, status, sequela, or long-term medication Z-code when that history/status affected evaluation, testing, counseling, risk assessment, or management during the encounter.
      - **True Screening Only**: Use a screening Z-code only when the service is performed in the absence of signs, symptoms, abnormal findings, or a confirmed diagnosis. If testing is ordered because symptoms, abnormal findings, or an active condition are documented, code and associate the symptom, abnormal finding, or confirmed condition instead of the screening Z-code, even if the note labels the order as screening.
      - **Specific Screening and Gynecologic Screening**: For screening Z-codes, select the most specific code supported by the documented modality, site, or purpose. For cervical cancer screening/Pap testing documented as part of a routine general gynecological examination, use the routine gynecological examination Z01.4- code rather than a separate cervical cancer screening Z12.4 code, unless the note documents a separately reportable screening encounter outside the general gynecologic exam.
      - **Long-Term Drug Therapy Z-Codes**: Code long-term/current medication therapy Z-codes when the A/P documents current ongoing use, continuation, adjustment, review, monitoring, risk discussion, side effects, lab surveillance, or management of a medication class for an actively managed condition. Include applicable class-specific Z79 codes when supported by ICD-10-CM guidance, such as anticoagulants, antiplatelets, insulin, oral or injectable non-insulin antidiabetic agents, steroids, immunomodulators/immunosuppressants, opioids, or other high-risk/guideline-directed long-term therapies. Do not code them from the medication list alone.
      - **Counseling Z-Codes**: Assign counseling Z-codes when the A/P documents substantive counseling, advice, surveillance, or risk-reduction counseling, including diet, nutrition, exercise, tobacco cessation, family planning, contraception, safety, developmental, vaccine, or other age/risk-appropriate counseling, whether performed as preventive care or problem-oriented management.
      - **Administrative and Contextual Z-Codes**: Administrative or contextual Z-codes, such as establishing care, general health-service contact, generic health status, or other encounter-circumstance codes, should not substitute for more specific current conditions, preventive exam, screening, aftercare, status, or history codes. Use them only when they are the primary documented reason for the service and no more specific supported diagnosis better explains the service.
      - **Substance and Tobacco Documentation**: Do not use nonspecific health-status Z-codes as substitutes for documented current alcohol, tobacco, drug, or similar use. Use nicotine dependence or substance use disorder codes only when dependence, addiction, use disorder, misuse, abuse, or dependence is documented; when current tobacco, alcohol, or other use is assessed, counseled, or affects care without dependence, use the appropriate use code when supported.

      ## Association Coding Guidelines
      The following are association coding guidelines which must be used when completing the association coding task:

      ### Documentation Standards Rules:
      - **Explicit Documentation**: Only associate a diagnosis to a procedure or E/M service if documentation explicitly and unambiguously supports that the diagnosis is relevant to the service. Do not associate a confirmed diagnosis code when the A/P documents the condition as possible, suspected, rule-out, questionable, or otherwise uncertain in the outpatient setting; link only the documented symptom, status/history code, medication-use code, or other confirmed reason for management when supported.
      - **Avoid Inferential Coding**: Do not associate a diagnosis if documentation is ambiguous, or relies on clinical assumptions, typical relationships, or unlinked contextual information.
      - **Current Encounter Association**: Only associate a diagnosis to a charge if documentation demonstrates that the diagnosis, history/status condition, risk factor, symptom, abnormal finding, or medication/status issue was assessed, managed, monitored, counseled on, treated, ordered for, used in medical decision-making, or followed up during the current encounter. A diagnosis listed only in an assessment header, problem list, charge/order diagnosis list, or grouped diagnosis list is not sufficient unless the plan includes diagnosis-specific evaluation, management, testing, treatment, surveillance, medication/risk assessment, counseling, referral, or follow-up.
      - **Problem-Oriented E/M Associations**: For problem-oriented E/M services, associate all diagnoses in the A/P that are actively assessed, treated, monitored, referred, tested, counseled on, or managed during the encounter, including minor problems requiring reassurance/observation, medication continuation/refill, preventive therapy for chronic or recurrent conditions, abnormal findings driving workup, or comorbidities that affect medication selection, risk, contraindications, or management. Do not limit E/M associations only to the chief complaint or to diagnoses listed on the E/M order line.
      - **History/Status Association**: History or status diagnoses may support an E/M service when the A/P documents that the prior condition or status directly affected current evaluation, testing, counseling, surveillance planning, risk-benefit discussion, follow-up interval decisions, deferral of testing, care planning, or management. When current disease is absent or ruled out, associate the relevant history/status code instead of the current disease code if the history/status was addressed.
      - **Remote or Historical Acute Events**: Do not associate an acute diagnosis code to an E/M, G2211, or procedure when the note describes the event as prior, old, remote, status post, resolved, or historical context only. Associate the current condition, sequela/status/history code, long-term therapy code, or actively managed chronic disease instead when supported by the A/P.
      - **External Cause and Circumstance Codes**: External cause, place, activity, and external cause status codes may be associated as supplementary diagnoses to an E/M or injury-related service when the current encounter documents evaluation or management of the injury and the circumstance/status is clearly documented. These codes supplement, not replace, the primary injury diagnosis.

      ### Chronic and Complex Condition Association Rules:
      - **Chronic/Complex Diagnosis Association**: Only associate a chronic, serious, or complex diagnosis with an E/M or procedure charge if the A/P documents evaluation, management, therapy review/titration, risk stratification, condition-specific monitoring such as ordered labs/tests, surveillance, continuation of an established treatment plan, specialist-managed treatment review, directed follow-up, or patient-specific management advice during the encounter.
      - **Sufficient Documentation**: Terms such as “stable,” “improved,” “doing better,” “continue therapy,” “monitor,” “follow,” “routine follow-up,” medication regimen review/adjustment, or symptom monitoring in the A/P are generally sufficient to associate a chronic or ongoing condition, including mental/behavioral health conditions, with a problem-oriented E/M charge when they show current assessment, monitoring, or management.
      - **Long-Term Medication Status Association**: Associate long-term current drug therapy/status Z-codes with a problem-oriented E/M service when the A/P explicitly continues, starts, changes, refills, reviews, monitors, risk-manages, or orders safety/therapeutic surveillance for that ongoing therapy and the medication contributes to treatment management, medical decision-making, or risk. Use these codes as secondary supporting diagnoses with the treated condition when supported; do not associate them from the medication list alone or substitute a substance use disorder code unless a disorder is documented.
      - **Device/Status Z-Code Association for Active Management**: Associate current dependence/status Z-codes, such as implanted devices, oxygen dependence, amputation status, contraceptive device status, or other enabling/status conditions, with an E/M service when the A/P documents active continuation, monitoring, interrogation/review, counseling, care coordination, functional management, complication monitoring, or management of the device/status as part of current care.
      - **BMI and Weight-Related Z-Code Association**: Do not associate BMI or other measurement-only Z-codes with an E/M service solely because the value is recorded in vitals or listed in the A/P. Associate a BMI Z-code only when obesity/overweight/BMI is assessed or managed, or BMI is clearly linked to counseling, treatment, risk assessment, or medical decision-making for that service. If diet/exercise counseling is documented for another condition, link the counseling to that condition rather than to BMI unless BMI/weight management is separately addressed.
      - **G2211 Diagnosis Association**: Associate diagnoses, supported symptom complexes, history/status Z-codes, directly managed medication/status codes, and psychosocial determinants to G2211 only when the A/P documents that they are substantive drivers of ongoing longitudinal or comprehensive care by the billing clinician or primary care clinician, including active management, monitoring, medication/device oversight, medication adjustment/titration, goal setting, risk stratification, risk-factor management, treatment planning, follow-up over time, referral decisions, or care coordination. This may include common chronic cardiometabolic, behavioral, mental health, recurrent, symptomatic, medication-managed, device/status, aftercare/follow-up, or serious/complex conditions when they materially contribute to longitudinal care complexity; do not limit G2211 to one dominant or traditionally severe diagnosis if multiple documented conditions substantively contribute.

        - If a CPT/HCPCS line is **not an anesthesia base CPT code**, it is **not eligible** for P1–P6.
        - For any **non-eligible** code: return **`[]`** for that code (see Output Rules).

        > Note: Even if anesthesia-related, ancillary/non-base lines (E/M, supplies, meds, labs, imaging, etc.) are not eligible.

        # Pre-processing: Extract Documentation (Quote-grounded)
        From the SOAP note and any anesthesia-related documentation within it, extract and track:
        - **Explicit ASA/Physical Status statements** (e.g., “ASA II”, “ASA 5”, “ASA VI”, “PS 2”, “Physical Status III”, “ASA 3E”).
        - **Comorbidities** (acute/chronic).
        - **Severity, stability, trajectory** (well-controlled vs decompensated; acute exacerbation).
        - **Functional limitation** (exercise tolerance, ADLs, dyspnea on exertion, etc.).
        - **Evidence of constant threat to life** at time of anesthesia.
        - **Moribund / survival unlikely without surgery** language.
        - **Brain death + organ procurement** documentation.

        For each extracted element, capture a **short direct quote** as evidence. If not present, record **“Not documented”**.

        If documentation is present but ambiguous, record **“Unclear”** (and treat as insufficient to assign a modifier).

        # Decision Procedure (Follow in Order, Per CPT Code)

        ## Step 0 — Eligibility (Required)
        - If the code is **not an anesthesia base CPT code** → **no modifier**; output `[]` for that code.

        ## Step 1 — ASA Source Hierarchy (Use highest-priority explicit statement)
        Prefer an **explicit** ASA/Physical Status statement when available. Use this source priority (highest → lowest) for the **date of service**:
        1) Anesthesia record/worksheet/anesthesia post-evaluation documenting ASA/Physical Status
        2) Pre-anesthesia evaluation / anesthesia pre-op assessment documenting ASA/Physical Status
        3) Other peri-anesthesia documentation (intra-op/PACU anesthesia notes) documenting ASA/Physical Status
        4) Non-anesthesia notes (surgeon clinic notes, H&P, problem list) that mention ASA/Physical Status

        ### Conflict rule
        - If an explicit ASA/Physical Status exists in a **higher-priority** source, follow it even if lower-priority sources differ.
        - Mark ASA as **Unclear** (and assign no modifier) **only if** there are **multiple explicit, conflicting** ASA/Physical Status statements **within the same highest-priority source** for the same date of service.

        ## Step 2 — If no usable explicit ASA: infer only when clearly supported
        If no explicit, usable ASA status is found:
        - You may infer a level **only** when the clinical documentation clearly supports it.
        - If support is not clear → **assign no modifier**.

        ## Step 3 — Severity Ladder (Assign at most one)
        Evaluate in ascending order and assign the **single highest level fully supported**:
        P1 → P2 → P3 → P4 → P5 → P6

        ### Reconciliation guardrails
        - Do **not** assign **P1** if **any** systemic disease/risk factor is documented, unless **ASA I** is explicitly documented in the highest-priority anesthesia source.
        - **Never** infer P4–P6 without explicit high-acuity language consistent with the definitions below.

        # ASA Modifier Criteria (Apply exactly)

        ## P1 — Normal healthy patient
        Assign only if:
        - **ASA I** is explicitly documented, OR documentation clearly establishes **no systemic disease** and no chronic conditions/physiologic impairment.

        ## P2 — Mild systemic disease
        Assign only if:
        - **ASA II** is documented, OR mild/well-controlled systemic disease **without functional limitation**.

        ## P3 — Severe systemic disease
        Assign only if:
        - **ASA III** is documented, OR severe systemic disease **with functional limitation**, but **not** a constant threat to life.

        ## P4 — Severe systemic disease that is a constant threat to life
        Assign only if:
        - **ASA IV** is documented, OR documentation clearly indicates **life-threatening instability** and that the threat is present **at time of anesthesia**.

        ## P5 — Moribund patient not expected to survive without the operation
        Assign only if:
        - **ASA V** is documented, OR documentation clearly states the patient is **moribund** and **survival is unlikely without immediate surgery**.

        Hard stop: Critical illness alone ≠ P5.

        ## P6 — Declared brain-dead patient whose organs are being removed for donor purposes
        Assign only if:
        - **ASA VI** is documented AND
        - **Brain death is declared** AND
        - Anesthesia is for **organ procurement**.

        Hard stop: coma/vegetative state ≠ P6.

        # Output Rules (JSON only)
        - Return output exactly per: **{{format_instructions}}**.
        - For each CPT code:
        - If **not eligible** → output **`[]`** for that code.
        - If eligible:
            - Provide a structured decision for **P1–P6**, each containing:
            - `assigned`: true/false
            - `justification`: concise, compliance-oriented rationale
            - `evidence`: short direct quote(s) from the note, or “Not documented”, or “Unclear”
            - Ensure **zero or one** modifier is `assigned: true`.
        - If no modifier is supported for an eligible code, all `assigned` fields must be false (do **not** guess).
        - Output **ONLY** valid JSON. No extra commentary.

        # Self-check (Do silently before final JSON)
        Verify:
        - Eligibility applied per code
        - At most one modifier assigned per eligible anesthesia base code
        - No invented facts/quotes
        - Any ambiguity/conflict resulted in no assignment



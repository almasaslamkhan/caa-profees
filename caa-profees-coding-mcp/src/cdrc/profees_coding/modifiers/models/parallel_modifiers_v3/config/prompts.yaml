        {% if orders %}- **Orders**:
        {{orders}}
        {% endif %}
        {% if additional_info %}- **Additional Info**:
        {{additional_info}}
        {% endif %}

        # Scope (Fixed)
        - Evaluate **only** Modifier **GY**.
        - **Do not assign, suggest, or discuss any other modifiers** (e.g., 25, GA, GZ). If other modifiers appear in the text, treat them as irrelevant context.

        # Core Definition (Non‑negotiable)
        Assign **GY** only when the billed line item is:
        - **Statutorily excluded from Medicare**, OR
        - **Outside all Medicare benefit categories** (i.e., *never* a Medicare benefit under any Part)

        Do **NOT** use GY for:
        - Medical necessity / “not reasonable and necessary”
        - Failure to meet coverage conditions (diagnosis, setting, provider type, documentation)
        - Frequency limits
        - Bundling/incidental/non-separately payable services
        - “Wrong Medicare Part” routing issues (Part B vs Part D)

        **Key test:** If Medicare covers the service **under any circumstance or any Medicare Part**, it is a Medicare benefit → **GY = NO**.

        # Evidence & Grounding Rules
        - Base decisions only on the provided inputs (SOAP/Orders/additional_info) and the explicit guardrails in this prompt.
        - Do **not** guess statutory exclusion from visit type, patient age, or general real-world coverage assumptions, **except** where this prompt explicitly designates a code/category as “never a Medicare benefit” (see Watchlist).
        - If documentation is missing, vague, or conflicting: mark the relevant premise as **Unclear** and default to **NOT assigning GY**.

        # Required Internal Extraction (Use for decisioning; do not add extra output fields)
        For your own decision-making per code, identify:
        1) **Decision Payer**
        - If payer explicitly stated and not Medicare → use that payer.
        - Otherwise default Decision Payer = **Medicare**.
        2) **Performed vs ordered** on the DOS (performed/provided vs only planned/ordered).
        3) Any explicit **noncoverage/statutory denial intent** language (e.g., “noncovered,” “statutorily excluded,” “bill patient,” “GY”).
        4) Short supporting quotes when available.

        # Decision Policy (Per Code)
        Evaluate each CPT/HCPCS code independently.

        Set `assigned: true` only if **all** are satisfied:
        1) **Decision Payer is Medicare** (either explicitly stated OR applied by default because payer is not explicitly non-Medicare), AND
        2) The billed line represents a service/item that is **clearly never a Medicare benefit** (statutory exclusion / outside benefit categories), as supported by:
        - clear documentation in the provided inputs, **and/or**
        - an explicit “never a Medicare benefit” category listed in this prompt (Watchlist / Guardrails), AND
        3) The line is **actually being billed as a non-benefit** (i.e., it was performed/provided or otherwise represents the billed encounter line).

        **Denial-intent wording:** If explicit “deny as noncovered/statutorily excluded/bill patient/GY” language is present, treat it as strong supporting evidence. If (1) and (2) are clearly met (e.g., a Watchlist code in a Medicare context), absence of explicit denial-intent wording should **not** by itself prevent assigning GY.

        **Failsafe:** If there is any uncertainty whether the service could be covered by Medicare under any circumstance/Part, default to `assigned: false`.

        # High-Frequency Guardrails / Watchlist
        ## A) CPT Preventive Medicine E/M (99381–99397)
        - When **Decision Payer = Medicare**, treat **99381–99397** as routine preventive physical exams (not AWV) → **ASSIGN GY** to the 99381–99397 line.
        - If AWV codes (G0438/G0439/G0402) are also billed: **do NOT** assign GY to the AWV line; apply GY (if applicable) only to 99381–99397.

        ## B) Medicare Preventive Benefits (not GY)
        Preventive services that are Medicare benefits by definition → **DO NOT** assign GY (denials for frequency/setting/provider rules are not statutory):
        - G0444, G0438, G0439, G0402
        - Screening tests that have Medicare coverage criteria

        ## C) Vaccines / Immunization Administration
        - In general, vaccine products and administration (e.g., 90471–90474) are Medicare benefits under specific Parts/conditions → **DO NOT** assign GY for “wrong Part” or typical preventive classification.
        - **ASSIGN GY only if** the provided inputs affirmatively indicate the immunization is **outside Medicare benefit categories** (e.g., travel/occupational/school/convenience) or explicitly state noncoverage/statutory exclusion for that vaccine line.

        ## D) Specimen Handling / Lab Support (payment policy ≠ statutory exclusion)
        - Codes like **99000/99001** are not statutorily excluded; they may be bundled/incidental → **DO NOT** assign GY solely due to non-separate payment.

        ## E) Orthoses / Braces (L-codes)
        - Orthoses are Medicare DMEPOS benefit items when used to treat illness/injury → **DO NOT** assign GY solely due to off-the-shelf status, clinic dispense, or supplier issues.
        - **ASSIGN GY only if** documentation clearly supports comfort/convenience/preventive use with no illness/injury/functional impairment.

        ### E1) L3260 (Surgical/Post-op Shoe) specific check
        - **DO NOT assign GY** when used for acute injury or post-surgical immobilization/protection/stabilization.
        - **ASSIGN GY** when documentation supports comfort-only/footwear-replacement/convenience, or skin/wound protection without need for immobilization.
        - If unclear → default **NOT GY**.

        ## F) Surgical Dressings Benefit
        - If there is a documented qualifying wound (surgical, debrided, stage II–IV pressure ulcer, venous/arterial/diabetic ulcer, traumatic wound, burn) → dressings are within a benefit category → **DO NOT** assign GY (even if quantity/frequency/LCD/payment rules may cause denial).
        - **ASSIGN GY only if** documentation indicates **no wound** and dressing/padding is for comfort/hygiene/prophylactic protection of intact skin.

        ## G) A-codes (Supplies)
        - If linked to treatment of a documented illness/injury/qualifying wound/DMEPOS medical use → within a benefit category → **DO NOT** assign GY (even if billing/payment rules may deny).
        - **ASSIGN GY only if** clearly for comfort, convenience, hygiene/personal care, general skin protection without injury/wound, or non-medical use.

        # Output Requirements
        - You must return a decision for **each** code.
        - Provide concise, human-friendly justifications with no filler.
        - Evidence must be either:
        - a **≤25-word** direct quote from the provided inputs, or
        - `null` if no good quote exists.
        - Do not include HTML or formatting artifacts (e.g., `<br>`).

        # Output Format (Required)
        Return **ONLY valid JSON** exactly in this shape (no extra keys, no surrounding text):

        [
        {
            "code": "string",
            "assigned": true,
            "justification": "brief reason tied to statutory exclusion or non-benefit status",
            "evidence": "≤25-word quote" 
        }
        ]

        If no relevant quote exists, set `"evidence": null`.

        {{ format_instructions }}

        # Final Compliance Note
        If `format_instructions` conflicts with the required JSON shape above, ignore the conflicting parts and follow the required JSON shape above.


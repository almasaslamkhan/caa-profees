        - Output must be **JSON only** and must follow **exactly**: {{format_instructions}}
        - Do **not** add extra top-level keys beyond the schema.
        - For each CPT code, keep `modifiers` as an array; include GO with `assigned: true/false` (even if false) as required by the schema.
        - Keep language clear and concise. **No HTML** and no stray characters (e.g., no `<br>`).

        # Quality Check (Before returning JSON)
        - Confirm you evaluated GO for **every** provided CPT/HCPCS code.
        - Confirm any GO=true has OT encounter context support and no hard disqualifier.
        - Confirm uncertainties are marked **Unclear/Not observable** rather than guessed.

        Return only the JSON per {{format_instructions}} with no extra text.


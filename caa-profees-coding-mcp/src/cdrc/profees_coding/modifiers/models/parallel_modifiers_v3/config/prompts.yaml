        # CPT Modifier Guidelines
        ## Modifier GN (Services Delivered Under an Outpatient Speech-Language Pathology Plan of Care):

        **Definition**: Modifier GN is appended to CPT/HCPCS codes to indicate that the service was delivered under an outpatient speech-language pathology (SLP) plan of care. It is required by Medicare and many commercial payers when billing speech-language pathology services provided by a speech-language pathologist (SLP) or qualified personnel under an SLP plan of care.

        Modifier GN does NOT change the CPT code description. It identifies the service as speech-language pathology and subjects it to therapy billing rules, including therapy threshold tracking, documentation standards, supervision requirements, and plan-of-care certification requirements.

        **Operational evidence standard for this task (to reduce false negatives):**
        - If the billed CPT is an SLP service (e.g., swallowing/MBSS SLP assessment or SLP treatment) AND the documentation/metadata indicates outpatient SLP involvement (e.g., provider credential “SLP”, department “Speech Therapy”, note type “Speech/Swallow eval/therapy”, or similar), then GN is generally required.

        # CPT Modifier Guidelines
        ## Modifier UD (Medicaid Level of Care / State-Defined Modifier):

        **Definition**: Modifier UD is a state Medicaid–defined modifier used to identify a specific level of care, benefit category, program designation, or reimbursement classification as determined by the individual state Medicaid agency.

        Modifier UD does NOT have a universal CPT-defined meaning. Its definition and payment impact vary by state Medicaid program. It is most commonly used to designate:

        # CPT Modifier Guidelines
        ## Modifier PN (Non-Excepted Off-Campus Outpatient Department Service):

        **Definition**: Modifier PN indicates that services were furnished in an **off-campus, provider-based department of a hospital** that is **non-excepted** under Section 603 of the Bipartisan Budget Act of 2015. These departments were established or began billing under OPPS **after November 1, 2015**, and are generally paid under the **Physician Fee Schedule (PFS)-equivalent rate** rather than full OPPS.

        **How to assign this modifier**:
        Modifier PN is appended to **facility outpatient service codes** when ALL of the following are true:
        1) The service is billed by a **hospital outpatient department (facility claim)**, AND
        2) The service occurred at an **off-campus, provider-based department**, AND
        3) That department qualifies as **non-excepted** (established or first billing under OPPS after **11/01/2015**), AND
        4) The payer requires PO/PN differentiation (e.g., Medicare OPPS).

        **Key points**:
        - PN applies to **facility billing only** (UB-04 / institutional claims).
        - PN does **NOT** apply to professional (physician/QHP) claims.
        - PN and **PO are mutually exclusive**—only one may be reported.
        - Clinical documentation will **never** state “non-excepted.”
        - Assignment must rely on **administrative/location metadata**, not SOAP note content.
        - For this task, when the dataset’s labeling applies PN, it may appear on eligible **facility outpatient lines** present in the CPT list (e.g., outpatient clinic/facility visit lines such as **G0463**, and other facility outpatient services). Do not exclude a line item solely because it is “visit/E/M-related” if the encounter context is facility off-campus non-excepted per the rules below.

        **Payment Impact (Medicare)**:
        - Non-excepted off-campus departments are generally reimbursed at a reduced rate
        (PFS-equivalent payment under Section 603 rules).
        - The professional claim is unaffected by PN designation.


        # Compliance Checks
        - **Modifier PN (Non-excepted off-campus HOPD):**
        - Apply PN ONLY when:
            a) The claim is a **facility outpatient claim**; AND
            b) The location of service is an **off-campus hospital-based department**; AND
            c) The department is designated as **non-excepted** (established > 11/01/2015); AND
            d) The service is eligible for OPPS/PFS-equivalent outpatient payment.
        - For this task, treat the following as **authoritative signals** (use the best available from the input and quote it):
            - Facility claim indicators (e.g., UB-04/institutional, hospital outpatient, HOPD, revenue-center language) vs professional (e.g., CMS-1500, physician/QHP billing).
            - Location indicators showing off-campus provider-based outpatient department (e.g., “off-campus,” “provider-based,” “HOPD/outpatient department,” “hospital-owned clinic,” specific off-campus department names).
            - Excepted vs non-excepted indicators if present (e.g., “PO,” “excepted,” “PN,” “603,” “non-excepted”).
        - TASK-SPECIFIC INFERENCE (to match dataset labeling when explicit non-excepted status is not documented):
            - If structured metadata indicates **facility outpatient + off-campus provider-based department**, and there is **no indication** of **excepted/PO**, on-campus, independent office (POS 11), or professional claim, then **assign PN**.
        - HARD DISQUALIFIERS (if any are true, DO NOT append PN):
            - Professional claim (CMS-1500 / physician billing).

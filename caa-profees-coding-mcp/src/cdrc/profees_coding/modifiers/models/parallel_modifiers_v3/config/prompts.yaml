        - Do deny GN when there is explicit contradictory evidence (e.g., inpatient Part A bundled stay, physician-only/radiology-only service with no SLP involvement, explicit statement “not under therapy plan of care”, canceled/not performed).

        **When to Use Modifier GN**:
        - Append GN to all outpatient speech-language pathology services delivered under an SLP plan of care.
        - Applies to services provided by:
        - A licensed speech-language pathologist (SLP)
        - Qualified speech-language pathology personnel under appropriate supervision (when allowed)
        - Applies to both evaluation and treatment CPT codes furnished under an SLP plan of care.

        **Common CPT Codes Requiring GN When Under SLP Plan of Care**:
        - Speech-language evaluation: 92521, 92522, 92523, 92524
        - Treatment of speech, language, voice, communication, and/or auditory processing disorder: 92507
        - Cognitive treatment: 97129, 97130
        - Voice prosthetic training: 92597
        - Evaluation of swallowing function: 92610

        - DIAGNOSTIC-ONLY SCENARIOS (Local Policy Override):
            - Default: Do NOT append 25 when the only other services besides the E/M are diagnostic tests (e.g., EKG/ECG 93000/93005/93010, echo 93306/93308, imaging, labs) or specimen collection (36415/99000) AND they are only ordered/scheduled or performed by another department/technologist.
            - If a diagnostic test is clearly performed on the DOS by the same billing clinician/clinic and is separately billable with documented completion and (when applicable) interpretation/report, it may qualify as the “other service” for 25 evaluation.
            - Local override permitted ONLY if the SOAP/Orders explicitly name the payer and cite a written payer policy that requires modifier 25 with E/M + diagnostic-only services on the same DOS. In such cases, append 25 per that cited policy and include the payer/policy name in your rationale. Absent explicit citation, default to no 25.
        - RULE FOR PREVENTIVE E/M:
            - If a preventive E/M (99381–99397 or Medicare AWV G0438/G0439) is present with an immunization administration (e.g., 90471–90474 or G0008) on the same DOS, AND the documentation includes active, problem-oriented management of at least one chronic or acute condition that would independently support a problem-oriented E/M (e.g., medication change/titration, new or refill prescriptions with risk/benefit discussion, diagnostic/lab orders for disease monitoring, documented home monitoring plan, targeted evaluation with assessment and referral), THEN append modifier 25 to the preventive/AWV E/M when no separate 9920X/9921X is billed and payer policy permits. Do not let the presence of venipuncture (36415) alone negate this decision when immunization administration is also present.
        - Hard disqualifiers (if any are true, DO NOT append 25):
            - The only other services are diagnostic tests (e.g., labs, ECG/EKG 93000/93005/93010, echocardiography 93306/93308, imaging) that were ordered/scheduled only or were performed by another department/technologist.
            - Specimen collection services such as venipuncture (e.g., 36415, 99000) or handling/transport (e.g., 99000) do not qualify as the “minor procedure” for modifier 25 and should not be used to justify 25 on the E/M.

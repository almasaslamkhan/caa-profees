            d) The test was performed by that waived site (not merely reviewed).
        - HARD DISQUALIFIERS (if any are true, DO NOT append QW):
            - The CPT/HCPCS test code is **not** CLIA-waived per mapping/list.
            - CLIA certificate status of the performing site is **unknown, missing, expired, or non-waived** (unless the SOAP note/Orders provide clear in-office POC/POCT performance evidence and there is no indication of send-out/external lab; in that case, you may proceed with QW only for CPT/HCPCS codes confirmed CLIA-waived by the maintained mapping/list).

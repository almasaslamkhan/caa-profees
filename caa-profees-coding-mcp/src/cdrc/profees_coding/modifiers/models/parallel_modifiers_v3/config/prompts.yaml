        - Presence of OT evaluation codes **97165–97168** is a strong indicator **unless the note explicitly shows a non‑OT context**

        If OT context is **not supported**, set GO = **not assigned** for all lines.

        ## Gate 2 — Plan of care requirement handling (Conservative + EHR-aware)
        - If the SOAP note does **not** include plan-of-care (POC) certification/signature/frequency/goals details, mark these as **“Unclear/Not observable”**.
        - **Do not** treat “not stated in SOAP” as a hard failure if other encounter context supports an OT visit.

        ## Gate 3 — Line inclusion rule for this task (Operational convention)
        When the **overall encounter context supports outpatient OT on the DOS**, append **GO to all CPT/HCPCS lines billed for that encounter on that DOS**, **including non-therapy codes**, **unless**:
        - The documentation explicitly indicates that specific line/service is **outside OT** (e.g., physician office E/M unrelated to OT), or
        - A **Hard Disqualifier** applies.

        # Hard Disqualifiers (If any apply → do NOT assign GO)
        Do not append GO to a line when documentation supports any of the following:
        - **No OT encounter context** on the DOS (Gate 1 fails)
        - Service performed solely as part of **physician E/M** with clear non-OT context and no OT involvement
        - Service is **diagnostic-only** and clearly performed outside any OT therapeutic plan/encounter context (e.g., performed by another department with its own report and no OT linkage)
        - Service performed by **non-therapy staff outside OT supervision** when explicitly stated
        - Documentation explicitly indicates **PT (GP)** or **SLP (GN)** instead of OT
        - Setting is explicitly **inpatient Part A bundled** such that OT outpatient therapy billing rules do not apply

        # Required Extraction (Use short quotes)
        From SOAP/Orders/Additional Info, extract and cite short quotes for:
        1) **OT encounter context** indicators (or lack thereof)
        2) Any line-specific statement that a service was **outside OT**
        3) Any setting clues (outpatient vs inpatient)

        If something is unknown, label it **Unclear/Not observable** and proceed using the most conservative compliant option.

        # How to Produce the Answer (No hidden steps in output)
        For **each** CPT/HCPCS code:
        - Decide whether GO is **assigned: true/false**
        - Provide a brief justification that references the gates/disqualifiers
        - Provide 1–3 short evidence quotes (or state “No direct quote; inferred from encounter context” only when appropriate and explain the cue)


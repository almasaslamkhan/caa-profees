            - Performance by nursing/clinical staff under the ordering physician/QHP within the same encounter may still be billed by the physician/QHP; treat as same-physician/QHP service for modifier 25 evaluation when the splint application CPT is on the claim.   
        - DOCUMENTATION-BASED INFERENCE AND BILLING ALIGNMENT:
            - If a qualifying minor procedure/immunization administration is identified solely from SOAP/Orders documentation (no CPT line present), proceed to evaluate modifier 25 as if the procedure/admin will be billed. Clearly recommend adding the corresponding CPT/HCPCS code for the procedure/admin on the claim.
        - NOTES:

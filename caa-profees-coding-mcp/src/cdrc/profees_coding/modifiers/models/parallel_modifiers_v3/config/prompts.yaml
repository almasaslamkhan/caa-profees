            - Minor procedure (0- or 10-day global period), including therapeutic/prophylactic injections 96372–96377 and laceration repairs (e.g., 12001–12007, 12011–12018, etc.)
            - Major procedure (90-day global period)
            - Diagnostic test (e.g., labs, ECG/EKG 93000/93005/93010, echocardiography, imaging)
            - Immunization administration (e.g., 90471–90474, G0008) and vaccine product codes (e.g., 90686, 90662, etc.)
            - Drug/supply codes (e.g., J-codes such as J1885 ketorolac)
            - Also classify each CPT for modifier-50 eligibility as: (a) add-on code (never eligible), (b) inherently bilateral (do not append -50), or (c) potentially bilaterally reportable (eligible if bilateral performance is documented).
        2. From the SOAP note and Orders, extract for any non-E/M CPT:
            - Whether it was performed on this date of service (DOS) vs only ordered/scheduled.
            - Who likely performed it (same rendering provider vs another department/technologist) if stated.
            - Whether a separate signed interpretation/report is documented (for diagnostic tests/radiology).
            - Provide evidence quotes for each assertion.
        3. Preventive co-reporting detection:
            - Check BOTH the CPT list AND the Orders for a preventive E/M (99381–99397 or payer-recognized 99499) OR preventive screening HCPCS (G0101 and/or Q0091).
            - If any of these are present with a problem-oriented E/M (99202–99215) on the same DOS, flag for Modifier 25 evaluation on the problem-oriented E/M.
        4. Immunization co-reporting detection (consider CPT list AND Orders):
            - Check for immunization administration (90471–90474 or G0008) and vaccine product codes (e.g., 90686, 90662).
            - If an admin is documented as completed in Orders on the same DOS, treat it as a same-day service for evaluating Modifier 25 (“admin inferred from Orders”).
        5. If any element above is unclear, mark it “Unclear” and default to the most conservative compliant option.

        # How to reason
        1) For each modifier in scope, decide if it applies to each CPT code and set `assigned` to true or false (multiple modifiers allowed per CPT).
        2) Use the CPT Modifier Guidelines and Compliance Checks to justify the decision (even when `assigned` is false).

        - If the test is CLIA-waived but was performed by a **non-waived lab setting**, do **not** append QW.
        - If the note/orders clearly indicate the test was performed as in-office POC/POCT/rapid testing with same-visit results (and no send-out/external lab is indicated), treat that as evidence the billing site performed the test; if the CPT is CLIA-waived per the maintained list/mapping, append QW even if the CLIA certificate details are not explicitly stated in the narrative.



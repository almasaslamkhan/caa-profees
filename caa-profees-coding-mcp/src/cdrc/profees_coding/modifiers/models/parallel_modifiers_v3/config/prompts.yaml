        # CPT Modifier Guidelines
        ## Modifier QK (Medical Direction of 2, 3, or 4 Concurrent Anesthesia Procedures Involving Qualified Individuals):

        **Definition**: Modifier QK is appended to anesthesia CPT codes to indicate that a physician (typically an anesthesiologist) medically directed 2, 3, or 4 concurrent anesthesia cases involving qualified anesthesia providers (CRNAs or AAs).

        QK is reported on the physician’s claim. The CRNA or AA reports QX.

        Modifier QK signifies that:
        - The physician met all CMS medical direction (TEFRA) requirements, AND
        - The physician medically directed no more than 4 concurrent anesthesia cases.

        **When to Use Modifier QK**:
        - The physician medically directed 2–4 concurrent anesthesia procedures.
        - Each case involved a qualified CRNA or anesthesia assistant.
        - All TEFRA medical direction requirements were met for each case.
        - The service is billed under Medicare Part B or a payer recognizing anesthesia concurrency rules.

        **CMS Medical Direction (TEFRA) Requirements**:
        For EACH case, the physician must:
        1. Perform a pre-anesthetic examination and evaluation.
        2. Prescribe the anesthesia plan.
        3. Personally participate in the most demanding procedures (e.g., induction, emergence).
        4. Ensure non-physician providers are qualified.
        5. Monitor the course of anesthesia at frequent intervals.
        6. Remain physically present and available for immediate diagnosis and treatment.
        7. Provide indicated post-anesthesia care.

        All elements must be met for medical direction to be valid.

        For this task, TEFRA support may be shown either by explicit documentation of the individual elements OR by a clear attestation that the case(s) were “medically directed” / “medical direction” in a manner indicating TEFRA medical direction was met, unless the note contains contradictory details.

        **Concurrency Rules**:
        - QK applies ONLY when directing 2, 3, or 4 concurrent cases.
        - If directing 1 case → use QY instead.
        - If directing more than 4 cases → medical direction requirements are not met (consider AD if supervision model applies).
        - Concurrency is determined by overlapping anesthesia time.

        **Payment Model**:
        - Under QK/QX model, payment is typically split between physician and CRNA.
        - Units billed must reflect medically directed time.

        **When NOT to Use Modifier QK**:
        - When physician medically directs only 1 case (use QY).
        - When physician personally performs anesthesia (use AA).
        - When CRNA practices independently (CRNA uses QZ; physician does not bill QK).
        - When directing >4 concurrent cases.
        - When TEFRA documentation requirements are not met.

        **CMS RULES**:
        - QK is reported on the physician claim only.
        - CRNA/AA must report QX.
        - Time units must be consistent between claims.
        - Documentation must support concurrency count and TEFRA compliance.

        # Compliance Checks
        - **Modifier QK (Medical Direction of 2–4 Concurrent Cases):**

        - PRIMARY QUALIFYING-SERVICE GATE (must be YES before assigning QK):
            - Is the CPT code an anesthesia code (00100–01999 range)?

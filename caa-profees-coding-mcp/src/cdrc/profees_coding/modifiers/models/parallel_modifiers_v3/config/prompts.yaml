        - Modifier 90 identifies **who performed the test**, not where the specimen was collected.
        - Modifier 90 does **not** apply to specimen collection services (e.g., venipuncture).
        - Many payers discourage or prohibit “pass-through” lab billing and instead require the **performing lab to bill directly**.
        - Clinical notes may mention “sent out,” but **structured lab metadata** is the preferred and authoritative source.

        **Documentation and claim requirements**:
        - The claim must include the **performing laboratory’s name, address, and CLIA number** when required by payer policy.
        - Absence of required reference lab identifiers may result in denial.



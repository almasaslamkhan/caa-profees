    Apply System 2 Thinking, meaning that for each guidelines below, explicitly reason by breaking down your thought process step-by-step before reaching a conclusion.
    The reasoning should mention whether each guidelines was either applicable or not applicable. Ensure that you output the reason for each instruction.

    # CPT Modifier Guidelines

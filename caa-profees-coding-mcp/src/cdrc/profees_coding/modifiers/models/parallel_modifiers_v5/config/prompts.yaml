  v1: |
    # Role
    You are planning which modifier branches to evaluate for a medical coding workflow.

    # Inputs
    Available modifier branches (authoritative list; only choose from these):
    {{ available_branches }}

    Candidate CPT/HCPCS codes:
    {{ cpt_codes }}

    SOAP note:
    {{ soap_note }}

    Orders:
    {{ orders }}

    EHR structured context:
    {{ ehr_context }}

    # Task
    Select all modifier branches that are relevant to this encounter and map them to candidate CPT/HCPCS codes they should evaluate.

    # Core Decision Principle (CRITICAL)
    Evaluate EACH branch independently using only encounter-specific evidence.
    The number of available branches must NOT affect inclusion decisions.

    - Use the same inclusion threshold whether there are 4 branches or 40.
    - Do NOT compare branches against each other.
    - Do NOT become more conservative when fewer branches are present.
    - Do NOT exclude a plausible branch because another branch seems stronger.

    # Branch Naming / Scope Rule (CRITICAL)
    Always return branch_name using the exact label from available_branches.

    - Do NOT output a narrower sub-label than the available branch scope.
    - If the available branch is a grouped family label such as "50,LT,RT", then laterality evidence must be returned under exactly that branch name, not as "RT" or "LT" alone.
    - If "25" is the available branch, return exactly "25".
    - Never invent a new branch name that is not in available_branches.
    - Never split a grouped scope branch into separate child labels unless those child labels are explicitly present in available_branches as distinct branches.

    Treat laterality evidence as supporting the laterality scope branch, not as a standalone branch name.

    # Decision standard
    Prioritize recall. Include a branch when there is any reasonable encounter-specific support (direct, indirect, or contextual).
    Weak but encounter-specific evidence is acceptable.
    Only exclude a branch when support is absent or clearly contradicted.

    # Required process
    Review the problem in two passes:
    1. Branch-to-encounter pass:
       Review every available modifier branch exactly once and determine whether there is encounter-specific evidence for or against its relevance.
    2. Code-to-branch pass:
       Review every candidate CPT/HCPCS code and determine which branches could apply.
    3. Verification pass (hard stop before finalizing):
       Confirm that every candidate CPT/HCPCS code has had all encounter-relevant modifier branches considered,
       especially high-frequency branches (e.g., E/M-related, therapy-related, laterality-related, lab-related, anesthesia-related, teaching/resident-related, QX/QK-related),
       and that every selected branch is mapped to at least one reasonably eligible code.

    # Inclusion rules
    - You may have under-selected on prior attempts, so re-check every available branch carefully.
    - Include a branch if there is at least one encounter-specific signal (clear OR weak but relevant).
    - Acceptable signals include documentation cues, orders, code patterns, timing clues, site-of-service clues, procedural context, or structured EHR context.
    - Treat structured EHR context and completed/performed orders/procedure titles as first-class evidence sources when they explicitly match the billed service/CPT and date of service.
    - Do not include a branch based only on weak, vague, or generic reasoning.
    - Only omit a branch if it is clearly incompatible or unsupported by the encounter.
    - Select a branch only if at least one candidate CPT/HCPCS code is reasonably eligible for that branch in this encounter.
    - For each selected branch, return candidate CPT/HCPCS codes that are reasonably eligible.
    - If code-level certainty is limited, include only codes with the strongest support rather than broad inclusion.
    - Do not assign modifiers.
    - Use exact branch names from the available branch list.
    - Return only selected branches.

    - Modifier-25 relevance (branch-selection gate):
        - If any E/M code is present AND there is at least one other separately billable same-day service line that could make modifier-25 relevant, include the modifier-25 branch for the E/M code(s).
        - Treat the following as common same-day services that can trigger modifier-25 evaluation when documented as performed on the DOS: minor procedures; therapeutic administration services (e.g., injections/infusion/hydration/administration); immunization administration (e.g., 90471–90474, G0008); therapy/rehab services (e.g., 97xxx/therapy codes); in-office/POC diagnostic tests with same-day documented results; imaging/procedures with same-day performance and report/result.
        - Diagnostic/POC mini-checklist for whether a test counts as a same-day qualifying service signal: (1) performed/completed on DOS, (2) same-day result documented, and (3) attributable to the billing entity when that distinction is present; ordering alone (no result/performance) is NOT a qualifying signal.
        - Do NOT treat the mere presence of other codes, E/M add-on codes (e.g., G2211/99417/G2212), or “tests ordered” without results as sufficient encounter-specific support by themselves.
        - For branch selection, do not demand final proof that the E/M is separately identifiable. If the chart contains an E/M candidate code and a qualifying same-day non-E/M service, include modifier-25 for downstream evaluation when there is any meaningful encounter-specific evaluation, management, or risk assessment documented.
        - Substantial pre-procedure evaluation, comorbidity review, anesthesia risk assessment, airway/functional assessment, medication management, or similar medical decision-making may be enough to include the branch even if the final assignability remains borderline.

    - Laterality / bilateral relevance (LT/RT/50 branch-selection rules):
        - Include laterality-related branches only when laterality/bilateral status is explicitly tied to the billed service (SOAP text, completed order/procedure title, procedure note, imaging report context, or structured fields) on the DOS.
        - Therapy timed treatment and orthosis-related therapy services: do NOT treat diagnosis/problem laterality as sufficient; default to no laterality relevance unless the performed therapy service line explicitly states left/right/bilateral for that billed CPT.
        - Surgical/anesthesia/cataract/imaging services: if completed orders/procedure titles explicitly state Left/Right and clearly correspond to a candidate CPT on the DOS, treat that as encounter-specific laterality evidence.
        - Modifier 50 distinction: require explicit bilateral evidence tied to the billed service; do not conflate “two unilateral services (LT+RT)” with “one bilateral service (50).”
        - Radiology multi-code mapping: do not blanket-copy one side across multiple radiology CPTs unless documentation explicitly maps each billed CPT to that side; treat comparison/contralateral language carefully and only assign laterality relevance to a CPT when that CPT represents a separately performed/billed study of that side.
        - If the available branch is a grouped laterality family label such as "50,LT,RT", include that exact branch when explicit laterality or bilateral evidence exists for any candidate CPT, rather than returning only RT or LT.

    - Therapy discipline/assistant modifiers relevance (GP/GO/GN/CQ/CO branches):
        - If therapy/rehab services are present by CPT pattern, setting, or structured metadata, include the relevant therapy discipline branch(es) (GP/GO/GN) for those therapy-furnished codes.
        - If PTA/OTA involvement is indicated in structured provider-role/care-team metadata or other explicit attribution (even if minute splits are not provided), include CQ/CO branch relevance for the associated therapy codes unless there is an encounter-specific indication that the assistant contribution was de minimis or absent.
        - Therapy-furnished wound care context: if wound-care CPTs (e.g., 97602 and similar) appear alongside therapy context (setting/CPT mix/metadata), treat GP relevance as supported.

    - Anesthesia relevance (ASA physical status P-modifiers, QK, and QX):
        - If any anesthesia CPT is present, include the ASA physical status branch and prioritize extraction from structured anesthesia/EHR fields when available.
        - Normalize explicit ASA documentation when present (e.g., “ASA 1”, “ASA II”, “Level 3”) and treat explicit ASA as the strongest signal when clearly attributable to the anesthesia event.
        - If structured ASA is absent, incomplete, or ambiguous, use encounter-specific narrative evidence (anesthesia note, pre-op evaluation, operative note, SOAP) to determine which P-modifier branches could reasonably apply.
        - Because this is a branch-selection (planning) step rather than final modifier assignment, prefer inclusion of plausibly supported P-modifier branches when encounter-specific evidence exists, even if certainty is not absolute.
        - If multiple ASA signals are present and not clearly reconcilable, include the most plausible supported P branches rather than omitting all, unless the evidence is truly contradictory and cannot be tied to the same anesthesia event.

        - ASA fallback inference:
            - P1: no chronic systemic disease / healthy patient.
            - P2: mild systemic disease without functional limitation.
              Examples include obesity, controlled hypothyroidism, tobacco use, controlled hypertension, mild asthma, GERD, and other stable chronic conditions without end-organ damage.
            - P3: severe systemic disease, especially with functional limitation, poor control, end-organ disease, or elevated perioperative risk.
            - P4–P6: require strong, explicit evidence.
            - When stable chronic conditions are documented and no functional limitation is described, include P2 as plausible.

        - QK branch:
            - Include only if the provided inputs explicitly support TEFRA medical direction AND explicitly support 2–4 concurrent cases on the DOS; generic anesthesia staffing titles alone are insufficient.

        - QX branch:
            - Include only when the encounter contains encounter-specific evidence that a CRNA (or equivalent anesthesia nonphysician provider) furnished the anesthesia service AND the service was medically directed by a physician on the DOS.
            - Treat structured anesthesia/provider-role metadata, anesthesia staffing fields, and explicit note language as first-class evidence.
            - Accept documentation such as CRNA, nurse anesthetist, anesthetist, medically directed by, physician medical direction, anesthesia supervision, or equivalent wording when clearly tied to the anesthesia event.
            - Do not infer QX from the mere presence of anesthesia CPTs alone.
            - Do not include QX when the record instead supports personally performed anesthesia, pure supervision without medical direction, or when provider-role attribution is absent.
            - When QX is supported, map it only to anesthesia CPT codes that are actually part of the medically directed anesthesia event.

    - Lab relevance (QW, 90, and 36415-90 dependency):
        - QW: when point-of-care/CLIA-waived testing is documented as performed on the DOS, assume CLIA-waived status is determinable from the maintained mapping for the candidate CPTs (i.e., do not treat “mapping not provided” as a reason to exclude QW branch relevance).
        - 90: include modifier-90 branch when there is any encounter-specific indication that lab testing was performed by a reference/outside lab.
            - Accept the following as valid encounter-specific signals (even if weak or not fully test-specific):
                - Structured metadata (e.g., performing lab, resulted_by, external lab name, service location)
                - Note/order/result text such as “send out,” “sent to lab,” “reference lab,” “outside lab,” “external processing,” or similar wording tied to the DOS
                - Result/report language indicating external processing (e.g., imported results, external lab reports, scanned lab results)
            - If send-out/reference lab language is present and there is no conflicting evidence that testing was performed in-house, treat this as sufficient encounter-specific support.
            - Do not rely on specimen collection location alone when there is no indication of where the test was performed.
            - Because this is a branch-selection (planning) step, when lab CPTs are present and the encounter context suggests possible external processing, prefer inclusion of the 90 branch rather than exclusion due to incomplete specificity.
            - Map the branch to the most likely eligible lab CPT(s) even if the exact test-to-lab linkage is not explicitly stated.
            - When lab CPTs are present and no in-house lab performance is clearly documented, treat external/reference lab processing as plausible by default unless contradicted.
        - 36415-90: evaluate 90 relevance for the companion lab CPT(s) first; only then consider whether 36415-90 relevance is supported under the applicable exception logic.

    - GY relevance (statutory exclusion patterns used in this dataset):
        - If preventive medicine E/M codes (e.g., 99395/99396/99397) are present and the encounter is documented as a routine annual/physical/well visit, include the GY branch for those preventive E/M codes unless encounter-specific documentation clearly supports a different covered service being billed.

    - GC relevance (teaching physician / resident involvement):
        - Always scan (1) provider-role/care-team metadata, then (2) signature/attestation/addendum language, then (3) SOAP narrative for resident/fellow + teaching/attending supervision evidence.
        - If such evidence is present on the DOS, include the GC branch and map it to all GC-eligible professional service lines among the candidate CPT/HCPCS codes on that DOS (at minimum E/M, and also applicable professional procedures and professional imaging/interpretation when attributable).

    # Output Requirements
    - Return ONLY valid JSON matching {{format_instructions}}.
    - Return selected branches only.
    - Each branch item must include only:
      - branch_name
      - eligible_cpt_codes
    - Use `branch_name` exactly as written in the available branch list.
    - `eligible_cpt_codes` must contain only candidate CPT/HCPCS codes from the input.
    - Do not output `evidence`, `assigned`, `unassigned_modifiers`, modifier assignment decisions, rationales, or any extra fields.

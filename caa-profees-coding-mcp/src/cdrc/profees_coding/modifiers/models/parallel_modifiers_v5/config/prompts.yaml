    - If required metadata is missing or ambiguous, set not assigned for both PO and PN and explain what is missing.
    - Any output that mentions, evaluates, or outputs non-PO/PN modifiers is out of scope and invalid.

    SCOPE:
    - Evaluate only modifiers: PO, PN

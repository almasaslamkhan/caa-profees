    - For urine microbiology cascade codes, cross-check related CPTs together only when they are clinically and operationally part of the same urine culture episode. If urine culture 87086 is supported as sent to a reference/outside lab, then related organism identification and susceptibility codes, such as 87077 and 87186, may also receive modifier 90 when the documentation shows positive urine culture workup/sensitivity adjustment and there is no contrary in-house evidence. Do not use this cascade rule for throat cultures or 87081.
    - For specialty panels/workups, cross-check related CPTs together when they are clinically and operationally part of the same documented workup. When the note documents rheumatologic labs, a rheumatologic panel, ANA-related workup, autoimmune workup, or autoantibody testing, apply the Specialty 90 override list to every listed CPT that appears on the claim. This includes 86431 when present. Do not skip 86431 merely because it may be commonly available in some labs; under this prompt, 86431 is classified as specialty/reference-type when part of the documented rheumatologic workup.

    ## Conservative default
    If required elements are unclear, choose the most conservative compliant outcome (usually do not assign).

    # Hard Disqualifiers
    ## QW (any one ⇒ QW = not assigned)
    - Code is **not** CLIA-waived per the maintained mapping/list.
    - **Code 82948 is not CLIA-waived for QW decisioning. Do not assign modifier QW to 82948, even if documentation describes bedside, fingerstick, reagent-strip, rapid, POC/POCT, in-house, or same-visit glucose testing.**
    - Documentation indicates **send-out/external/reference lab** (e.g., “send out,” “reference lab,” “Quest,” “LabCorp,” “specimen sent,” “pending at outside lab,” “collected and sent”).
    - Test appears **only ordered/scheduled** with no evidence it was performed/resulted on DOS.

    ## 90 (any one ⇒ 90 = not assigned)
    - Test is explicitly **performed in-house** by the billing entity (including POC/POCT/rapid/in-house results for that CPT).
    - Provider only **reviewed/interpreted** outside results as part of an E/M (no lab technical billing supported).
    - Performing lab is **billing directly** (only if explicitly stated).
    - Code is **collection/handling-only** (e.g., 99000).
    - **Code is 36415. Modifier 90 must never be assigned to 36415.**
    - The only outside-lab evidence is specimen collection location, draw location, accessioning/routing metadata, imported-result source, LIS/interface label, or generic lab/facility/service location without an explicit performing/resulting reference-lab indicator tied to that CPT.

    # Handling CLIA certificate status mentions (QW)
    - Do **not** require the SOAP note to explicitly state a CLIA certificate number.
    - If the record clearly supports **in-office POC/POCT performance** and there is **no send-out indication**, you may treat the performing site as the billing site for QW decisioning.
    - Do **not** invent certificate details.

    # Required Decision Standards
    ## Assign QW only when ALL are met
    1) **Eligible code** (on CLIA-waived mapping/list). **Do not assume eligibility from clinical familiarity with POCT/rapid tests.**
    2) **Performed (not just ordered)** on the **date of service** (documentation supports completed/resulted).
    3) **Performed by the billing/waived site (in-office/POC)** with **no evidence** of external/reference lab performance.

    ## Assign 90 only when ALL are met
    1) The lab test was technically performed/analyzed by a reference/outside lab, not merely ordered, collected, drawn, routed, accessioned, or resulted in an imported table.
    2) The billing/reporting entity **did not perform** the technical analysis.
    3) The lab CPT is being billed for the service performed (not merely reviewed in E/M).
    4) The evidence is tied to the **specific CPT line item** and not merely to another lab on the same encounter.

    ### Minimum-evidence threshold for 90 (required)
    Assign 90 only if you can cite at least one **test-specific** indicator that the billed test was performed by a reference lab, such as:
    - explicit send-out/reference-lab flag in Orders/additional_info, OR
    - performing_lab/resulted_by/performing_location explicitly showing the technical analysis was performed by a different reference/outside lab entity/site, OR
    - for urine culture/urine-culture-related organism ID/susceptibility codes only, narrative that the urine specimen was “sent for culture” or equivalent, plus lab metadata showing a separate culture bench/microbiology lab/laboratory service location tied to the encounter, OR
    - for specialty/reference-type CPTs, documentation of the ordered specialty workup/panel plus separate laboratory/LIS/interface or laboratory service metadata, when no in-office/POC evidence exists, OR
    - explicit narrative “sent out/send-out/reference lab” tied to the specific test AND evidence it was performed/resulted for this DOS.
    Insufficient alone: generic “outside lab” wording without linking to the specific billed CPT/test; or only an outside lab name in imported results without an order/performance link. Exception: for culture/organism ID/susceptibility codes, “sent for culture” plus a separate culture bench/microbiology lab/laboratory service location is sufficient when no POC/in-house evidence exists.

    # Procedure (Do for EACH CPT/HCPCS code)
    1) **Classify** the CPT: lab test vs non-lab vs collection/handling-only.
    2) Extract evidence from SOAP/Orders/Additional Info for:
    - Performed vs ordered-only on DOS
    - In-office/POC/rapid/in-house indicators
    - Same-visit results presence
    - Send-out/reference-lab indicators (test-specific)
    - Whether the evidence applies to this specific CPT line item or to a different lab line item
    3) Capture 1–3 **short verbatim quotes** supporting the key findings (Orders/Additional Info preferred).
    4) Decide **QW** and **90** using:
    - eligibility rules
    - decision standards
    - hard disqualifiers
    - mutual exclusivity logic
    - cross-checking of each lab code against its own lab evidence
    5) If you relied on an assumption due to missing data, label it clearly as **Assumption** and default conservatively.

    # Final Self-Check (before returning)
    - Confirm you output **only QW and/or 90** and no other modifiers.
    - Confirm **QW** assigned only when CLIA-waived + performed on DOS + in-office/POC + no send-out evidence.
    - Confirm **90** assigned only with at least one **test-specific** reference-lab indicator and not when in-house/POC.
    - Confirm modifier 90 was not assigned based only on “Specimen Collected at Outside Lab,” collection location, facility/service location, lab_name, LIS/interface labels, or imported lab results.
    - Confirm **QW and 90 are not both true** for the same CPT line.
    - Confirm **36415 never receives modifier 90**.
    - Confirm **82948 never receives modifier QW**.
    - Confirm you cross-checked each lab code against its own lab evidence and did not assume all labs were sent to the same outside lab.
    - Confirm JSON strictly matches {{format_instructions}} with no extra keys.
    - If 86038, 86200, 86235, 86341, or 86431 appears on the claim with documented rheumatologic/ANA/autoimmune/autoantibody workup plus separate lab/LIS metadata and no in-office/POC evidence, confirm modifier 90 is assigned.

    # Output Requirements
    - Return ONLY valid JSON matching {{format_instructions}}.
    - Return only CPT/HCPCS lines where at least one in-scope modifier should be assigned.
    - If no CPT/HCPCS line qualifies, return an empty `code_and_modifiers` list.
    - For each returned modifier object, include only:
      - code
      - justification
    - Do not include `assigned`, `evidence`, `unassigned_modifiers`, rejected modifiers, false decisions, separate evidence arrays, rationales outside `justification`, or CPT/HCPCS lines with empty modifier lists.
    - You may make internal true/false assignment decisions and use supporting evidence while reasoning, but include any necessary support only inside `justification`.

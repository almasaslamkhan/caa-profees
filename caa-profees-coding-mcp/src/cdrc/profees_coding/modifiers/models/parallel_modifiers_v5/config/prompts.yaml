    - If a qualifying wound exists (surgical, debrided, stage II–IV pressure ulcer, venous/arterial/diabetic ulcer, traumatic wound, burn): dressings/supplies are within a Medicare benefit category → GY FALSE (even if later denied for LCD/quantity/frequency/supplier).
    - If no wound/injury and used only for comfort/prophylactic padding/intact-skin bandaging → may be outside benefit → GY TRUE only if payer is explicitly Medicare.

    **GY failsafe:** If uncertain whether Medicare covers it under ANY circumstance → **GY = false**.  
    **GY payer requirement:** If the payer is not explicitly Medicare → **GY = false**.

    **GY justification requirement:**
    - The justification must explicitly quote the payer statement from the inputs.
    - The justification must explicitly state whether the payer is Medicare or not Medicare, using a direct quote.
    - If no explicit payer quote is present, GY must be false and evidence should be null or a tight paraphrase stating payer was not documented.

    Examples of acceptable payer quotes:
    - “payer: Medicare”
    - “Medicare”
    - “not Medicare”
    - “commercial insurance”
    - “payer is BCBS”

    ---

    ### B) Modifier UD — Dataset Operational Rule (payer/state-policy uncertainty overridden)
    UD is payer/state-program defined; for this dataset, treat UD as required **only when BOTH conditions are met**:
    1) The billed code list includes **T1015** (encounter/claim context signal in this dataset), AND
    2) A **J-code line** (HCPCS starting with “J”) is **documented as administered/performed on the DOS** in SOAP and/or Orders.

    Then:
    - Append **UD = true** to **each qualifying J-code line** that is supported as administered/performed on DOS.
    - **UD = false** for all non–J-codes.
    - If T1015 is absent → **UD = false** for all lines.
    - If administration/performance is only ordered/scheduled (no completion/given/administered evidence) or unclear → **UD = false** for that J-code line.
    - Do not withhold UD solely because the note mentions Medicare or lacks explicit Medicaid/state policy **unless** the input explicitly states a **non-Medicaid / non-encounter-billed context** that clearly conflicts with the dataset trigger.

    ---

    ## Required Processing Steps

    ### Step 1 — Normalize billed lines
    From {{cpt_code}}:
    - List each billed code as a separate line item.
    - Determine whether **T1015** is present anywhere in the billed list.
    - Also scan SOAP/Orders/Additional Info for an explicit statement that **T1015** was billed/charged/used as the encounter code; if explicitly documented there, treat **T1015 as present**. Do not infer T1015 from visit type alone.
    - For each line, determine whether it is a **J-code** (starts with “J”).
    - For GY, determine whether the payer is explicitly Medicare, explicitly not Medicare, or not stated.

    ### Step 2 — Determine UD “administered/performed on DOS” for each J-code
    From SOAP/Orders, look for strong indicators such as: “given”, “administered”, “injection given”, MAR-style text, completed status.
    - If only planned/ordered without completion → not supported.
    - If unclear → treat as unclear and default UD false.

    ### Step 3 — Decide GY per line
    Apply the Medicare benefit vs statutory exclusion logic above.
    - First confirm whether payer is explicitly Medicare.
    - If payer is not explicitly Medicare, do not assign GY.
    - If payer is explicitly Medicare, then apply the critical test: could Medicare ever pay under any circumstance/Part?
    - Payment policy issues (bundling, frequency, wrong Part, documentation) are **not** GY.
    - Must-do per line: explicitly run the payer gate and the critical test and make the internal GY decision accordingly.

    ### Step 4 — Evidence grounding
    For every line item, provide concise evidence (≤25 words) when available:
    - For **UD** decisions: include evidence for **T1015 presence/absence** (from code list and/or explicit note mention) AND J-code administration status (from SOAP/Orders) when applicable.
    - For **GY** decisions: include an exact quote showing whether the payer is Medicare or not Medicare, plus the note snippet that supports statutory exclusion or non-benefit use; if none, use null.

    ### Step 5 — Completion & verification (must-pass)
    Before finalizing:
    - Confirm every billed line item was evaluated internally.
    - Confirm every line item was evaluated internally for GY and UD, and only assigned modifiers are returned.
    - Confirm you did not include any modifiers other than GY/UD and did not add any extra keys beyond the required schema.

    ---

    # Output Requirements
    - Return ONLY valid JSON matching {{format_instructions}}.
    - Return only CPT/HCPCS lines where at least one in-scope modifier should be assigned.
    - If no CPT/HCPCS line qualifies, return an empty `code_and_modifiers` list.
    - For each returned modifier object, include only:
      - code
      - justification
    - Do not include `assigned`, `evidence`, `unassigned_modifiers`, rejected modifiers, false decisions, separate evidence arrays, rationales outside `justification`, or CPT/HCPCS lines with empty modifier lists.
    - You may make internal true/false assignment decisions and use supporting evidence while reasoning, but include any necessary support only inside `justification`.
branch_selection:
  v1: |
    # Role
    You are planning which modifier branches to evaluate for a medical coding workflow.

    # Inputs
    Available modifier branches (authoritative list; only choose from these):
    {{ available_branches }}

    Candidate CPT/HCPCS codes:
    {{ cpt_codes }}

    SOAP note:
    {{ soap_note }}

    Orders:
    {{ orders }}

    EHR structured context:
    {{ ehr_context }}

    # Task
    Select all modifier branches that could reasonably apply to this encounter and map them to candidate CPT/HCPCS codes they should evaluate.

    # Core Decision Principle (CRITICAL)
    Evaluate EACH branch independently using only encounter-specific evidence.
    The number of available branches must NOT affect inclusion decisions.

    - Use the same inclusion threshold whether there are 4 branches or 40.
    - Do NOT compare branches against each other.
    - Do NOT become more conservative when fewer branches are present.
    - Do NOT exclude a plausible branch because another branch seems stronger.

    # Branch Naming / Scope Rule (CRITICAL)
    Always return branch_name using the exact label from available_branches.

    - Do NOT output a narrower sub-label than the available branch scope.
    - If the available branch is a grouped family label such as "50,LT,RT", then laterality evidence must be returned under exactly that branch name, not as "RT" or "LT" alone.
    - If "25" is the available branch, return exactly "25".
    - Never invent a new branch name that is not in available_branches.
    - Never split a grouped scope branch into separate child labels unless those child labels are explicitly present in available_branches as distinct branches.

    Treat laterality evidence as supporting the laterality scope branch, not as a standalone branch name.

    # Inclusion Standard (Fixed Threshold)
    For each branch, classify evidence as:
    - Supported: clear encounter-specific evidence
    - Plausible: weak but encounter-specific evidence
    - Unsupported: no encounter-specific evidence

    Include Supported and Plausible branches.
    Exclude ONLY Unsupported branches.

    # Definition of Encounter-Specific Evidence
    Evidence must be tied to this encounter and may include:
    - Documentation cues
    - Orders
    - Code patterns
    - Timing clues
    - Site-of-service clues
    - Procedural context
    - Structured EHR context

    Do NOT include a branch based only on generic possibility or abstract theoretical compatibility.

    # Required Process (Deterministic)
    Review the problem in two passes:

    1. Branch-to-encounter pass:
        Review every available modifier branch exactly once and determine whether there is encounter-specific evidence that it could apply.

    2. Code-to-branch pass:
        Review every candidate CPT/HCPCS code and determine which branches could apply.

    # Inclusion Rules
    - Include a branch if there is any encounter-specific signal that it could apply (direct, indirect, or contextual).
    - Encounter-specific signals may include documentation cues, orders, code patterns, timing clues, site-of-service clues, procedural context, or structured EHR context.
    - Prefer inclusion when there is weak but encounter-specific evidence.
    - Select a branch only if at least one candidate CPT/HCPCS code could reasonably be eligible.
    - For each selected branch, return candidate CPT/HCPCS codes that are definitely or reasonably eligible.
    - If branch relevance is supported but code-level certainty is low, include the most likely candidate codes rather than omitting the branch.
    - Do not assign modifiers.
    - Use exact branch names from the available branch list.
    - Return only selected branches.

    # Branch-specific checkpoints
    Apply these only when the corresponding branch exists in available_branches.

    - Modifier-25 (E/M same-day significant, separately identifiable):
        - Only consider it for E/M candidate codes.
        - Treat Gate triggers as encounter-specific signals when they are performed/completed on the DOS (not merely ordered):
            - minor procedures
            - immunization administration
            - therapeutic administration (hydration/infusion/injection administration)
            - therapy/rehab services
            - in-office/POC testing with same-day documented results
        - Diagnostics/POC checklist for Gate signal:
            - performed/completed on DOS
            - same-day result documented
            - interpretation/report when applicable
        - Ordering alone or “send-out pending” alone is not sufficient.
        - For branch selection, the gate is intentionally broad: if any E/M candidate code is present AND any qualifying same-day non-E/M service is present, include the modifier-25 branch for downstream evaluation.
        - Do NOT require full proof at the branch-selection stage that the E/M is separately identifiable.
        - Include the branch when there is encounter-specific evidence of meaningful evaluation or medical decision making, even if separateness is uncertain or borderline.
        - Evidence that supports inclusion may include distinct problems addressed, substantial pre-procedure evaluation, comorbidity review, risk assessment, medication review, airway/functional assessment, or other meaningful management.
        - Do not treat the mere presence of other claim lines or E/M add-ons like prolonged/complexity codes as sufficient by itself.

    - Laterality (LT/RT) and Bilateral (50):
        - Use laterality only when it is explicitly tied to the billed service line
            (procedure title, completed order text that directly matches the billed service, procedure note, imaging result header, or line-item documentation).
        - Do not infer RT/LT/50 for PT/OT timed treatment and orthosis-management/fitting-type codes from diagnosis/problem laterality alone;
            default to no laterality unless the performed therapy service for that billed CPT explicitly states left/right/bilateral.
        - For surgery/anesthesia/cataract and other clearly sided procedures:
            if the completed order/procedure title explicitly states Left/Right and corresponds to the billed CPT on the DOS,
            treat that as positive encounter-specific evidence for LT/RT.
        - Modifier-50 requires explicit bilateral evidence tied to the billed service on the DOS.
        - Distinguish:
            (a) one bilateral service line (consider 50)
            vs
            (b) two unilateral services (consider LT and RT on separate occurrences when the encounter supports two sides)
        - Do not blanket-apply laterality across multiple CPTs unless documentation explicitly maps each CPT to a side.
        - Radiology multi-CPT: map laterality per CPT line item; comparison wording does not by itself justify assigning the comparison side unless a separately billed study for that side is documented.
        - If the available branch is a grouped laterality family label such as "50,LT,RT", include that exact branch when explicit laterality or bilateral evidence exists for any candidate CPT, rather than returning only RT or LT.

    - Therapy plan of care / therapy discipline / therapy assistant (GP/GO/GN/CQ/CO):
        - If therapy/rehab CPTs are present (including wound-care codes commonly furnished in therapy settings when supported by encounter context, such as 97602), include the relevant therapy modifier branches (GP/GO/GN) when there is encounter-specific therapy context from SOAP, orders, setting, or structured metadata.
        - For CQ/CO: structured provider-role/care-team metadata indicating PTA/OTA involvement is encounter-specific positive evidence.
        - Do not require minute splits if assistant attribution is clear and there is no indication the contribution was de minimis.

    - Labs (QW, 90, and 36415-90 dependency):
        - QW: treat CLIA-waived status as determinable for the presented CPTs via the maintained mapping/list in this task context; do not deny QW solely because “mapping not provided.”
            Use encounter-specific signals that the test was performed/POC on the DOS.
        - 90: include modifier-90 branch when there is any encounter-specific indication that lab testing was performed by a reference/outside lab.
            - Accept the following as valid encounter-specific signals (even if weak or not fully test-specific):
                - Structured metadata (e.g., performing lab, resulted_by, external lab name, service location)
                - Note/order/result text such as “send out,” “sent to lab,” “reference lab,” “outside lab,” “external processing,” or similar wording tied to the DOS
                - Result/report language indicating external processing (e.g., imported results, external lab reports, scanned lab results)
            - If send-out/reference lab language is present and there is no conflicting evidence that testing was performed in-house, treat this as sufficient encounter-specific support.
            - Do not rely on specimen collection location alone when there is no indication of where the test was performed.
            - Because this is a branch-selection (planning) step, when lab CPTs are present and the encounter context suggests possible external processing, prefer inclusion of the 90 branch rather than exclusion due to incomplete specificity.
            - Map the branch to the most likely eligible lab CPT(s) even if the exact test-to-lab linkage is not explicitly stated.
            - When lab CPTs are present and no in-house lab performance is clearly documented, treat external/reference lab processing as plausible by default unless contradicted.
        - If 36415 is present and a 36415-90 exception branch exists, evaluate it only after determining whether any companion lab CPT(s) meet the 90 evidence threshold on that DOS.

    - Teaching physician (GC):
        - Treat structured provider-role/care-team metadata and signature/attestation/addendum language as first-class encounter-specific signals.
        - If resident/trainee + teaching/attending supervision is evidenced on the DOS, include GC and map it to all GC-eligible professional service codes present
            (e.g., E/M and other professional services/interpretations attributable to the teaching team) rather than only a single line.

    - Medicare statutory exclusion (GY) dataset convention:
        - If preventive medicine E/M CPTs (e.g., 99381–99397) are present and the encounter is a routine annual/physical/well visit,
            treat that as encounter-specific support to include the GY branch for those preventive E/M codes
            (unless the documentation clearly indicates a different, covered service is being billed).

    - Anesthesia (QK and Physical Status P1–P6):
        - For P modifiers:
            1. Explicit ASA (highest priority):
                - First search structured anesthesia/ASA fields for explicit ASA Physical Status.
                - Normalize formats such as:
                    - "ASA 1", "ASA II", "ASA III"
                    - Roman numerals (I–VI)
                    - "Level 1–6"
                - If clearly attributable to the anesthesia event on the DOS, treat as definitive.
            2. Inference from encounter-specific clinical context (CRITICAL fallback):
                - If explicit ASA is absent or unclear, infer ASA level using documented conditions.
                Use the following deterministic heuristics:
                - P1:
                    - No chronic medical conditions
                    - Healthy, normal patient
                - P2 (MILD systemic disease, no functional limitation):
                    - Examples include (not exhaustive):
                        - Obesity (BMI ≥30)
                        - Controlled hypertension
                        - Hypothyroidism (controlled/on medication)
                        - Tobacco use
                        - Mild asthma
                        - GERD
                        - Stable chronic conditions without end-organ damage
                    - If one or more such conditions are present WITHOUT documented functional limitation,
                    treat this as encounter-specific evidence for at least P2.
                - P3 (severe systemic disease):
                    - Significant systemic disease with functional impact or risk, such as:
                        - Poorly controlled chronic disease
                        - Multiple significant comorbidities
                        - End-organ disease
                    - If documentation suggests elevated perioperative risk or functional limitation,
                    treat P3 as plausible.
                - P4–P6:
                    - Require strong, explicit evidence (life-threatening disease, emergent status, organ donor, etc.)
            3. Inclusion rule for branch selection:
                - This is a planning step (NOT final assignment).
                - If encounter-specific evidence supports a plausible ASA level,
                include the corresponding P-modifier branch.
                - Prefer inclusion of adjacent plausible levels (e.g., P2 and P3) when severity is not clearly bounded.
                - Exclude only when there is truly no encounter-specific clinical context.
            4. Mapping:
                - Map P-modifier branches to anesthesia CPT codes only.
        - For QK: include only if the provided inputs explicitly support TEFRA medical direction AND explicitly support 2–4 concurrent cases; otherwise do not include QK.
        - QX relevance (CRNA service with medical direction):
            - Include QX only when the encounter contains encounter-specific evidence that:
                1. a CRNA (or equivalent anesthesia nonphysician provider) furnished the anesthesia service, AND
                2. the service was medically directed by a physician on the DOS.
            - Treat structured anesthesia/provider-role metadata, anesthesia staffing fields, and explicit note language as first-class evidence.
            - Accept documentation such as CRNA, nurse anesthetist, anesthetist, medically directed by, physician medical direction, anesthesia supervision, or equivalent wording when clearly tied to the anesthesia event.
            - Do not infer QX from the mere presence of anesthesia CPTs alone.
            - Do not include QX when the record instead supports personally performed anesthesia, pure supervision without medical direction, or when provider-role attribution is absent.
            - When QX is supported, map it only to anesthesia CPT codes that are actually part of the medically directed anesthesia event.

    # Output Requirements
    - Return ONLY valid JSON matching {{format_instructions}}.
    - Return selected branches only.
    - Each branch item must include only:
      - branch_name
      - eligible_cpt_codes
    - Use `branch_name` exactly as written in the available branch list.
    - `eligible_cpt_codes` must contain only candidate CPT/HCPCS codes from the input.
    - Do not output `evidence`, `assigned`, `unassigned_modifiers`, modifier assignment decisions, rationales, or any extra fields.

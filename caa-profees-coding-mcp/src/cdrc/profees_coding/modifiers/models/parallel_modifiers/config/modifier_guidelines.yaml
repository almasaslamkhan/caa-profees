      ## Modifier 22 (Increased Procedural Services):
      **Definition**: When the work required to provide a service is substantially greater than typically required, it may be identified by adding modifier -22 to the usual procedure code. Documentation must support the substantial additional work and the reason for the additional work (ie, increased intensity, time, technical difficulty of procedure, severity of patient's condition, physical and mental effort required). **Note**: This modifier should not be appended to an E/M service
      
      **How to assign this modifier**: Modifier -22 indicates that the service was greater than usual and required increased physician work above and beyond normal. A special report must accompany the use of modifier -22 to explain how the service was greater. Documentation should indicate the time it usually takes to perform the service and the significant increase in that time due to documented factors. 

      **Example**: If it normally takes 45 minutes to provide the service, but because of the extent and complications 90 minutes was required. Modifier -22 is reported with surgical codes. 

      The use of modifier -22 indicates that the service provided was significantly greater than the service described in the CPT code. A few additional minutes spent on a procedure does not warrant the use of this modifier. The medical record must contain documentation that substantiates that the service was unusual in some way, such as statements about the increased risk to the patient, the difficulty of the procedure, excessive blood loss, or other statements to indicate the occurrence of an unusually difficult situation. Examples include:
        - Excessive blood loss.
        - Extensive well-documented adhesions in abdominal surgery.
        - Trauma extensive enough to complicate the procedure and the complication is not reported separately.
        - Other pathologies, tumors, malformations that directly interfere with the procedure but are not reported separately.
        - The service rendered was significantly more complex than described for the code description.

      Modifier -22 is overused, so it comes under particularly close scrutiny by third-party payers, especially as there is usually a payment increase of 20% to 30% for services that qualify for the use of modifier -22. When reporting modifier -22, be sure that you have the documentation to support the claim. When the third-party payer receives a claim that includes a service to which modifier -22 has been added, the claim is sent to an individual who reviews the claim. Appropriate documentation must therefore accompany the claim—an operative report, a pathology report, office notes, hospital chart notes, and so forth.

      When assigning modifier -22, additional charges are added based on the increase in physician work, and the documentation that supports the higher charge is contained in the medical record.

      Avoid routine use of modifier -22, as the modifier should be reported only when a surgeon provides a service that is greater than usually required and a secondary code that would claim the additional work cannot be reported. The use of specialized technology (e.g., laparoscope or laser) does not automatically qualify for use of modifier -22. Abuse of the modifier will attract unwanted scrutiny. Repeated misuse could trigger an audit.

      Modifier -22 is valid for codes with global periods of 0, 10, or 90 days. Modifier -22 is not valid for “XXX” global period indicators, which includes E/M, radiology, laboratory, pathology, and most medicine codes.

      CMS develops rules to promote correct coding methods and to control improper coding leading to inappropriate payment. CMS develops coding policies based on the CPT manual, national and local policies, coding guidelines developed by national societies, analysis of standard medical and surgical practices, and a review of current coding practices. These rules are only for beneficiaries of government programs, such as Medicare, but many third-party payers have adopted many of the guidelines. Within this text, reference will be made to the CMS rules as follows:

      **CMS RULES**:
      - The Medicare Claims Processing Manual 100-04, Chapter 12, 20.4.6 (www.cms.gov/manuals/downloads/clm104c12.pdf) states that the fees for services represent the average work effort and practice expenses required to provide a service. For any given procedure code, there could be a typical range of work effort and practice expense required to provide the service. Thus carriers may increase or decrease the payment for a service only under very unusual circumstances based upon review of medical records and other supporting documentation.


      ## Modifier 95 (Synchronous Telemedicine Service Rendered Via a Real-Time Interactive Audio and Video Telecommunications System):
      **Definition**: Synchronous telemedicine service is defined as a real-time interaction between a physician or other qualified health care professional and a patient who is located at a distant site from the physician or other qualified health care professional. The totality of the communication of information exchanged between the physician or other qualified health care professional and the patient during the course of the synchronous telemedicine service must be of an amount and nature that would be sufficient to meet the key components and/or requirements of the same service when rendered via a face-to-face interaction. Modifier 95 may only be appended to the services listed in 'Eligible CPT Codes for modifier 95'. 'Eligible CPT Codes for modifier 95' is the list of CPT codes for services that are typically performed face-to-face, but may be rendered via a real-time (synchronous) interactive audio and video telecommunications system.

      **How to assign this modifier**: Modifier 95 is only used when a provider and patient interact from separate locations using real-time, interactive, simultaneous audio and visual components. A full list of codes that can be reported with modifier 95 are listed in 'Eligible CPT Codes for modifier 95'.

      **Eligible CPT Codes for modifier 95**:
      This listing is a summary of CPT codes that are typically rendered in person but may be used for reporting synchronous (real-time) interactive audio-video telemedicine services when appended with modifier 95. Procedures on this list involve electronic communication using interactive telecommunications equipment that includes, at a minimum, audio and video. 

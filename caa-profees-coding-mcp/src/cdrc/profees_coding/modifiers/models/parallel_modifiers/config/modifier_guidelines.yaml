    guidelines: |
      ## Modifier P1 (Anesthesia Physical Status 1 – Normal healthy patient):
      **Definition**: Modifier P1 is appended to anesthesia CPT codes to indicate a **normal, healthy patient** with **no systemic disease**. The patient has no acute or chronic medical conditions and presents no physiological impairment.

      **How to assign this modifier**: Assign Modifier P1 when ALL the following criteria are met:
      1. The service is an **anesthesia CPT code**.
      2. The anesthesia pre-operative assessment explicitly documents **ASA I** or clearly states the patient is healthy with no systemic disease.
      3. There is no documentation of chronic medical conditions or functional limitation.
      4. Exactly one ASA Physical Status modifier (P1–P6) is assigned.

      **Key Points:**
      - P1 reflects **baseline health**, not procedure complexity.
      - Do NOT infer P1 solely because the problem list is empty.
      - If any systemic disease is present, P1 does NOT apply.

      **Examples:**
      - ASA I documented for a healthy patient undergoing elective anesthesia.
      - “Pre-op eval: ASA I, healthy, no comorbidities.”

    compliance_checks: |
      - **Mutual Exclusivity**:
        - Only ONE ASA Physical Status modifier (P1–P6) may be assigned.
      - **Scope**:
        - Do NOT use P1 with non-anesthesia CPT codes.
      - **Inference Guardrail**:
        - Absence of documented disease ≠ confirmation of P1; explicit documentation is required.

    checklist: |
      - ASA Physical Status Checklist:
        - Is the CPT an anesthesia code? Yes/No
        - Is ASA I explicitly documented? Yes/No
        - Are there any chronic or systemic diseases documented? Yes/No
        - If any answer is No/Yes (disease present), do NOT assign P1.

    examples: |
      - Healthy patient, no PMH, ASA I documented → P1 applies
      - Empty problem list but no ASA stated → Do NOT assign P1
  
  "P2":
    guidelines: |
      ## Modifier P2 (Anesthesia Physical Status 2 – Mild systemic disease):
      **Definition**: Modifier P2 indicates a patient with **mild systemic disease** that is **well controlled** and does **not limit functional capacity**.

      **How to assign this modifier**: Assign Modifier P2 when ALL the following criteria are met:
      1. The service is an **anesthesia CPT code**.
      2. ASA II is explicitly documented OR documentation supports mild, controlled disease.
      3. The patient has no substantive functional limitation.
      4. Exactly one ASA Physical Status modifier (P1–P6) is assigned.

      **Key Points:**
      - Common and frequently used modifier.
      - Mild, controlled disease qualifies (e.g., controlled HTN).
      - Do NOT escalate to P3 without functional limitation or severity.

      **Examples:**
      - “ASA II – controlled hypertension.”
      - “ASA 2, mild asthma, no activity limitation.”

    compliance_checks: |
      - **P2 vs P3**:
        - Controlled disease without functional limitation → P2.
        - Poorly controlled or function-limiting disease → NOT P2.
      - **Scope**:
        - Anesthesia CPT codes only.

    checklist: |
      - ASA Physical Status Checklist:
        - Is ASA II explicitly documented? Yes/No
        - If inferred, is disease mild AND controlled? Yes/No
        - Is there any functional limitation documented? Yes/No
        - If limitation exists → consider P3, not P2.

    examples: |
      - Controlled diabetes on oral meds → P2 applies
      - Hypertension with end-organ damage → Do NOT assign P2

  "P3":
    guidelines: |
      ## Modifier P3 (Anesthesia Physical Status 3 – Severe systemic disease):
      **Definition**: Modifier P3 indicates a patient with **severe systemic disease** that **limits activity or function**, but is **not an immediate threat to life**.

      **How to assign this modifier**: Assign Modifier P3 when ALL the following criteria are met:
      1. The service is an **anesthesia CPT code**.
      2. ASA III is explicitly documented OR severe systemic disease with functional limitation is clearly described.
      3. The condition is stable (not life-threatening at the time of anesthesia).
      4. Exactly one ASA Physical Status modifier (P1–P6) is assigned.

      **Key Points:**
      - P3 requires **severity and functional impact**, not just diagnosis count.
      - Overuse of P3 is a common audit finding.
      - Do NOT infer P3 from a problem list alone.

      **Examples:**
      - “ASA III – severe COPD with limited exercise tolerance.”
      - “ASA 3 – ESRD on dialysis.”

    compliance_checks: |
      - **P3 vs P4**:
        - Stable severe disease → P3.
        - Unstable or life-threatening disease → NOT P3.
      - **Inference Guardrail**:
        - Problem list alone is insufficient to assign P3.

    checklist: |
      - ASA Physical Status Checklist:
        - Is ASA III explicitly documented? Yes/No
        - Is severe disease with functional limitation described? Yes/No
        - Is the condition stable (not life-threatening)? Yes/No
        - If unstable → consider P4 instead.

    examples: |
      - CHF with dyspnea on exertion, stable → P3 applies
      - Diabetes listed without severity → Do NOT assign P3

  "P4":
    guidelines: |
      ## Modifier P4 (Anesthesia Physical Status 4 – Severe systemic disease that is a constant threat to life):
      **Definition**: Modifier P4 indicates a patient with **severe systemic disease that is a constant threat to life**, often requiring urgent or emergent anesthesia care.

      **How to assign this modifier**: Assign Modifier P4 when ALL the following criteria are met:
      1. The service is an **anesthesia CPT code**.
      2. ASA IV is explicitly documented OR documentation clearly describes life-threatening instability.
      3. The condition poses a **constant threat to life** at the time of anesthesia.
      4. Exactly one ASA Physical Status modifier (P1–P6) is assigned.

      **Key Points:**
      - P4 should be **rare** and explicitly supported.
      - Never infer P4 from chronic disease alone.
      - Strong audit scrutiny applies to P4 usage.

      **Examples:**
      - “ASA IV – septic shock requiring emergent surgery.”
      - “ASA 4 – acute MI with hemodynamic instability.”

    compliance_checks: |
      - **Hard Stop**:
        - Do NOT assign P4 without explicit instability or life-threatening language.
      - **P3 vs P4**:
        - Severe but stable → P3.
        - Severe and unstable → P4.

    checklist: |
      - ASA Physical Status Checklist:
        - Is ASA IV explicitly documented? Yes/No
        - Is there documentation of life-threatening instability? Yes/No
        - Is the condition acute or decompensated? Yes/No
        - If not explicit → do NOT assign P4.

    examples: |
      - Sepsis with hypotension → P4 applies
      - Stable ESRD patient → Do NOT assign P4

  "GC":
    guidelines: |
      ## Modifier GC (Service Performed in Part by a Resident Under the Direction of a Teaching Physician):
      **Definition**: Modifier GC is appended to CPT codes to indicate that a **resident physician** participated in the service and that a **teaching physician** supervised the service and documented appropriate involvement in accordance with CMS teaching physician rules.

      **How to assign this modifier**: Assign Modifier GC when ALL the following criteria are met:
      1. The service was performed **in part or in full by a resident physician**.
      2. A **teaching physician supervised** the resident’s work.
      3. The teaching physician **personally documented a CMS-compliant attestation**, indicating:
        - presence for key or critical portions of the service, and/or
        - personal involvement and discussion with the resident, and
        - agreement with the resident’s assessment and plan.
      4. The service is otherwise eligible for billing under teaching physician rules.
      5. Modifier GC is appended to the **E/M or procedure code** billed by the teaching physician.

      **Key Points:**
      - GC applies to **both E/M services and procedures**.
      - A **co-signature alone is NOT sufficient** to support GC.
      - Resident participation must be explicit; medical students do NOT qualify.
      - GC reflects **teaching supervision**, not merely trainee presence.

      **Examples:**
      - Resident evaluates patient; attending documents: “I was present for key portions of the visit, discussed the case with the resident, and agree with the plan.”
      - Surgical resident performs procedure with attending present for critical portions and documented supervision.

    compliance_checks: |
      - **Resident Requirement**:
        - The trainee must be a **resident physician**.
        - Do NOT apply GC for medical students, NP/PA trainees, or fellows unless institutional policy treats them as residents under CMS rules.
      - **Attestation Requirement**:
        - Teaching physician must document involvement meeting CMS standards.
        - Generic statements such as “Reviewed and signed” are insufficient.
      - **Scope Check**:
        - GC may be used with E/M and procedural CPT codes, but only when teaching physician rules are met.
      - **Documentation Consistency**:
        - Teaching physician attestation must align with resident involvement described in the note.

    checklist: |
      - Teaching Physician Checklist:
        - Was a **resident physician** involved in the service? Yes/No
        - Is there a **teaching physician attestation** documented? Yes/No
        - Does the attestation describe **presence, supervision, or discussion**? Yes/No
        - Is the attending billing provider the teaching physician? Yes/No
        - If any answer is No → Do NOT assign GC.

    examples: |
      - *Correct use*:
        - Resident note with attending attestation stating presence and agreement → GC applies.
      - *Incorrect use*:
        - Attending-only service → No GC.
        - Medical student note with attending co-signature → No GC.
        - Resident note with “Reviewed and signed” only → No GC.
    
    "QW": 
      guidelines: |
        ## Modifier QW (CLIA-Waived Test):
        **Definition**: Modifier QW indicates a laboratory test is classified as **waived** under the Clinical Laboratory Improvement Amendments (**CLIA**) and was performed in a **CLIA-waived setting**. This modifier is required on **certain lab CPT/HCPCS codes** to show the test was performed under a **CLIA Certificate of Waiver**.

        **How to assign this modifier**:
        Modifier QW is appended to a **lab test CPT/HCPCS code** when ALL of the following are true:
          1) The **test CPT/HCPCS code** is on the **CLIA-waived test list** (per CMS/FDA recognized waiver status), AND
          2) The **performing lab/site** holds an active **CLIA Certificate of Waiver** (or equivalent waiver status appropriate to the payer), AND
          3) The claim line represents the **performance of the waived test** by that waived lab/site (typically in-office/clinic point-of-care testing).

        **Key points**:
        - Documentation (SOAP notes) often does **not** explicitly state “CLIA-waived.” Do **not** rely on narrative alone.
        - QW is best determined from **structured lab metadata**:
          - The **lab CPT code**, the **CLIA-waived status of that code**, and the **performing site’s CLIA certificate type/status**.
        - If the CPT is **not** CLIA-waived, do **not** append QW even if a “rapid test” is mentioned.
        - If the test is CLIA-waived but was performed by a **non-waived lab setting**, do **not** append QW.

      compliance_checks: |
        - **Modifier QW (CLIA-waived lab test):**
          - Apply QW ONLY when:
              a) A laboratory CPT/HCPCS test code is on the claim; AND
              b) That CPT/HCPCS code is present on the **CLIA-waived list** (maintained mapping); AND
              c) The **performing lab/site** has an active **CLIA Certificate of Waiver**; AND
              d) The test was performed by that waived site (not merely reviewed).
          - HARD DISQUALIFIERS (if any are true, DO NOT append QW):
              - The CPT/HCPCS test code is **not** CLIA-waived per mapping/list.
              - CLIA certificate status of the performing site is **unknown, missing, expired, or non-waived**.
              - The test was performed by an external/reference lab and the billing entity is not the waived testing site.
              - Only unstructured note language exists (“rapid test done”) without a qualifying CPT on the claim.
          - NOTES / IMPLEMENTATION:
              - Notes rarely state “CLIA-waived”; decisioning should rely on:
                  1) CPT code ↔ CLIA-waived mapping (from CMS/FDA sources), and
                  2) Performing lab’s CLIA certificate type/status (waiver vs non-waived).
              - Keep the waived-test mapping current; waiver status can change over time.

      checklist: |
        - Modifier QW Checklist:
          - Is there a **lab test CPT/HCPCS code** on the claim? Yes/No (identify code)
          - Is that code **CLIA-waived** per the maintained waived-test list/mapping? Yes/No
          - Is the **performing lab/site** identified and does it have an **active CLIA Certificate of Waiver**? Yes/No
          - Was the test **performed** by that waived site on this DOS (not only reviewed/resulted)? Yes/No
          - If any answer is No/Unclear → Do NOT assign QW.

      examples: |
        - **QW** applies:
          - Rapid strep test **87880-QW** performed in a physician office with CLIA Certificate of Waiver → QW applies.
          - Urine dipstick test (on CLIA-waived list) performed in clinic with active CLIA waiver → QW applies.
        - **QW** does NOT apply:
          - Same test performed in a non-waived lab setting (no CLIA waiver) → No QW.
          - Note says “rapid test done,” but the billed CPT is **not** CLIA-waived → No QW.
          - CLIA certificate status for performing site is missing/unknown → No QW (until validated).

    "PO":
      guidelines: |
        ## Modifier PO (Excepted Off-Campus Outpatient Department Service):
        **Definition**: Modifier PO indicates that services were furnished in an **off-campus, provider-based department of a hospital** that is **excepted (grandfathered)** under Section 603 of the Bipartisan Budget Act of 2015. These departments were established and billing under OPPS **on or before November 1, 2015**, and continue to be paid at **full OPPS rates**.

        **How to assign this modifier**:
        Modifier PO is appended to **facility outpatient service codes** when ALL of the following are true:
          1) The service is billed by a **hospital outpatient department (facility claim)**, AND
          2) The service occurred at an **off-campus, provider-based department**, AND
          3) That department qualifies as **excepted** (established and billing under OPPS on or before **11/01/2015**), AND
          4) The payer requires PO/PN differentiation (e.g., Medicare OPPS).

        **Key points**:
        - PO applies to **facility billing only** (UB-04 / institutional claims).
        - PO does **NOT** apply to professional (physician/QHP) claims.
        - PO and **PN are mutually exclusive**—only one may be reported.
        - Clinical documentation will **never** state “excepted” or “grandfathered.”
        - Assignment must rely on **administrative/location metadata**, not note text.

      compliance_checks: |
        - **Modifier PO (Excepted off-campus HOPD):**
          - Apply PO ONLY when:
              a) The claim is a **facility outpatient claim**; AND
              b) The location of service is an **off-campus hospital-based department**; AND
              c) The department is designated as **excepted** (established ≤ 11/01/2015); AND
              d) The service is eligible for OPPS payment (e.g., clinic visit, ancillary hospital outpatient service).
          - HARD DISQUALIFIERS (if any are true, DO NOT append PO):
              - Professional claim (CMS-1500 / physician billing).
              - On-campus hospital department.
              - Off-campus department established **after** 11/01/2015 (use PN instead).
              - Independent physician office (POS 11).
              - Facility CMS status is unknown or not validated.
          - NOTES:
              - PO/PN determination is **purely administrative**.
              - Narrative documentation should NOT be used as evidence.
              - If facility status cannot be confirmed, default to **no PO** until verified.

      checklist: |
        - Modifier PO Checklist:
          - Is this a **facility (hospital outpatient) claim**? Yes/No
          - Did the service occur in an **off-campus** provider-based department? Yes/No
          - Is the department **excepted** (established on or before 11/01/2015)? Yes/No
          - Is PN also present on the claim? Yes/No (must be No)
          - If any answer is No/Unclear → Do NOT assign PO.

      examples: |
        - **PO** applies:
          - G0463 performed at a hospital-owned off-campus clinic established in 2012 → PO applies.
          - Hospital outpatient imaging service furnished at an excepted off-campus department → PO applies.
        - **PO** does NOT apply:
          - Same service at an off-campus clinic opened in 2019 → Use **PN**, not PO.
          - Service performed in an on-campus hospital department → No PO.
          - Independent physician office visit → No PO.


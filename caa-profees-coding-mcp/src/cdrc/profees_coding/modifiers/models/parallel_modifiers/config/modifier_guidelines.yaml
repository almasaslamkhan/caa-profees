  "52": 
    guidelines: |
      ## Modifier 52 (Reduced Services):
      **Definition**: Under certain circumstances a service or procedure is partially reduced or eliminated at the discretion of the physician or other qualified health care professional. Under these circumstances the service provided can be identified by its usual procedure number and the addition of modifier -52, signifying that the service is reduced. This provides a means of reporting reduced services without disturbing the identification of the basic service. **Note**: For hospital outpatient reporting of a previously scheduled procedure/service that is partially reduced or cancelled as a result of extenuating circumstances or those that threaten the well-being of the patient prior to or after administration of anesthesia, see modifiers 73 and 74 (see modifiers approved for ASC hospital outpatient use).

      **How to assign this modifier**: Modifier -52 is used to indicate that a service was provided but was reduced in comparison to the full description of the service. Turn to Appendix A in the CPT manual and read the description of this modifier.

      An example of a circumstance in which modifier -52 would be reported is a surgical procedure for the removal of an abdominal carcinoma in which the patient was anesthetized and the excision begun but then was terminated by the physician because the metastasis was too far advanced. When modifier -52 is reported, additional documentation, such as operative reports and/or physician explanation of the reason for the reduced service, will speed the reimbursement process, as the third-party payer usually wants to know the reason for the reduction before making payment.

      **Example**: A physician performed a hammer toe correction (28285) but the tendon was already split (the surgeon usually has to perform this), thereby decreasing the work necessary by the surgeon. In this case, only a portion of the usual procedure was completed. The service would be reported with 28285 with modifier -52.

      **Example**: The operative report indicates: “Excision of ischial pressure ulcer, without ostectomy.” Assign 15946 (Excision, ischial pressure ulcer, with ostectomy) with modifier -52. Modifier -52 indicates that all the procedure components were not entirely completed because the code indicated “with ostectomy” and the operative reported stated “without ostectomy.”

      **CODING SHOT**: 
      - Modifier -52 may or may not affect reimbursement. Some payers decrease the payment if the procedure was not completed, and others pay in full once anesthesia has been administered to the patient.

      **CMS RULES**:
      - Do not assign modifier -52 with E/M services. Medicare does not recognize the modifier for this purpose, according to the Medicare Carriers Manual Section 15501. Instead, use unspecified E/M code 94999 and submit documentation that explains why less than the normal service was completed.
  
  "53": 
    guidelines: |
      ## Modifier 53 (Discontinued Procedure):
      **Definition**: Under certain circumstances, the physician or other qualified health care professional may elect to terminate a surgical or diagnostic procedure. Due to extenuating circumstances or those that threaten the well being of the patient, it may be necessary to indicate that a surgical or diagnostic procedure was started but discontinued. This circumstance may be reported by adding modifier -53 to the code reported by the individual for the discontinued procedure. **Note**: This modifier is not used to report the elective cancellation of a procedure prior to the patient's anesthesia induction and/or surgical preparation in the operating suite. For outpatient hospital/ambulatory surgery center (ASC) reporting of a previously scheduled procedure/service that is partially reduced or cancelled as a result of extenuating circumstances or those that threaten the well being of the patient prior to or after administration of anesthesia, see modifiers 73 and 74 (see modifiers approved for ASC hospital outpatient use).

      **How to assign this modifier**: Modifier -52 describes circumstances in which services were reduced at the direction of the physician, whereas modifier -53 describes circumstances in which a procedure was stopped because of the patient's status. 

      An example of the correct assignment of modifier -53 would be when a patient had received anesthesia and the procedure was under way. The patient then developed arrhythmia that could not be controlled. The physician discontinued the procedure because of the risk continuation presented to the patient. The code for the surgical procedure would be reported along with modifier -53 to indicate that although the procedure was begun, it was discontinued due to the patient's status. The key to proper reporting of modifier -53 is that the patient has been prepared for surgery, anesthetized, and the surgeon discontinued the procedure.

      Modifier -53 is not used to report services:
        - When the patient cancels the procedure
        - With E/M codes
        - With any code that is based on time (e.g., critical care codes)

      Attach a cover note and state the percentage of the procedure that was completed and why the procedure had to be stopped. For example, “Only 50% of procedure was completed. The procedure was stopped because patient developed arrhythmia that could not be controlled.”

      **CMS RULES**:
      - Modifier -53 should be used to report a failed or terminated colonoscopy. When a colonoscopy is attempted, but not completed, it should not be reported as a sigmoidoscopy but as discontinued colonoscopy procedure 45378-53.

  "57": 
    guidelines: |
      ## Modifier 57 (Decision for Surgery):
      **Definition**: An evaluation and management service that resulted in the initial decision to perform the surgery may be identified by adding modifier 57 to the appropriate level of E/M service.

      **How to assign this modifier**: Modifier 57 is reported with an E/M code to indicate the day the decision to perform a major surgery was made. Modifier 57 can be reported not only with E/M codes (99202-99499) to indicate the initial decision to perform a procedure or service but also with the ophthalmologic codes (92002-92014) located in the Medicine section. Modifier 57 requests payment for an E/M service outside of the global package for a major procedure when the decision to perform the surgery was made during the E/M service.

      At the present time, not all modifiers are recognized by all third-party payers. Some third-party payers have agreed to pay a physician separately from the surgical package for the initial evaluation of a condition during which the decision to perform surgery was made. Modifier 57 is used to let the payer know that payment for this initial evaluation should be made in addition to payment for surgery.

      E/M services provided the day before or the day of a major surgery are included in the global package. There are some exceptions, such as when the service is the patient's initial visit to the physician. To receive payment for these initial visits, modifier 57 is reported to indicate the decision for surgery was made the day before or the day of the major procedure and modifier 25 is used to indicate the day of a minor procedure.

      **Example**: A patient presents with acute appendicitis, and the surgeon decides to operate.

  "58":
    guidelines: |
      ## Modifier 58 (Staged or Related Procedure or Service by the Same Physician or Other Qualified Health Care Professional During the Postoperative Period):
      **Definition**: It may be necessary to indicate that the performance of a procedure or service during the postoperative period was: (a) planned or anticipated (staged); (b) more extensive than the original procedure; or (c) for therapy following a surgical procedure. This circumstance may be reported by adding modifier -58 to the staged or related procedure. **Note**: For treatment of a problem that requires a return to the operating/procedure room (eg, unanticipated clinical condition), see modifier -78.

      **How to assign this modifier**: Modifier -58 notifies the payer that a subsequent surgery was planned or staged at the time of the first surgery.

      The procedure must have been intended to include the original procedure plus one or more subsequent procedures. For example, multiple skin grafts are often done in stages to allow adequate healing time between procedures. The modifier is added to the subsequent submissions of the code when the second or related service is performed during the global period to inform the third-party payer that the service was staged. 

      Modifier -58 can also be used if a therapeutic procedure is performed because of the findings of a diagnostic procedure. 
      **Example**: a patient may have a surgical breast biopsy, and if the pathology report indicates that the specimen is malignant, the patient may elect to have an immediate radical mastectomy. The mastectomy may be performed during the postoperative period of the biopsy. 

      Modifier -58 indicates to the third-party payer that the second surgery was therapeutic treatment that followed the original diagnostic procedure, and full payment would usually be made for the mastectomy. A new postoperative period would start after the mastectomy, and any postoperative care provided to the patient would be part of the surgical package for the mastectomy.

      **CODING SHOT**:
      Modifier -58 requests full payment for a subsequent procedure that may have been planned in follow-up, at the time of the first surgery, or performed as a more extensive procedure subsequent to the first surgery. A new global period begins with each subsequent procedure modified with -58.

      **Example**: A lesion was excised and determined to be malignant. The patient was returned to the operating room a few days later for a re-excision of the malignancy. Report the re-excision with modifier -58 because the second procedure was performed within the global period of the first procedure and related to the first procedure.

      **Example**: A patient required a toe amputation due to gangrene. On follow-up, the surgeon determined the patient requires further amputation, this time of his entire foot because the original procedure did not completely remove the gangrenous tissue. If the second amputation occurs within the postoperative period of the first amputation, the second amputation would be reported with modifier -58 as it is related to the first procedure.
      

  "59": 
    guidelines: |
      ## Modifier 59 (Distinct Procedural Service):
      **Definition**: Under certain circumstances, it may be necessary to indicate that a procedure or service was distinct or independent from other non-E/M services performed on the same day. Modifier 59 is used to identify procedures/services, other than E/M services, that are not normally reported together, but are appropriate under the circumstances. Documentation must support a different session, different procedure or surgery, different site or organ system, separate incision/excision, separate lesion, or separate injury (or area of injury in extensive injuries) not ordinarily encountered or performed on the same day by the same individual. However, when another already established modifier is appropriate it should be used rather than modifier 59. Only if no more descriptive modifier is available, and the use of modifier 59 best explains the circumstances, should modifier 59 be used. Note: Modifier 59 should not be appended to an E/M service. To report a separate and distinct E/M service with a non-E/M service performed on the same date, see modifier 25.

      **How to assign this modifier**: Modifier 59 is reported to indicate that services that are usually bundled into one payment were provided as separate services. Turn to Appendix A in the CPT manual and read the description of this modifier. As the code description notes, modifier 59 is used to identify the following:

      - Different session
      - Different procedure or surgery
      - Different site or organ system
      - Separate incision/excision
      - Separate lesion
      - Separate injury or area of injury in extensive injuries

      Modifier 59 is reported with codes from all sections of the CPT manual except E/M codes.

      **CMS RULES**: Medicare has lists of codes that cannot be reported together called National Correct Coding Initiative (NCCI edits). These edits have been established to ensure that providers do not report services that are included in a pre-established bundle. For example, the same physician would not report a standard preoperative visit related to a major surgical procedure and then report separately the surgery and follow-up care. All three services—preoperative, intraoperative, postoperative—are bundled together in one major surgical CPT code. The use of modifier 59 indicates that the service was not a part of another service but, indeed, was a distinct service. For example, a colonoscopy utilizing a snare (45385) and a colonoscopy with hot biopsy forceps (45384) would usually not be reported together because both codes would be in the edits, but if 59 was appended to 45384, the surgeon would be indicating that distinct services were provided.

    compliance_checks: |
      - **Modifier 59 / X{EPSU} (Distinct procedural service):** NCCI bundling? Distinct anatomical site, encounter, or session?
    
    examples: |
      - **59**: 29880 + 29877-59 (Distinct procedure/location to avoid bundling denial).


      ## Modifier 51 (Multiple Procedures):
      **Definition**: When multiple procedures, other than E/M services, Physical Medicine and Rehabilitation services or provision of supplies (eg, vaccines), are performed at the same session by the same individual, the primary procedure or service may be reported as listed. The additional procedure(s) or service(s) may be identified by appending modifier -51 to the additional procedure or service code(s). Note: This modifier should not be appended to designated “add-on” codes (see 'Add-On Procedures').

      **How to assign this modifier**: 
      During any given operative session, more than one procedure may be performed. This is referred to as “multiple procedures” and is indicated by modifier -51.

      Assign modifier -51 when multiple procedures, other than the E/M services, are performed on the same day or at the same session by the same provider. When reporting multiple surgeries, the primary procedure (the procedure with the highest relative value unit) should be listed first on the claim.

      **Example**: A benign skin lesion is excised from a patient's chest (diameter over 4.0 cm) and closure of the defect using layered closure. The service is reported with 11406 (Excision, benign lesion including margins, except skin tag [unless listed elsewhere], trunk, arms or legs; excised diameter over 4.0 cm) and 12032-51 (Layer closure of wounds of scalp, axillae, trunk and/or extremities [excluding hands and feet]; 2.6 cm to 7.5 cm).

      You have to be careful when coding multiple procedures because CPT codes include many different procedures bundled together in one code. For example, code 58200 is a total abdominal hysterectomy, but it also includes a partial vaginectomy (removal of the vagina) with para-aortic and pelvic lymph node sampling, with or without removal of tube(s), and with or without removal of ovary(ies). It would be incorrect to report each service separately because they are included (bundled) in the description for code 58200. Listing the subsequent procedures separately (unbundling) is considered fraud by a third-party payer. Unbundling is assigning multiple codes when one code would fully describe the service or procedure. The assigning of multiple codes results in increased reimbursement.

      However, if one code does not describe all of the procedures performed, and the secondary procedure is not considered a minor procedure that is incidental to the major procedure (and therefore bundled into the major procedure), each additional procedure may be reported by using the multiple procedure modifier (-51). For example, a patient has a laminectomy with lumbar disc removal (for a herniated disc), reported with 63030. The patient also has an arthrodesis (stabilization of the area where the disc was removed), reported with 22612. Both services would be reported, and modifier -51 would be added to the lesser of the two services.

      There are three significant times when multiple procedures are reported:
      1. Same operation, different site
      2. Multiple operation(s), same operative session
      3. Procedure performed multiple times

      a) **Same procedure, different site**:
      Multiple procedures are reported using modifier -51 when the same procedure is performed on different sites. 
      **Example**: a patient has an excision of a 1.5-cm benign lesion from the forearm and at the same time has an excision of a 3-cm benign lesion from the neck. In this case, the reporting would be 11423 for the 3-cm lesion and 11402-51 for the 1.5-cm lesion. List the most resource-intensive (expensive) procedure first, without a modifier.
        
      **Example**:
      The payer reimburses $175.96 for 11423 and $140.54 for 11402. The difference in reimbursement is significant based on the order of the codes.
          - 11423, 11402-51 = $175.96 + $70.27 (50% of $140.54) payment is $246.23
          - 11402, 11423-51 = $140.54 + $87.98 (50% of $175.96) payment is $228.52
      The difference in reimbursement is $17.71 for submission of just these two services in an incorrect order.

      b) **Procedure performed multiple times**:
      Multiple procedures are also reported when the same procedure code identifies a service performed more than once during a single operative session. There are two ways to report procedures performed multiple times, depending on the requirements of the third-party payer. One way is to use the code number only once but to list the number of times it is performed (number of units). For example, if a patient had a repair of two flexor tendons of the leg, you would report 27658 × 2 units. Units are used because the code description states “each” tendon, and two tendons were repaired. The other way to code this would be to list 27658 once without a modifier and again with modifier -51 (i.e., 27658-51).

      Third-party payers require submission of codes in various formats with various modifiers. HCPCS (Healthcare Common Procedure Coding System) modifiers indicate the right side (-RT) and left side (-LT) and the system also has modifiers that indicate the digits of the foot and hand:

        | Code | Description              | Code | Description              |
        |------|--------------------------|------|--------------------------|
        | FA   | Left hand, thumb         | TA   | Left foot, great toe     |
        | F1   | Left hand, second digit  | T1   | Left foot, second digit  |
        | F2   | Left hand, third digit   | T2   | Left foot, third digit   |
        | F3   | Left hand, fourth digit  | T3   | Left foot, fourth digit  |
        | F4   | Left hand, fifth digit   | T4   | Left foot, fifth digit   |
        | F5   | Right hand, thumb        | T5   | Right foot, great toe    |
        | F6   | Right hand, second digit | T6   | Right foot, second digit |
        | F7   | Right hand, third digit  | T7   | Right foot, third digit  |
        | F8   | Right hand, fourth digit | T8   | Right foot, fourth digit |
        | F9   | Right hand, fifth digit  | T9   | Right foot, fifth digit  |

      You will find some of the more common HCPCS modifiers on the front inside cover of the Professional Edition of the CPT manual. HCPCS modifiers add specificity and, for that reason, are required by many payers.

      **CODING SHOT**: 
      - For the purposes of this text, HCPCS modifiers are listed in ascending alphabetic order when added to a code. For example, -AK-GT. If there are also CPT modifiers added to the code, list the CPT modifiers first (highest to lowest) followed by the HCPCS modifiers (ascending alphabetic order).
      - As always, be aware that the payers dictate how providers are to submit for payment of services. For example, some payers may not want providers to submit modifier -51 for the same operation performed on different sites but instead, modifier -59 (Distinct Procedural Service). Usually, however, the standard is to require -51 for the three significant times when multiple procedures are provided.

      **CMS RULES**:
      - After the first eligible procedure is reimbursed at 100% of Medicare's allowance, the remaining procedures are reimbursed at 50% up to four additional procedures. No documentation is required. After the fifth procedure, the procedures will be considered “by report,” and documentation is then required. (Medicare Claims Processing Manual, Chapter 12, 40.6. www.cms.gov/Regulations-and-Guidance/Guidance/Manuals/Downloads/clm104c12.pdf)
      - For all Medicare claims, the modifiers specifying the digit must be reported.

      **CAUTION**: 
      - Modifier -51 is not used with add-on codes that specify “each additional....”

      **Add-On Procedures**: Modifier -51 must NEVER be used with codes classified as add-on procedures:

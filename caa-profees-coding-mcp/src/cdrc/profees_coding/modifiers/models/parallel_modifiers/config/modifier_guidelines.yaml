    guidelines: |
      ## Modifier 57 (Decision for Surgery):
      **Definition**: An evaluation and management service that resulted in the initial decision to perform the surgery may be identified by adding modifier 57 to the appropriate level of E/M service.

      **How to assign this modifier**: Modifier 57 is reported with an E/M code to indicate the day the decision to perform a major surgery was made. Modifier 57 can be reported not only with E/M codes (99202-99499) to indicate the initial decision to perform a procedure or service but also with the ophthalmologic codes (92002-92014) located in the Medicine section. Modifier 57 requests payment for an E/M service outside of the global package for a major procedure when the decision to perform the surgery was made during the E/M service.

      At the present time, not all modifiers are recognized by all third-party payers. Some third-party payers have agreed to pay a physician separately from the surgical package for the initial evaluation of a condition during which the decision to perform surgery was made. Modifier 57 is used to let the payer know that payment for this initial evaluation should be made in addition to payment for surgery.

      E/M services provided the day before or the day of a major surgery are included in the global package. There are some exceptions, such as when the service is the patient's initial visit to the physician. To receive payment for these initial visits, modifier 57 is reported to indicate the decision for surgery was made the day before or the day of the major procedure and modifier 25 is used to indicate the day of a minor procedure.

      **Example**: A patient presents with acute appendicitis, and the surgeon decides to operate.


  "78":
    guidelines: |
      ## Modifier 78 (Unplanned Return to the Operating/Procedure Room by the Same Physician or Other Qualified Health Care Professional Following Initial Procedure for a Related Procedure During the Postoperative Period):
      **Definition**: It may be necessary to indicate that another procedure was performed during the postoperative period of the initial procedure (unplanned procedure following initial procedure). When this procedure is related to the first, and requires the use of an operating/procedure room, it may be reported by adding modifier -78 to the related procedure. (For repeat procedures, see modifier -76.)
      
      **How to assign this modifier**: Modifier -78 is assigned to indicate a circumstance in which a patient is returned to the operating room for surgical treatment of a complication that resulted from the first procedure. 

      Modifier -78 is appended to the subsequent procedure code to indicate to the third-party payer that the second surgery was necessary because of complications resulting from the first operation. For many third-party payers, only the surgery portion (intraoperative) of the surgical package is paid when the -78 modifier is reported. The patient remains within the postoperative period of the first operation for any further preoperative or postoperative care. For example, if the patient were to develop a second set of complications stemming from the original surgery, you would again report the procedure performed to treat the second complication and add modifier -78 to the code. This way, the third-party payer continues to know that the complication requiring surgery originated from the original surgery during the global period.

      **CAUTION**:
      - If there were a complication, you would report -78 (Unplanned Return to the Operating/Procedure Room) and -76 (Repeat Procedure or Service by Same Physician or Other Qualified Health Care Professional). For example, if a patient who has an open heart coronary artery bypass graft procedure (Service 1) returns to the operating room for tamponade (fluid accumulation in the pericardium) twice on the same day (Services 2 and 3), modifier -76 would be appended to the procedure as follows:
        - Service 1: 33510,    Coronary artery bypass graft
        - Service 2: 35820-78, Exploration for postoperative hemorrhage, chest
        - Service 3: 35820-78-76, Repeat exploration for postoperative hemorrhage, chest
      Services 2 and 3 procedures should be reimbursed at the intraoperative rate, but the global period would continue from the first session and would not start over again.

      **CODING SHOT**:
      - Modifier -78 will cue the payer to reimburse the procedure at the intraoperative percent of the service. The patient remains in the global period for the initial surgery.

      An “operating/procedure” room is defined as a place of service specifically equipped and staffed for the sole purpose of performing procedures. For example, a cardiac catheterization suite, a laser suite, or an endoscopy suite. It does not include a patient's room, a minor treatment room, a recovery room, or intensive care unit (unless the patient's condition was so critical there was insufficient time for transport to an operating room).

  "79": 
    guidelines: |
      ## Modifier 79 ((Unrelated Procedure or Service by the Same Physician or Other Qualified Health Care Professional During the Postoperative Period)
      **Definition**:The individual may need to indicate that the performance of a procedure or service during the postoperative period was unrelated to the original procedure. This circumstance may be reported by using modifier -79. (For repeat procedures on the same day, see modifier -76.)
      
      **How to assign this modifier**: Modifier -79 explains that a patient requires surgery for a condition totally unrelated to the condition for which the first operation was performed. 

      **Example**: The patient had an appendectomy and 2 weeks later had a gallbladder episode that necessitates removal of the gallbladder. Modifier -79 would be placed on the cholecystectomy code, indicating that the subsequent procedure was unrelated to the first procedure. The diagnosis codes for the two procedures would also be different, further indicating the two procedures were unrelated.

      **CAUTION**:
      - Do not use modifier -79 with staged procedures (use modifier -58) or with procedures that are related to the original procedure. If the service is provided during the postoperative period of a major surgical procedure, billing separately for services included in the surgical package is fraudulent.

      **CODING SHOT**:
      - Modifier -79 requests payment for the full fee of the subsequent service because it was unassociated with the first procedure. A new global period should start when -79 is submitted.

  "90": 
    guidelines: |
      ## Modifier 90 (Reference (Outside) Laboratory):
      **Definition**: When laboratory procedures are performed by a party other than the treating or reporting physician or other qualified health care professional, the procedure may be identified by adding modifier 90 to the usual procedure number.

      **How to assign this modifier**: Modifier 90 is used to indicate that services of an outside laboratory were used. This modifier is reported with Pathology and Laboratory codes to report that the procedures were performed by someone other than the treating or reporting physician.

  "93": 
    guidelines: |
      ## Modifier 93 (Synchronous Telemedicine Service Rendered Via Telephone or Other Real-Time Interactive Audio-Only Telecommunications System):
      **Definition**: Synchronous telemedicine service is defined as a real-time interaction between a physician or other qualified health care professional and a patient who is located away at a distant site from the physician or other qualified health care professional. The totality of the communication of information exchanged between the physician or other qualified health care professional and the patient during the course of the synchronous telemedicine service must be of an amount and nature that is sufficient to meet the key components and/or requirements of the same service when rendered via a face-to-face interaction.

      **How to assign this modifier**: Modifier 93 is only used when a patient interaction is from a distant site from the provider, while utilizing audio-only telecommunications.

    compliance_checks: |
      - **Telehealth (Modifier 95) vs Audio-only (Modifier 93):** Real-time **audio+video** (95) vs **audio-only** (93). Do **not** use 95 for audio-only.
    
    examples: |
      - **93**: 99442-93 (Audio-only telehealth).  

  "95": 
    guidelines: |
      ## Modifier 95 (Synchronous Telemedicine Service Rendered Via a Real-Time Interactive Audio and Video Telecommunications System):
      **Definition**: Synchronous telemedicine service is defined as a real-time interaction between a physician or other qualified health care professional and a patient who is located at a distant site from the physician or other qualified health care professional. The totality of the communication of information exchanged between the physician or other qualified health care professional and the patient during the course of the synchronous telemedicine service must be of an amount and nature that would be sufficient to meet the key components and/or requirements of the same service when rendered via a face-to-face interaction. Modifier 95 may only be appended to the services listed in 'Eligible CPT Codes for modifier 95'. 'Eligible CPT Codes for modifier 95' is the list of CPT codes for services that are typically performed face-to-face, but may be rendered via a real-time (synchronous) interactive audio and video telecommunications system.

      **How to assign this modifier**: Modifier 95 is only used when a provider and patient interact from separate locations using real-time, interactive, simultaneous audio and visual components. A full list of codes that can be reported with modifier 95 are listed in 'Eligible CPT Codes for modifier 95'.

      **Eligible CPT Codes for modifier 95**:
      This listing is a summary of CPT codes that are typically rendered in person but may be used for reporting synchronous (real-time) interactive audio-video telemedicine services when appended with modifier 95. Procedures on this list involve electronic communication using interactive telecommunications equipment that includes, at a minimum, audio and video. 

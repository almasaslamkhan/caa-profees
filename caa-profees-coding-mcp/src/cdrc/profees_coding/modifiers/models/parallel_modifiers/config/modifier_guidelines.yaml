    guidelines: |
      ## Modifier 90 (Reference (Outside) Laboratory):
      **Definition**: When laboratory procedures are performed by a party other than the treating or reporting physician or other qualified health care professional, the procedure may be identified by adding modifier 90 to the usual procedure number.

      **How to assign this modifier**: Modifier 90 is used to indicate that services of an outside laboratory were used. This modifier is reported with Pathology and Laboratory codes to report that the procedures were performed by someone other than the treating or reporting physician.

  "93": 
    guidelines: |
      ## Modifier 93 (Synchronous Telemedicine Service Rendered Via Telephone or Other Real-Time Interactive Audio-Only Telecommunications System):
      **Definition**: Synchronous telemedicine service is defined as a real-time interaction between a physician or other qualified health care professional and a patient who is located away at a distant site from the physician or other qualified health care professional. The totality of the communication of information exchanged between the physician or other qualified health care professional and the patient during the course of the synchronous telemedicine service must be of an amount and nature that is sufficient to meet the key components and/or requirements of the same service when rendered via a face-to-face interaction.

      **How to assign this modifier**: Modifier 93 is only used when a patient interaction is from a distant site from the provider, while utilizing audio-only telecommunications.

    compliance_checks: |
      - **Telehealth (Modifier 95) vs Audio-only (Modifier 93):** Real-time **audio+video** (95) vs **audio-only** (93). Do **not** use 95 for audio-only.
    
    examples: |
      - **93**: 99442-93 (Audio-only telehealth).  


      ## Modifier 24 (Unrelated Evaluation and Management Service by the Same Physician or Other Qualified Health Care Professional During a Postoperative Period):
      **Definition**: The physician or other qualified health care professional may need to indicate that an evaluation and management service was performed during a postoperative period for a reason(s) unrelated to the original procedure. This circumstance may be reported by adding modifier 24 to the appropriate level of E/M service.

      **How to assign this modifier**: Modifier 24 is used only with E/M codes. Modifier 24 reports services that were performed during a postoperative period but were unrelated to recovery from the surgical procedure. Surgical procedures have a package of services, such as preoperative, procedure (intraoperative), and normal follow-up care. If an E/M service unrelated to the surgical procedure is provided to a patient during the postoperative period, the third-party payer would think that the service was part of the surgical package and deny payment. Modifier 24 is added to indicate that the E/M service was not part of the surgical package (global period) but was an unrelated service. The postoperative period of a major surgical procedure is usually 90 days; a minor surgery, 10 days. Payment for the surgical procedure includes postoperative care of the patient during these periods.

      You can also use modifier 24 with the General Ophthalmological Service codes 92002-92014 for eye evaluations, even though these codes are located in the Medicine section. Ophthalmologists report new and established medical examinations using 92002-92014.

      **Example**: A male patient is within the 10-day global period for an incision and drainage of a skin abscess. The patient presents to the physician's office for a wound check and also to ask the physician to evaluate a mole on his chest that has changed color. The postoperative visit is reported with 99024 (no charge code), and the evaluation of the mole is reported with 9921X-24 to indicate a medically necessary E/M service unrelated to the incision and drainage of the skin abscess. The diagnosis code reported with the E/M service for the mole would indicate the medical necessity of the service, such as D23.5 for a benign neoplasm of the skin of the chest wall.
    
    compliance_checks: |
      - **Modifier 24 (Unrelated E/M during global period):** 
        - Apply only when the operating surgeon provides an unrelated E/M during an active global period for their own procedure. Different providers should NOT append 24 to their E/M.

    examples: |
      - **24**: 99213-24 (E/M during global period for unrelated problem).


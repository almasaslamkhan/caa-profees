    guidelines: |
      ## Modifier 26 (Professional Component):
      **Definition**: Certain procedures are a combination of a physician or other qualified health care professional component and a technical component. When the physician or other qualified health care professional component is reported separately, the service may be identified by adding modifier 26 to the usual procedure number.

      **How to assign this modifier**: Modifier 26 is used to designate the professional (physician) component of procedures that have both professional and technical (technician + equipment, modifier -TC) components, such as the interpretation of ultrasounds or x-rays. Modifier 26 is usually used with radiology service because radiology services often have two components—professional component and technical component. An example of the technical component is an independent radiology facility that takes the x-rays (technical component) and sends them to a private radiologist who reads the x-rays and writes a report of the findings (professional component). The physician’s services would be reported with modifier 26 added to the code for the x-ray, indicating that only the professional component of the x-ray service was provided, as in the following:

      **Example**: A 35-year-old white female was seen in the emergency department following a fall from a horse. She complained of pain in her right clavicle and shoulder. The emergency physician ordered a complete x-ray of the clavicle. The radiologist provided the report with a diagnosis of a fractured clavicle. The physician component of the x-ray for the radiologist would be reported with 73000-26.

    compliance_checks: |
      **Modifier 26 (Professional component for diagnostic tests/radiology)**:
        - Apply 26 ONLY when:
            a) A radiology/diagnostic CPT is on the claim; AND
            b) The rendering physician/QHP provided ONLY the professional interpretation; AND
            c) There is a separate, distinct, signed written interpretation/report; AND
            d) The technical component (equipment, image acquisition) was provided by another party (not this physician/QHP).
        - HARD DISQUALIFIERS (if any are true, DO NOT append 26):
            - The practice provided both technical and professional components (bill global, no 26).
            - Only review/summary of images/results is documented in the E/M (e.g., “X-ray shows …”) without a separate signed interpretation/report.
            - No radiology/diagnostic CPT is being submitted for this DOS.
            - It is unclear who provided the technical component or whether a separate report exists.
        - NOTES:
            - Reviewing outside imaging within an E/M does not justify billing a radiology CPT or appending 26.
            - If the study was done in-office with practice-owned equipment and interpreted by the reporting provider, bill global (no 26/TC).

    checklist: |
      - Modifier 26 (apply only when a radiology/diagnostic CPT is present):
        - Radiology/diagnostic CPT on the claim? Yes/No (identify code from CPT list)
        - Technical component done by another party (not this physician/QHP)? Yes/No (with evidence from note/orders)
        - Professional interpretation by this physician/QHP with a separate, signed report? Yes/No (with evidence from note/orders)
        - If any answer is No or Unclear, do not assign 26. Consider global or no radiology billing as appropriate.

    examples: |
      - **26**: 
        - 73610-26 when only the interpretation was provided with a separate signed report; TC billed by imaging facility
          - No 26: In-office X-ray with practice-owned equipment and physician interpretation → bill global (no 26/TC).
          - No radiology billing: Outside images reviewed; findings summarized in E/M without a separate signed report
        

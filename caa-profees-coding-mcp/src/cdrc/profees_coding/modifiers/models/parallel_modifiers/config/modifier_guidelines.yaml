      ## Modifier 59 (Distinct Procedural Service):
      **Definition**: Under certain circumstances, it may be necessary to indicate that a procedure or service was distinct or independent from other non-E/M services performed on the same day. Modifier 59 is used to identify procedures/services, other than E/M services, that are not normally reported together, but are appropriate under the circumstances. Documentation must support a different session, different procedure or surgery, different site or organ system, separate incision/excision, separate lesion, or separate injury (or area of injury in extensive injuries) not ordinarily encountered or performed on the same day by the same individual. However, when another already established modifier is appropriate it should be used rather than modifier 59. Only if no more descriptive modifier is available, and the use of modifier 59 best explains the circumstances, should modifier 59 be used. Note: Modifier 59 should not be appended to an E/M service. To report a separate and distinct E/M service with a non-E/M service performed on the same date, see modifier 25.

      **How to assign this modifier**: Modifier 59 is reported to indicate that services that are usually bundled into one payment were provided as separate services. Turn to Appendix A in the CPT manual and read the description of this modifier. As the code description notes, modifier 59 is used to identify the following:

      - Different session
      - Different procedure or surgery
      - Different site or organ system
      - Separate incision/excision
      - Separate lesion
      - Separate injury or area of injury in extensive injuries

      Modifier 59 is reported with codes from all sections of the CPT manual except E/M codes.

      **CMS RULES**: Medicare has lists of codes that cannot be reported together called National Correct Coding Initiative (NCCI edits). These edits have been established to ensure that providers do not report services that are included in a pre-established bundle. For example, the same physician would not report a standard preoperative visit related to a major surgical procedure and then report separately the surgery and follow-up care. All three services—preoperative, intraoperative, postoperative—are bundled together in one major surgical CPT code. The use of modifier 59 indicates that the service was not a part of another service but, indeed, was a distinct service. For example, a colonoscopy utilizing a snare (45385) and a colonoscopy with hot biopsy forceps (45384) would usually not be reported together because both codes would be in the edits, but if 59 was appended to 45384, the surgeon would be indicating that distinct services were provided.

    compliance_checks: |
      - **Modifier 59 / X{EPSU} (Distinct procedural service):** NCCI bundling? Distinct anatomical site, encounter, or session?
    
    examples: |
      - **59**: 29880 + 29877-59 (Distinct procedure/location to avoid bundling denial).


              Add Z99.81 - Dependence on supplemental oxygen if
                - The patient requires ongoing supplemental oxygen
                - Oxygen is used chronically or continuously, at home or long-term
                - The dependence exists at the time of the encounter
                - Common documentation cues: “On home O₂”, “Oxygen dependent”, “Chronic oxygen therapy”, Uses 2 L NC continuously / at night / PRN for exertion”. PRN or nocturnal use still qualifies if it represents an ongoing need.
              Do NOT add Z99.81 when Oxygen is temporary or short-term (Post-op recovery, Acute pneumonia, In-hospital oxygen only), Oxygen is given solely during a procedure OR The note only states “hypoxia” without oxygen dependence

              Add Z99.89 — Dependence on other enabling machines and devices if 
                - The patient is dependent on a device that supports bodily function
                - The device is not oxygen (Z99.81) and not classified elsewhere
                - The dependence is ongoing
                - Common qualifying devices: CPAP / BiPAP (sleep apnea), Tracheostomy ventilation (when not coded under Z93), Dialysis machines (if not more specifically coded), Other life-supporting assistive devices without a dedicated Z-code
                - Common Documentation Cues: “CPAP dependent”, “Uses BiPAP nightly”, “Ventilator dependent”, “Device-dependent for respiration”

          - Only INCLUDE generic or unspecified screening codes (such as Z13.9) if a specific target condition or test is not identified in the documentation.
          - Assign multiple, distinct screening Z-codes only when separate preventive services are documented, ensuring each code represents a unique screening activity. Do not assign two screening codes for the same screening intent/test.
          - Assign screening Z-codes only when there is explicit evidence of asymptomatic preventive screening. If a diagnostic test or procedure is performed to evaluate symptoms, complaints, or findings, assign the most appropriate problem, symptom, diagnosis, or follow-up code instead of a screening Z-code.

        4.3. General exam and ancillary lab screening codes
        - Screening Z-codes (Z12.*, Z13.*, Z30.*, Z11.*, Z23, etc.) should be prioritized when:
          - Screening is the primary reason for the visit or a distinct A/P item (e.g., “Encounter for IUD insertion and reinsertion”, “lung cancer screening with LDCT”, “Pap smear done today”, “screening colonoscopy”).

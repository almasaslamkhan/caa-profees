          - INCLUDE the relevant Z13.* code unless documentation clearly identifies a diagnostic, symptom, or problem-based reason for use.  
          - If the tool is administered because of a reported symptom, complaint, or pre-existing condition (not preventive screening), assign the appropriate symptom/problem/diagnosis code rather than a screening Z-code.

        4.5. Routine check for preventive screening opportunities
        - Review each encounter for mention of common, age-appropriate preventive screenings (e.g., breast, cervical, colon, lipids, diabetes, depression) in the history, orders, or structured screening/results sections.
          - Apply rules from 4.2 and 4.3 regarding when to assign the Z-code for any age-appropriate screening ordered or performed.

        4.6. Family and personal history Z-codes
        - Assign Z80-Z87 (family or personal history) codes only when such history is explicitly referenced and is clinically relevant to the current preventive care or screening rationale, not solely because it is present in the problem list.


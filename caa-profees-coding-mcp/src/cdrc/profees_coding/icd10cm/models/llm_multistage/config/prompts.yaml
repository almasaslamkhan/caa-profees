        - Code symptoms only when: They are a chief complaint, and They are evaluated or managed as a separate problem.
        - Avoid redundant or overlapping codes unless guidelines support both.
        - Use combination codes only when documentation explicitly links conditions.

        ## Specificity Principles
        - Assign the most specific code supported by documentation (site, laterality, acuity, chronicity). Evidence in HPI should also be considered (e.g. discomfort in both ears implies bilaterality).
        - Do not infer specificity that is not clearly stated.
        - Respect provider-chosen unspecified codes unless documentation clearly supports a more specific alternative.

        ## Z-Codes and Encounter Context
        - Include encounter, screening, counseling, history, status, and long-term therapy Z-codes when explicitly documented and relevant.
        - Counseling counts as MEAT when education, advice, or counseling is documented.
        - Preventive and screening Z-codes require clear preventive intent and supporting actions (orders, tools, services).

        ## History and Status
        - Use history Z-codes only for resolved conditions.
        - Use long-term therapy/status Z-codes when medications are continued without active disease management.

        ## External Causes and Context Codes
        - Assign external cause, place, and activity codes only when clearly documented. If injury mechanism and activity are documented in HPI, include external cause activity code when supported.”
        - Prefer the most specific supported option; do not invent missing details.
        - If work-related injury is documented (e.g., WC claim, ‘at work’), assign Y99.0 and place/activity codes when supported.


        ## Labs, Imaging, and Incidental Findings
        - Code abnormal results only when interpreted as problems or included in A/P.
        - Do not code incidental or baseline findings without active clinical relevance.

        ## Final Output Standard
        - Codes must be: Clinically justified, Non-duplicative, Consistent with ICD-10-CM outpatient guidelines and Directly supported by the encounter documentation
        - For each code extracted, output a one-sentence, non-leading and concise justification.

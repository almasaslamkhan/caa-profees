        - Include clearly supported, guideline-compliant codes that are relevant today.
        - Exclude problems mentioned only in history, problem lists, or incidental findings unless they meet MEAT criteria.

        ## Primary Sources of Truth
        - Assessment / Plan (A/P) is authoritative.
          - Include provider-listed diagnoses by default.
          - Include stable chronic conditions if assessed, monitored, or managed.

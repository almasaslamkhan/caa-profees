        ------------------------

        1. SOAP note (`note`)
          - Use the Assessment/Plan as the **primary source** to determine which conditions are billable at this encounter.
          - Use other sections (History, ROS, Physical exam, labs, imaging, etc.) to:
            * Confirm that a problem is truly present and addressed, and
            * Support specificity (e.g., right vs left, acute vs chronic, stage, BMI, severity).

        2. Extracted contexts (`contexts_json`)
          - `contexts_json` is a JSON array of objects such as:
            - `{ "problem": "...", "evidence": "..." }`
          - Treat these as the **set of candidate problems** for this encounter.
          - Focus on problems that:
            * Are clearly active or current (acute, chronic, follow-up, exacerbation), and
            * Are actually evaluated, treated, or monitored in the Assessment/Plan.
          - Avoid introducing completely new problems that are not aligned with any `problem` in `contexts_json`, except for minor rewording (e.g., “HTN” vs “hypertension”).

        3. Candidate codes (`candidates_json`)
          - `candidates_json` is a JSON array of objects such as:
            - `{ "code": "I10", "description": "Essential (primary) hypertension", "rationale": "...", "source": "search" or "direct", "score": 0.0 }`

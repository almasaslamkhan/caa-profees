[tox]
isolated_build = True
skipsdist = true
envlist = profees_test_env_py3
toxworkdir = {toxinidir}/.tox

[testenv]
changedir = {toxinidir}
basepython = python3
deps =
    uv==0.9.10
allowlist_externals =
    gcc
    gcc-c++
    cd
    curl
    bash
    make

[testenv:profees_test_env_py3]
setenv =
    PYTHONIOENCODING = utf8
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONHASHSEED = 1
    COVERAGE_SUMMARY_FILE = {env:COVERAGE_SUMMARY_FILE:coverage/coverage-summary.json}

commands =
    # Install project dependencies with uv, using pyproject/lock file
    uv sync --active --extra dev

    # Linting & formatting checks
    flake8 src tests
    black --check src tests
    isort --check-only src tests

    # Tests
    python -c "from pathlib import Path; Path('coverage').mkdir(exist_ok=True)"
    pytest --cov profees_coding --cov-report term-missing --cov-report json:{env:COVERAGE_SUMMARY_FILE} tests/

[flake8]
max-line-length = 150
ignore = F401,F403,E203,E226,F405,E501,W503
exclude = .tox,*.egg,build,data,dist,.venv

[pytest]
testpaths = tests

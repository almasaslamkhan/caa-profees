[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profees-skills"
version = "0.0.0"  # will be set during build
description = "Reusable Proactive PCA skills for professional-fees coding workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# Retain the legacy source tree without publishing PCA's reserved namespace.
include = ["profees_ambulatory_coding_skills*"]
exclude = ["skills_package", "skills_package.*"]

[tool.setuptools.package-data]
"profees_ambulatory_coding_skills" = ["skills/**"]

[tool.setuptools.exclude-package-data]
"*" = [
  "skills/profees-coding/*/tests/*",
  "skills/profees-coding/*/tests/*.py",
  "skills/profees-coding/*/evals/*",
  "skills/profees-coding/*/evals/*.py",
  "skills/**/__pycache__/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
